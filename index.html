<style>
  :root {
    --bg: #EEF3F8;
    --card: #ffffff;
    --ink: #0F1B2D;
    --ink-soft: #4A5A6E;
    --line: #D3DDE8;
    --brand: #0B5FA5;
    --brand-dark: #03204C;
    --cyan: #33B1E4;
    --accent: #F2A900;
    --danger: #C0362C;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  .input {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font-size: 16px;
  }
  .input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(51,177,228,.30); }
  .btn-primary {
    background: var(--brand); color: white; border-radius: 12px; padding: 13px 18px;
    font-weight: 600; text-align: center; border: none;
  }
  .btn-primary:disabled { opacity: .45; }
  .btn-primary:active { background: var(--brand-dark); }
  .btn-ghost {
    background: transparent; color: var(--brand); border: 1px solid var(--brand);
    border-radius: 12px; padding: 12px 16px; font-weight: 600;
  }
  .pin-dot {
    width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--brand); background: transparent;
  }
  .pin-dot.filled { background: var(--brand); }
  .keypad button {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    font-size: 24px; font-weight: 600; color: var(--ink); padding: 0; min-height: 58px;
  }
  .keypad button:active { background: var(--line); }
  .tab-btn { flex: 1; text-align: center; padding: 12px 0; font-weight: 600; color: var(--ink-soft); border-bottom: 3px solid transparent; }
  .tab-btn.active { color: var(--brand); border-color: var(--cyan); }
  .hero { background: var(--brand-dark); color: #fff; position: relative; overflow: hidden; }
  .hero::after { content: ""; position: absolute; left: -10%; right: -10%; bottom: -38px; height: 70px; border-radius: 50%; background: var(--bg); }
  .logo-chip { background: #fff; border-radius: 10px; padding: 5px 8px; display: inline-flex; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  .logo-chip img { display: block; height: 22px; width: auto; }
  .mano { display: block; }
  @keyframes aguja { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-6deg); } }
  .mano-anim .aguja { transform-origin: 60px 58px; animation: aguja 2.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .mano-anim .aguja { animation: none; } }
  .photo-slot {
    aspect-ratio: 1; border-radius: 12px; border: 2px dashed var(--line);
    display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
    background: var(--card);
  }
  .photo-slot img { width: 100%; height: 100%; object-fit: cover; }
  .badge { font-size: 12px; padding: 4px 10px; border-radius: 999px; font-weight: 600; }
  /* ---------- Intro animada ---------- */
  .intro { position: fixed; inset: 0; z-index: 100; background: #03204C; color: #fff; display: flex; flex-direction: column;
           padding: calc(14px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px)); overflow: hidden;
           transition: opacity .45s ease; }
  .intro.salir { opacity: 0; pointer-events: none; }
  .intro-saltar { position: absolute; top: calc(14px + env(safe-area-inset-top,0px)); right: 16px; background: rgba(255,255,255,.14);
                  color: #fff; border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; z-index: 2; }
  .intro-top { display: flex; flex-direction: column; gap: 14px; }
  .intro-logo { align-self: flex-start; opacity: 0; animation: iFade .5s .1s forwards; }
  .intro-h1 { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; }
  .intro-h1 .t1 { font-size: 30px; font-weight: 800; opacity: 0; transform: translateY(10px); animation: iUp .5s .35s forwards; }
  .intro-h1 .t2 { font-size: 62px; font-weight: 900; letter-spacing: 1px; color: #F2C230; opacity: 0; transform: scale(.6);
                  transform-origin: left center; animation: iPop .55s .6s cubic-bezier(.2,1.6,.4,1) forwards; text-shadow: 0 4px 0 #B88100; }
  .intro-h1 .t3 { margin-top: 10px; background: #33B1E4; color: #03204C; font-weight: 800; font-size: 17px; padding: 6px 12px; border-radius: 8px;
                  opacity: 0; transform: translateX(-16px); animation: iSide .5s .95s forwards; }
  .intro-escena { flex: 1; width: 100%; min-height: 0; margin-top: 8px; }
  .i-panel { opacity: 0; transform: translateY(14px); transform-box: fill-box; animation: iUp .5s 1.5s forwards; }
  .i-onda { stroke-dasharray: 320; stroke-dashoffset: 320; animation: iTrazo 1.4s 1.9s ease-out forwards; }
  .i-led { opacity: .25; animation: iLed .5s 3.2s 4 alternate; }
  .i-tecnico { opacity: 0; transform: translateX(60px); animation: iSideR .7s .5s ease-out forwards; }
  .i-ola { transform-box: fill-box; transform-origin: center; transform: scale(.05); opacity: 0; }
  .i-ola.o1 { animation: iOla 1.8s 1.2s infinite; } .i-ola.o2 { animation: iOla 1.8s 1.8s infinite; } .i-ola.o3 { animation: iOla 1.8s 2.4s infinite; }
  .i-chorro circle { opacity: 0; }
  .i-chorro .g1 { animation: iGota1 1s .9s infinite; } .i-chorro .g2 { animation: iGota2 1s 1.15s infinite; }
  .i-chorro .g3 { animation: iGota3 1s 1.4s infinite; } .i-chorro .g4 { animation: iGota4 1s 1.65s infinite; }
  .i-alerta { opacity: 0; animation: iFade .4s 3.1s forwards; }
  .i-ping { transform-box: fill-box; transform-origin: center; animation: iPing 1s 3.1s infinite; }
  .intro-pie { display: flex; flex-direction: column; gap: 12px; opacity: 0; animation: iFade .6s 3.6s forwards; }
  .intro-app { display: flex; align-items: center; gap: 12px; }
  .intro-app b { display: block; font-size: 22px; font-weight: 900; }
  .intro-app small { color: #C9D8EA; font-size: 13px; }
  .intro-barra { height: 4px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; }
  .intro-barra i { display: block; height: 100%; width: 0; background: #33B1E4; animation: iBarra 5.4s linear forwards; }
  @keyframes iFade { to { opacity: 1; } }
  @keyframes iUp { to { opacity: 1; transform: none; } }
  @keyframes iSide { to { opacity: 1; transform: none; } }
  @keyframes iSideR { to { opacity: 1; transform: none; } }
  @keyframes iPop { to { opacity: 1; transform: scale(1); } }
  @keyframes iTrazo { to { stroke-dashoffset: 0; } }
  @keyframes iLed { to { opacity: 1; } }
  @keyframes iOla { 0% { transform: scale(.05); opacity: .9; } 100% { transform: scale(1); opacity: 0; } }
  @keyframes iPing { 0% { transform: scale(.6); opacity: 1; } 100% { transform: scale(1.8); opacity: 0; } }
  @keyframes iGota1 { 0% { opacity: 1; transform: translate(0,0); } 100% { opacity: 0; transform: translate(-16px,-26px); } }
  @keyframes iGota2 { 0% { opacity: 1; transform: translate(0,0); } 100% { opacity: 0; transform: translate(12px,-30px); } }
  @keyframes iGota3 { 0% { opacity: 1; transform: translate(0,0); } 100% { opacity: 0; transform: translate(-4px,-34px); } }
  @keyframes iGota4 { 0% { opacity: 1; transform: translate(0,0); } 100% { opacity: 0; transform: translate(20px,-18px); } }
  @keyframes iBarra { to { width: 100%; } }
  @media (prefers-reduced-motion: reduce) {
    .intro *, .intro *::before { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
  }

  /* ---------- Menú de formularios ---------- */
  .menu-hero { position: relative; overflow: hidden; background: #0B5FA5; color: #fff; min-height: 236px;
               padding: calc(12px + env(safe-area-inset-top,0px)) 16px 0; }
  .menu-paisaje { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; }
  .menu-top { position: relative; display: flex; align-items: center; justify-content: space-between; }
  .menu-salir { background: rgba(3,32,76,.55); color: #fff; border: 1px solid rgba(255,255,255,.35); border-radius: 10px;
                padding: 8px 14px; font-weight: 700; font-size: 14px; }
  .menu-txt { position: relative; margin-top: 14px; }
  .menu-hola { display: inline-block; background: #03204C; color: #fff; font-size: 13px; font-weight: 700;
               padding: 4px 10px; border-radius: 999px; }
  .menu-tit { font-size: 34px; font-weight: 900; line-height: 1.05; margin-top: 6px; letter-spacing: -.5px;
              text-shadow: 0 2px 0 rgba(3,32,76,.45); }
  .menu-sub { font-size: 14px; font-weight: 600; color: #E1F3FB; margin-top: 2px; }
  .menu-elige { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 800; color: var(--brand-dark); }
  .menu-elige-num { width: 32px; height: 32px; border-radius: 10px; background: var(--brand); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
  .form-card { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--card);
               border: 1.5px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
  .form-card:not(:disabled):active { transform: scale(.99); }
  .form-card:disabled { opacity: .78; }
  .form-ico { width: 64px; height: 64px; border-radius: 16px; background: #E1F3FB; display: grid; place-items: center; flex-shrink: 0; }
  .preview-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 60;
    display: flex; flex-direction: column;
  }
  .cam-overlay { position: fixed; inset: 0; background: #000; z-index: 70; display: flex; flex-direction: column; }
  .cam-overlay video { flex: 1; width: 100%; min-height: 0; object-fit: cover; background: #000; }
  .cam-bar { display: flex; align-items: center; justify-content: space-between; padding: 18px 28px calc(22px + env(safe-area-inset-bottom,0px)); }
  .cam-shutter { width: 76px; height: 76px; border-radius: 50%; background: #fff; border: 6px solid rgba(255,255,255,.35); background-clip: padding-box; }
  .cam-shutter:active { transform: scale(.94); }
  .cam-side { width: 64px; color: #fff; font-size: 15px; font-weight: 600; background: none; border: 0; }
  .preview-overlay img {
    flex: 1; width: 100%; object-fit: contain; touch-action: pinch-zoom;
  }
  .toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    background: var(--brand-dark); color: white; padding: 14px 16px; border-radius: 14px;
    font-weight: 600; text-align: center; z-index: 50; box-shadow: 0 10px 30px rgba(0,0,0,.25); pointer-events: none;
    transition: transform .25s ease, opacity .25s ease;
  }
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>

<script>
(function () {
  "use strict";

  /* ============ CONFIGURACION: editar aqui ============ */
  /* ================= CONFIGURACIÓN DEL SERVIDOR (Google Apps Script) ================= */
  // Los valores reales se escriben en config.js (así no hay que tocar este archivo)
  const API_URL = (window.ECRF_CONFIG && window.ECRF_CONFIG.API_URL) || "";
  const TOKEN   = (window.ECRF_CONFIG && window.ECRF_CONFIG.TOKEN) || "";
  const APP_VERSION = "1.0.0";
  const apiListo = () => /^https:\/\/script\.google\.com\//.test(API_URL);

  async function apiGet(params) {
    const q = new URLSearchParams({ ...params, token: TOKEN, t: Date.now() });
    const r = await fetch(API_URL + "?" + q.toString());
    if (!r.ok) throw { code: "http_" + r.status };
    const j = await r.json(); if (!j.ok) throw { code: j.error || "servidor", message: j.msg }; return j;
  }
  async function apiPost(body) {

  /* ---------------- Almacenamiento en el celular (IndexedDB) ---------------- */
  const IDB = (() => {
    let p;
    const abrir = () => p || (p = new Promise(ok => {
      try {
        const r = indexedDB.open("gpfo0381", 3);
        r.onupgradeneeded = () => {
          const d = r.result;
          if (!d.objectStoreNames.contains("regs")) d.createObjectStore("regs", { keyPath: "id" });
          if (!d.objectStoreNames.contains("fotoOps")) d.createObjectStore("fotoOps", { keyPath: "id" });
          if (!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
        };
        r.onsuccess = () => ok(r.result); r.onerror = () => ok(null);
      } catch (e) { ok(null); }
    }));
    const rq = r => new Promise((ok, mal) => { r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error); });
    const st = async (m, n = "regs") => { const d = await abrir(); if (!d) throw new Error("almacenamiento no disponible"); return d.transaction(n, m).objectStore(n); };
    return {
      put: async v => rq((await st("readwrite")).put(v)),
      del: async k => rq((await st("readwrite")).delete(k)),
      all: async () => rq((await st("readonly")).getAll()),
      fput: async v => rq((await st("readwrite", "fotoOps")).put(v)),
      fdel: async k => rq((await st("readwrite", "fotoOps")).delete(k)),
      fall: async () => rq((await st("readonly", "fotoOps")).getAll()),
      kget: async k => rq((await st("readonly", "kv")).get(k)),
      kput: async (v, k) => rq((await st("readwrite", "kv")).put(v, k)),
    };
  })();
  const leerLS = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || "null") ?? d; } catch (e) { return d; } };
  const guardarLS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const nuevoId = pre => pre + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);

  // Registros antiguos guardados en localStorage (con fotos en texto) pasan a IndexedDB
  async function migrarLegado() {
    const viejos = leerLS("gpfo_registros", []);
    if (!viejos.length) return;
    try {
      for (const r of viejos) {
        const blobs = await Promise.all((r.fotosB64 || []).map(u => fetch(u).then(x => x.blob())));
        const { fotosB64, ...resto } = r;
        await IDB.put({ ...resto, id: r.id || nuevoId("r"), fotosBlobs: blobs, subido: false });
      }
      localStorage.removeItem("gpfo_registros");
    } catch (e) {}
  }

  let sincronizando = false;

  async function porSubir() {
    if (state.syncMode !== "cloud") return 0;
    try { return (await IDB.all()).length + (await IDB.fall()).length + leerLS("gpfo_edit_ops", []).length; } catch (e) { return 0; }
  }
  async function badgeHTML() {
    if (state.syncMode === "local") return `<span class="badge" style="background:#FFF1C7;color:#6B4A00">● Guardado en el celular</span>`;
    const n = await porSubir();
    if (!enLinea()) return `<span class="badge" style="background:#FFF1C7;color:#6B4A00">● Sin internet${n ? " · " + n + " por subir" : ""}</span>`;
    if (n) return `<span class="badge" style="background:#E1F3FB;color:#0B4A6B">● Subiendo ${n}…</span>`;
    return `<span class="badge" style="background:#DDF3E7;color:#12613B">● Todo subido</span>`;
  }
  async function pintarEstadoSync() {
    const el = document.getElementById("syncBadge");

  async function flushPendOps() {
    const ops = leerLS("gpfo_pend_ops", []);
    while (ops.length) {
      const op = ops[0];
      if (op.op === "add") await db.collection("pendientes").doc(op.id).set(op.data);
      else { try { await db.collection("pendientes").doc(op.id).delete(); } catch (e) { if (!/not.?found/i.test(String(e && (e.code || e.message)))) throw e; } }
      ops.shift(); guardarLS("gpfo_pend_ops", ops);
    }
  }
  async function sincronizar() {
    if (sincronizando || state.syncMode !== "cloud" || !enLinea()) { pintarEstadoSync(); return; }
    sincronizando = true; let subidos = 0;
    pintarEstadoSync();
    try {
      await flushPendOps();
      const edits = leerLS("gpfo_edit_ops", []);
      while (edits.length) {
        await db.collection("registros").doc(edits[0].id).update(edits[0].data);   // ediciones: mapa por fecha, reintentar no duplica
        edits.shift(); guardarLS("gpfo_edit_ops", edits); subidos++;
      }
      const fops = (await IDB.fall()).sort((a, b) => a.creadoEn - b.creadoEn);
      for (const op of fops) {
        for (let i = op.subidas.length; i < op.nuevas.length; i++) {
          const up = await assets.upload(op.nuevas[i], { type: "image/jpeg", meta: { ...(op.meta || {}), n: i + 1 } });
          op.subidas.push(up.id); await IDB.fput(op);
        }
        await db.collection("registros").doc(op.regId).update({ fotos: op.mantener.concat(op.subidas), ediciones: { [op.ts]: op.nota } });
        for (const id of op.quitar) { try { await assets.delete(id); } catch (e) {} }
        await IDB.fdel(op.id); subidos++;
      }
      const locales = (await IDB.all()).sort((a, b) => (a.creadoEn || 0) - (b.creadoEn || 0));
      for (const r of locales) {
        const blobs = r.fotosBlobs || [];
        const ids = r.fotoIds || [];
        for (let i = ids.length; i < blobs.length; i++) {       // retoma desde la última foto subida
          const up = await assets.upload(blobs[i], { type: "image/jpeg", meta: { form: formDe(r), nis: r.nis, fecha: r.fecha, hora: r.hora, operario: r.operario, n: i + 1 } });
          ids.push(up.id); r.fotoIds = ids; await IDB.put(r);
        }
        const { fotosBlobs, fotoIds, subido, pendienteId, local, nFotos, ...datos } = r;
        await db.collection("registros").doc(r.id).set({ ...datos, fotos: ids });   // mismo id: nunca se duplica
        await IDB.del(r.id); subidos++;
      }
    } catch (e) { /* sin conexión o error: se reintenta solo */ }
    sincronizando = false;
    if (subidos) { toast("Subido al servidor (" + subidos + ")"); await loadRegistros(); if (state.tab !== "nuevo") render(); }
    pintarEstadoSync();
  }

  const esSupervisor = () => { const u = listaUsuarios().find(o => o.name === state.operario); return u ? u.rol === "SUPERVISOR" : /supervisor/i.test(state.operario || ""); };

  async function loadRegistros() {
    await loadPendientes();
    let locales = [];
    try { locales = await IDB.all(); } catch (e) {}
    const vistaLocal = locales.map(r => ({ ...r, nFotos: (r.fotosBlobs || []).length, local: true }))
                              .sort((a, b) => (b.creadoEn || 0) - (a.creadoEn || 0));
    if (state.syncMode !== "cloud") { state.registros = vistaLocal; return; }
    let nube = leerLS("gpfo_cache_registros", []);
    if (enLinea()) {
      try {
        const snap = await db.collection("registros").orderBy("creadoEn", "desc").limit(200).get();
        nube = snap.docs.map(d => ({ id: d.id, ...d.data(), nFotos: (d.data().fotos || []).length }));
        guardarLS("gpfo_cache_registros", nube);
      } catch (e) {}
    }
    const editsPend = leerLS("gpfo_edit_ops", []);
    if (editsPend.length) nube = nube.map(r => {
      const mis = editsPend.filter(e => e.id === r.id);
      if (!mis.length) return r;
      let x = { ...r, editPendiente: true };
      for (const e of mis) x = { ...x, ...e.data, ediciones: { ...(x.ediciones || {}), ...(e.data.ediciones || {}) } };
      return x;
    });
    let fopsPend = [];
    try { fopsPend = await IDB.fall(); } catch (e) {}
    if (fopsPend.length) nube = nube.map(r => {
      const op = fopsPend.find(o => o.regId === r.id);
      return op ? { ...r, fotoPendiente: true, editPendiente: true, nFotos: op.mantener.length + op.nuevas.length,
                    ediciones: { ...(r.ediciones || {}), [op.ts]: op.nota } } : r;
    });
    const idsLocales = new Set(vistaLocal.map(r => r.id));
    state.registros = [...vistaLocal, ...nube.filter(r => !idsLocales.has(r.id))];
  }

  function fmtCaptureStamp(d) {
    const meses = ["ene","feb","mar","abr","may","jun","jul","ago","sept","oct","nov","dic"];
    const ampm = d.getHours() >= 12 ? "p.m." : "a.m.";
    let h12 = d.getHours() % 12; if (h12 === 0) h12 = 12;
    const pad = n => String(n).padStart(2, "0");
    return `${d.getDate()} ${meses[d.getMonth()]} ${d.getFullYear()} ${h12}:${pad(d.getMinutes())}:${pad(d.getSeconds())} ${ampm}`;
  }

  // "SANTA ANITA" -> "Santa Anita" (deja en minúscula de, del, la, los...)
  function tituloWM(t) {
    const menores = new Set(["de","del","la","las","los","el","y"]);
    const prefijos = new Set(["urb","asoc","a.h","p.j","apv","coop","agru","c.h","ca","av","jr","ps","pr","al","gr","ml"]);
    const ws = String(t || "").toLowerCase().replace(/\s+/g, " ").trim().split(" ");
    return ws.map((w, i) => {
      if (/^([a-z]\.)+[a-z]?\.?$/.test(w)) return w.toUpperCase();          // P.J, A.H, C.H
      if (i > 0 && menores.has(w) && !prefijos.has(ws[i - 1])) return w;
      return w.charAt(0).toUpperCase() + w.slice(1);
    }).join(" ");
  }

  /* ---------------- Watermark ---------------- */
  function watermarkPhoto(file, info) {
    const dato = info || state.nisSel;
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = async () => {
        try { await document.fonts.load('400 40px Roboto'); } catch (e) {}
        const MAXW = 1600;
        const scale = Math.min(1, MAXW / img.width);
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);

        const lines = [];
        lines.push(fmtCaptureStamp(new Date()));
        if (dato) {
          if (String(dato.direccion || "").trim()) lines.push(tituloWM(dato.direccion));
          if (String(dato.urb || "").trim()) lines.push(tituloWM(dato.urb));
          if (String(dato.distrito || "").trim()) lines.push(tituloWM(dato.distrito));
        }
        lines.push(PROVINCIA);
        const c = state.coords || {};
        if (typeof c.alt === "number") lines.push(`Altitud:${c.alt.toFixed(1)}msnm`);
        if (dato) lines.push(`NIS:${dato.nis}`);

        // Estilo como la cámara de referencia: abajo a la derecha, letra blanca con sombra, sin franja
        const fontSize = Math.max(14, Math.round(Math.min(w, h) * 0.042));
        const lineGap = Math.round(fontSize * 1.2);
        const marginX = Math.round(w * 0.025);
        const marginBottom = Math.round(h * 0.018);
        const x = w - marginX;

        ctx.font = `400 ${fontSize}px Roboto, "Segoe UI", Arial, sans-serif`;
        ctx.textAlign = "right";
        ctx.textBaseline = "alphabetic";
        ctx.lineJoin = "round";

        let y = h - marginBottom - (lines.length - 1) * lineGap;
        lines.forEach(line => {
          // contorno fino para que se lea sobre fondos claros
          ctx.save();
          ctx.lineWidth = Math.max(1.5, fontSize * 0.08);
          ctx.strokeStyle = "rgba(0,0,0,0.45)";
          ctx.strokeText(line, x, y);
          ctx.restore();
          // texto blanco con sombra suave
          ctx.save();
          ctx.shadowColor = "rgba(0,0,0,0.8)";
          ctx.shadowBlur = Math.max(2, fontSize * 0.22);
          ctx.shadowOffsetX = Math.max(1, Math.round(fontSize * 0.05));
          ctx.shadowOffsetY = Math.max(1, Math.round(fontSize * 0.05));
          ctx.fillStyle = "#ffffff";
          ctx.fillText(line, x, y);
          ctx.restore();
          y += lineGap;
        });

        canvas.toBlob(blob => {
          URL.revokeObjectURL(url);
          resolve(blob);
        }, "image/jpeg", 0.9);
      };
      img.onerror = reject;
      img.src = url;
    });
  }

  async function destinoFoto(fileOrBlob) {
    if (state.camDestino === "editar") return fotoEdicion(fileOrBlob);
    return procesarFoto(fileOrBlob);
  }
  async function procesarFoto(fileOrBlob) {
    if (state.fotos.length >= 5) { toast("Maximo 5 fotos", true); return; }
    ensureLocation();
    toast("Procesando foto...");
    try {
      const watermarked = await watermarkPhoto(fileOrBlob);
      const previewUrl = URL.createObjectURL(watermarked);
      state.fotos.push({ blob: watermarked, previewUrl });
      state.previewIdx = state.fotos.length - 1; // muestra de frente la foto con marca de agua
      render();
    } catch (e) {
      toast("No se pudo procesar la foto", true);
    }
  }

  // Respaldo: cámara nativa del celular (solo si la cámara dentro de la app no está disponible)
  async function handlePhotoCapture(fileInput) {
    const file = fileInput.files && fileInput.files[0];
    fileInput.value = "";
    if (file) await destinoFoto(file);
  }

  /* ---------------- Cámara dentro de la app ---------------- */
  let camStream = null, camaraNativa = false;
  function cerrarCamara() {
    if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
    const el = document.getElementById("camOverlay"); if (el) el.remove();
  }
  async function abrirCamara() {
    if (state.camDestino !== "editar" && state.fotos.length >= 5) { toast("Maximo 5 fotos", true); return; }
    ensureLocation();
    if (camaraNativa || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
      document.getElementById("inpFoto").click(); return;
    }
    const el = document.createElement("div");
    el.id = "camOverlay"; el.className = "cam-overlay";
    el.innerHTML = `
      <video id="camVideo" autoplay playsinline muted></video>
      <div class="cam-bar">
        <button class="cam-side" id="camCancel">Cancelar</button>
        <button class="cam-shutter" id="camShot" aria-label="Tomar foto" disabled></button>
        <span class="cam-side"></span>
      </div>`;
    document.body.appendChild(el);
    document.getElementById("camCancel").onclick = cerrarCamara;
    try {
      camStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false
      });
      const v = document.getElementById("camVideo");
      if (!v) { cerrarCamara(); return; }
      v.srcObject = camStream;
      await v.play().catch(() => {});
      const shot = document.getElementById("camShot");
      shot.disabled = false;
      shot.onclick = () => {
        if (!v.videoWidth) return;
        const c = document.createElement("canvas");
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
        c.toBlob(blob => { cerrarCamara(); if (blob) destinoFoto(blob); }, "image/jpeg", 0.95);
      };
    } catch (e) {
      // Sin permiso o sin cámara dentro de la app: se usa la cámara del celular
      camaraNativa = true;
      el.querySelector(".cam-bar").innerHTML = `
        <button class="cam-side" id="camCancel2">Cancelar</button>
        <button class="btn-primary" id="camNativa" style="flex:1;margin:0 12px">Abrir cámara del celular</button>`;
      document.getElementById("camCancel2").onclick = cerrarCamara;
      document.getElementById("camNativa").onclick = () => { cerrarCamara(); document.getElementById("inpFoto").click(); };
    }
  }

  function removeFoto(idx) {
    URL.revokeObjectURL(state.fotos[idx].previewUrl);
    state.fotos.splice(idx, 1);
    render();
  }

  /* ---------------- Guardar registro ---------------- */
  function validRecord() {
    const base = state.nisSel && String(state.nisSel.direccion || "").trim() && String(state.nisSel.distrito || "").trim() && state.fotos.length >= 1;
    if (state.form === "GPFO0416") {
      const m = state.m;
      return !!(base && state.codigoSgio && m.tecnico && m.cFecha && m.cUbi && m.cPres !== "" && m.cCaudal !== ""
                && m.sFecha && m.sUbi && m.sPres !== "" && m.sCaudal !== "");
    }
    if (state.form === "GPFO0405")
      return !!(base && state.codigoSgio && state.fechaDeteccion && state.ubicacion && state.caudal !== "" && state.fechaVerif && state.situacion);
    return !!(base && state.presion !== "" && state.fecha && state.hora);
  }

  async function guardarRegistro() {
    if (!validRecord() || state.saving) return;
    state.saving = true; render();

    const base = {
      operario: state.operario,
      nis: state.nisSel.nis,
      direccion: String(state.nisSel.direccion || "").trim(),
      urb: String(state.nisSel.urb || "").trim(),
      distrito: String(state.nisSel.distrito || "").trim(),
      sector: String(state.nisSel.sector || "").trim(),
      datosManual: !!state.nisSel.manual,
      ccss: state.nisSel.ccss || "", latNis: state.nisSel.latNis ?? null, lonNis: state.nisSel.lonNis ?? null,
      form: state.form,
      ...(state.form === "GPFO0416" ? (() => {
        const m = state.m, r = calcVariacion(m.cCaudal, m.sCaudal);
        return {
          codigoSgio: state.codigoSgio, tecnico: m.tecnico,
          fechaContratista: m.cFecha, ubicacionContratista: m.cUbi, presionContratista: Number(m.cPres), caudalContratista: Number(m.cCaudal),
          fechaSedapal: m.sFecha, ubicacionSedapal: m.sUbi, presionSedapal: Number(m.sPres), caudalSedapal: Number(m.sCaudal),
          variacion: r.variacion, errorPct: r.error, fecha: m.sFecha, hora: nowHM()
        };
      })() : state.form === "GPFO0405" ? {
        codigoSgio: state.codigoSgio, fechaDeteccion: state.fechaDeteccion, ubicacion: state.ubicacion,
        caudal: Number(state.caudal), fechaVerificacion: state.fechaVerif, situacion: state.situacion,
        fecha: state.fechaVerif, hora: nowHM()
      } : {
        presion: Number(state.presion), fecha: state.fecha, hora: state.hora
      }),
      lat: state.coords ? state.coords.lat : null,
      lon: state.coords ? state.coords.lon : null,
      creadoEn: Date.now()
    };

    try {
      const reg = { id: nuevoId("r"), ...base, fotosBlobs: state.fotos.map(f => f.blob), subido: false };
      await IDB.put(reg);                                   // queda guardado en el celular aunque no haya internet
      if (state.pendienteId) await borrarPendiente(state.pendienteId);
      toast(state.syncMode === "cloud" && !enLinea() ? "Guardado en el celular. Se subirá cuando haya internet" : "Registro guardado ✅");
      resetForm();
      await loadRegistros();
      sincronizar();
    } catch (e) {
      toast("Error al guardar: " + (e && (e.code || e.message) ? (e.code || e.message) : "intenta de nuevo"), true);
    }
    state.saving = false;
    render();
  }

  function blobToDataURL(blob) {
    return new Promise((resolve) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.readAsDataURL(blob);
    });
  }

  function resetForm() {
    state.fotos.forEach(f => URL.revokeObjectURL(f.previewUrl));
    state.fotos = [];
    state.nisSel = null;
    state.nisQuery = "";
    state.pendienteId = null;
    state.coords = null;   // el GPS se vuelve a tomar en el siguiente registro
    state.presion = "";
    state.fecha = todayISO();
    state.hora = nowHM();
    state.codigoSgio = ""; state.fechaDeteccion = ""; state.ubicacion = ""; state.caudal = "";
    state.fechaVerif = todayISO(); state.situacion = "Reparada";
    state.m = { tecnico: "", cFecha: "", cUbi: "", cPres: "", cCaudal: "", sFecha: todayISO(), sUbi: "", sPres: "", sCaudal: "" };
  }

  /* ---------------- Export ---------------- */
  async function exportarTodo() {
    const data = JSON.stringify(regsDelForm().map(({ fotosBlobs, local, nFotos, editPendiente, ...r }) => r), null, 2);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type: "application/json" }));
    a.download = `${state.form}_registros_${todayISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    toast("Descarga lista");
  }

  /* ---------------- Toast ---------------- */
  let toastTimer = null;
  function toast(msg, isError) {
    let el = document.getElementById("toast");
    if (!el) {
      el = document.createElement("div");
      el.id = "toast";
      el.className = "toast";
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.background = isError ? "var(--danger)" : "var(--brand-dark)";
    el.style.opacity = "1";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.style.opacity = "0"; }, 2200);
  }

  /* ================= RENDER ================= */
  function render() {
    if (!state.operario) renderLogin();
    else if (!state.form) renderMenu();
    else renderMain();
    renderPreviewOverlay();
  }

  function renderPreviewOverlay() {
    let el = document.getElementById("previewOverlay");
    if (state.previewIdx === null || !state.fotos[state.previewIdx]) {
      if (el) el.remove();
      return;
    }
    const foto = state.fotos[state.previewIdx];
    if (!el) {
      el = document.createElement("div");
      el.id = "previewOverlay";
      el.className = "preview-overlay";
      document.body.appendChild(el);
    }
    el.innerHTML = `
      <div class="flex items-center justify-between px-4 py-3" style="padding-top:calc(12px + env(safe-area-inset-top,0px))">
        <div class="text-white text-sm font-semibold">Foto ${state.previewIdx + 1} de ${state.fotos.length}</div>
        <button id="pvClose" class="text-white text-2xl leading-none">✕</button>
      </div>
      <img src="${foto.previewUrl}">
      <div class="flex gap-3 px-4 py-4" style="padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))">
        <button id="pvDelete" class="btn-primary flex-1" style="background:var(--danger)">Eliminar foto</button>
        <button id="pvOk" class="btn-primary flex-1">Se ve bien</button>
      </div>
    `;
    document.getElementById("pvClose").onclick = () => { state.previewIdx = null; render(); };
    document.getElementById("pvOk").onclick = () => { state.previewIdx = null; render(); };
    document.getElementById("pvDelete").onclick = () => {
      const idx = state.previewIdx;
      state.previewIdx = null;
      removeFoto(idx);
    };
  }

      };
    });

  function escA(v) { return String(v ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  /* ---------- Búsqueda de NIS en la base de SEDAPAL (servidor) ---------- */
  const NIS_REMOTO = {};        // NIS ya consultados (se guardan en el celular para usar sin internet)
  const BUSCANDO = {};
  const desdeServidor = (nis, d) => ({ nis, direccion: d.dir || "", urb: d.urb || "", distrito: d.dist || "", sector: d.sec || "",
                                        ccss: d.ccss || "", latNis: d.lat === "" ? null : d.lat, lonNis: d.lon === "" ? null : d.lon });
  async function cargarCacheNis() {
    try { const c = await IDB.kget("nisCache"); if (c) Object.assign(NIS_REMOTO, c); } catch (e) {}
  }
  async function guardarCacheNis() {
    try {
      const claves = Object.keys(NIS_REMOTO);
      if (claves.length > 5000) claves.slice(0, claves.length - 5000).forEach(k => delete NIS_REMOTO[k]);
      await IDB.kput(NIS_REMOTO, "nisCache");
    } catch (e) {}
  }
  function nisLocal(nis) {
    if (NIS_REMOTO[nis]) return NIS_REMOTO[nis];
    return NIS_DB.find(r => r.nis === nis) || null;
  }
  async function buscarNisServidor(nis) {
    if (!apiListo() || !enLinea() || BUSCANDO[nis] || NIS_REMOTO[nis] !== undefined) return;
    BUSCANDO[nis] = true;
    try {
      const r = await apiGet({ action: "nis", nis });
      NIS_REMOTO[nis] = r.dato ? desdeServidor(nis, r.dato) : null;   // null = no existe en la base
      guardarCacheNis();
    } catch (e) { /* sin conexión: se podrá completar a mano */ }
    delete BUSCANDO[nis];
  }
  const estadoBusqueda = q => q.length < 7 ? "" : BUSCANDO[q] ? "buscando" : NIS_REMOTO[q] === null ? "noexiste"
                         : nisLocal(q) ? "ok" : (apiListo() && enLinea() ? "pendiente" : "sinred");
  function seleccionarNis(r) {
    state.nisSel = { nis: r.nis, direccion: r.direccion || "", urb: r.urb || "", distrito: r.distrito || "", sector: r.sector || "",
                     ccss: r.ccss || "", latNis: r.latNis ?? null, lonNis: r.lonNis ?? null, manual: false };
    ensureLocation(); renderNuevo();
  }
  function urlMapa(lat, lon) { return "https://www.google.com/maps/search/?api=1&query=" + lat + "," + lon; }
  function botonMapa(o, id) {
    return o && o.latNis != null && o.lonNis != null
      ? `<a id="${id}" href="${urlMapa(o.latNis, o.lonNis)}" target="_blank" rel="noopener" class="btn-ghost w-full mt-3 inline-flex items-center justify-center gap-2" style="text-decoration:none">📍 Ver en mapa</a>`
      : "";
  }

  function matchNis(q) {
    if (!q || q.length < 2) return [];
    const lista = NIS_DB.filter(r => r.nis.startsWith(q)).slice(0, 6);
    if (q.length === 7 && NIS_REMOTO[q] && !lista.some(r => r.nis === q)) lista.unshift(NIS_REMOTO[q]);
    return lista;
  }

      <div class="flex-1 px-4 py-4 pb-24" id="tabContent"></div>
    `;
    document.getElementById("btnInicio").onclick = () => {
      state.form = null; sessionStorage.removeItem("ecrf_form"); state.editId = null; render(); window.scrollTo(0, 0);

        if (!String(r.direccion).trim() || !String(r.distrito).trim()) { toast("Completa la dirección y el distrito", true); return; }
        const destino = esSupervisor() ? (document.getElementById("rutaPara") || {}).value || para : state.operario;
        if (state.pendientes.some(p => p.nis === r.nis && p.para === destino && formDe(p) === state.form)) { toast("Ese NIS ya está en la ruta", true); return; }
        try {
          await agregarPendiente({ form: state.form, nis: r.nis, ccss: r.ccss || "", latNis: r.latNis ?? null, lonNis: r.lonNis ?? null, direccion: r.direccion.trim(), urb: String(r.urb).trim(), distrito: r.distrito.trim(),
                                   sector: String(r.sector).trim(), manual: !!r.manual, para: destino, preparadoPor: state.operario, creadoEn: Date.now() });
          state.rutaSel = null; state.rutaQuery = "";
          toast("NIS " + r.nis + " agregado a la ruta");
          render();
        } catch (e) { toast("No se pudo agregar: " + (e && e.code ? e.code : "intenta de nuevo"), true); }
      };
    }
    document.querySelectorAll(".rutaBorrar").forEach(b => b.onclick = () => { state.quitarId = b.dataset.id; renderRuta(); });
    document.querySelectorAll(".rutaNo").forEach(b => b.onclick = () => { state.quitarId = null; renderRuta(); });
    document.querySelectorAll(".rutaSi").forEach(b => b.onclick = async () => {
      const p = state.pendientes.find(x => x.id === b.dataset.id);
      state.quitarId = null;
      await borrarPendiente(b.dataset.id);
      toast("NIS " + (p ? p.nis : "") + " quitado de la ruta");
      render();
    });
    document.querySelectorAll(".rutaCompletar").forEach(b => b.onclick = () => {
      const p = state.pendientes.find(x => x.id === b.dataset.id); if (!p) return;
      resetForm();
      state.nisSel = { nis: p.nis, direccion: p.direccion || "", urb: p.urb || "", distrito: p.distrito || "", sector: p.sector || "",
                       ccss: p.ccss || "", latNis: p.latNis ?? null, lonNis: p.lonNis ?? null, manual: !!p.manual };
      state.pendienteId = p.id;
      state.fecha = todayISO(); state.hora = nowHM();     // fecha y hora del momento en campo
      ensureLocation();
      state.tab = "nuevo"; render(); window.scrollTo(0, 0);
    });
  }

    const c = document.getElementById("tabContent");
    c.innerHTML = `
      ${state.syncMode === "cloud" && regsDelForm().some(r => r.local) ? `<button id="btnSubir" class="btn-primary w-full mb-3">Subir ahora</button>` : ""}
      <button id="btnExport" class="btn-ghost w-full mb-4">⬇ Descargar todo (JSON)</button>

    `;
    document.getElementById("btnExport").onclick = exportarTodo;
    const bs = document.getElementById("btnSubir");
    if (bs) bs.onclick = () => { if (!enLinea()) { toast("Sin internet: se subirá solo cuando vuelva la señal", true); return; } sincronizar(); };
    const wrap = document.getElementById("listaWrap");
    const lista = regsDelForm();
    if (!lista.length) {
      wrap.innerHTML = `<div class="text-center text-sm py-10" style="color:var(--ink-soft)">Aun no hay registros</div>`;
      return;

    const puedeEditar = r => r.operario === state.operario || esSupervisor();

      <div class="card p-4 mb-3">

          <div class="font-bold min-w-0">${escA(r.nis)} — ${escA(r.direccion)}</div>

        </div>
        <div class="text-sm" style="color:var(--ink-soft)">${r.urb ? escA(r.urb) + " · " : ""}${escA(r.distrito)}${r.sector ? " · Sector " + escA(r.sector) : ""}</div>
        ${formDe(r) === "GPFO0416" ? `
        <div class="text-sm mt-2" style="color:var(--ink)">Código SGIO <b>${escA(r.codigoSgio)}</b> · Técnico ${escA(r.tecnico)}</div>
        <div class="grid grid-cols-2 gap-2 mt-2 text-xs">
          <div class="p-2 rounded-lg" style="background:#FFF7E0"><b>Contratista</b> ${escA(dmy(r.fechaContratista))}<br>${escA(r.ubicacionContratista)} · ${escA(r.presionContratista)} mca · ${escA(r.caudalContratista)} L/día</div>
          <div class="p-2 rounded-lg" style="background:#E1F3FB"><b>SEDAPAL</b> ${escA(dmy(r.fechaSedapal))}<br>${escA(r.ubicacionSedapal)} · ${escA(r.presionSedapal)} mca · ${escA(r.caudalSedapal)} L/día</div>
        </div>
        <div class="text-sm mt-2">Variación <b>${escA(r.variacion)} L/día</b> · Error <b>${r.errorPct === "" || r.errorPct == null ? "—" : escA(r.errorPct) + "%"}</b></div>` :
        formDe(r) === "GPFO0405" ? `
        <div class="text-sm mt-2" style="color:var(--ink)">Código SGIO <b>${escA(r.codigoSgio)}</b> · ${escA(r.ubicacion)} · ${escA(r.caudal)} L/día</div>
        <div class="text-sm mt-1 flex items-center gap-2" style="color:var(--ink)">
          <span class="badge" style="background:${r.situacion === "Reparada" ? "#DDF3E7;color:#12613B" : "#FBE0DD;color:#8E2019"}">${escA(r.situacion)}</span>
          <span style="color:var(--ink-soft)">Detección ${escA(dmy(r.fechaDeteccion))} · Verificación ${escA(dmy(r.fechaVerificacion))}</span>
        </div>` : `
        <div class="text-sm mt-2" style="color:var(--ink)">Presión: <b>${escA(r.presion)} mca</b> · ${escA(dmy(r.fecha))} ${escA(r.hora)}</div>`}
        <div class="text-xs mt-1 flex items-center justify-between" style="color:var(--ink-soft)">
          <span>Operario: ${escA(r.operario)} · ${r.nFotos || 0} foto(s)${r.ediciones && Object.keys(r.ediciones).length ? " · <b>editado</b>" : ""}</span>
          ${state.syncMode === "cloud" ? (r.local || r.editPendiente ? `<span class="badge" style="background:#FFF1C7;color:#6B4A00">Por subir</span>` : `<span class="badge" style="background:#DDF3E7;color:#12613B">Subido</span>`) : ""}
        </div>
      </div>

    document.querySelectorAll(".regEditar").forEach(b => b.onclick = async () => {
      const r = state.registros.find(x => x.id === b.dataset.id); if (!r) return;
      (state.edFotos || []).forEach(f => f.tipo !== "asset" && URL.revokeObjectURL(f.url));
      state.edQuitadas = [];
      if (r.local) {
        state.edFotos = (r.fotosBlobs || []).map(bl => ({ tipo: "local", blob: bl, url: URL.createObjectURL(bl) }));
      } else {
        state.edFotos = (r.fotos || []).map(id => ({ tipo: "asset", id, url: fotoUrl(id) }));
      }
      state.edUbi = r.ubicacion || ""; state.edSit = r.situacion || "Reparada";
      state.editId = r.id; renderLista();
    });
    const fe = document.getElementById("formEdicion");
    if (fe) {
      inputCamaraGlobal();
      pintarFotosEdicion();
      fe.querySelectorAll("[data-num]").forEach(i => i.oninput = () => { i.value = i.value.replace(/\D/g, "").slice(0, Number(i.dataset.num)); });
      document.getElementById("edCancelar").onclick = () => { state.editId = null; renderLista(); };
      const releer = () => {   // conserva lo escrito al cambiar ubicación o situación
        const ids = ["ed_direccion","ed_urb","ed_distrito","ed_sector","ed_codigo","ed_fdet","ed_caudal","ed_fver",
                     "ed_tec","ed_cfecha","ed_cubi","ed_cpres","ed_ccau","ed_sfecha","ed_subi","ed_spres","ed_scau"];
        const vals = Object.fromEntries(ids.map(i => [i, (document.getElementById(i) || {}).value]));
        renderLista();
        ids.forEach(i => { const el = document.getElementById(i); if (el && vals[i] !== undefined) el.value = vals[i]; });

      document.querySelectorAll(".edSit").forEach(b => b.onclick = () => { state.edSit = b.dataset.s; releer(); });

        const r = state.registros.find(x => x.id === state.editId); if (!r) return;
        const v = id => document.getElementById(id).value.trim();
        const es405 = formDe(r) === "GPFO0405", es416 = formDe(r) === "GPFO0416";
        const nn = id => v(id) === "" ? "" : Number(v(id));
        const nuevo = es416 ? {
          direccion: v("ed_direccion"), urb: v("ed_urb"), distrito: v("ed_distrito"), sector: v("ed_sector"),
          codigoSgio: v("ed_codigo"), tecnico: v("ed_tec"),
          fechaContratista: v("ed_cfecha"), ubicacionContratista: v("ed_cubi"), presionContratista: nn("ed_cpres"), caudalContratista: nn("ed_ccau"),
          fechaSedapal: v("ed_sfecha"), ubicacionSedapal: v("ed_subi"), presionSedapal: nn("ed_spres"), caudalSedapal: nn("ed_scau")
        } : es405 ? {
          direccion: v("ed_direccion"), urb: v("ed_urb"), distrito: v("ed_distrito"), sector: v("ed_sector"),
          codigoSgio: v("ed_codigo"), fechaDeteccion: v("ed_fdet"), caudal: v("ed_caudal") === "" ? "" : Number(v("ed_caudal")),
          fechaVerificacion: v("ed_fver"), ubicacion: state.edUbi, situacion: state.edSit
        } : {
          direccion: v("ed_direccion"), urb: v("ed_urb"), distrito: v("ed_distrito"), sector: v("ed_sector"),
          presion: v("ed_presion") === "" ? "" : Number(v("ed_presion")), fecha: v("ed_fecha"), hora: v("ed_hora") };
        if (!nuevo.direccion || !nuevo.distrito) { toast("La dirección y el distrito son obligatorios", true); return; }
        if (es416) {
          if (!nuevo.codigoSgio || !nuevo.tecnico || !nuevo.fechaContratista || !nuevo.fechaSedapal ||
              [nuevo.presionContratista, nuevo.caudalContratista, nuevo.presionSedapal, nuevo.caudalSedapal].some(x => x === "")) {
            toast("Completa los campos obligatorios", true); return;
          }
          const rv = calcVariacion(nuevo.caudalContratista, nuevo.caudalSedapal);
          nuevo.variacion = rv.variacion; nuevo.errorPct = rv.error; nuevo.fecha = nuevo.fechaSedapal;
        } else if (es405) {
          if (!nuevo.codigoSgio || !nuevo.fechaDeteccion || nuevo.caudal === "" || !nuevo.fechaVerificacion || !nuevo.ubicacion) { toast("Completa los campos obligatorios", true); return; }
          nuevo.fecha = nuevo.fechaVerificacion;
        } else {
          if (nuevo.presion === "") { toast("Falta la presión", true); return; }
          if (!nuevo.fecha || !nuevo.hora) { toast("Falta la fecha u hora", true); return; }
        }
        const cambios = {}, detalle = {};
        for (const k of Object.keys(nuevo)) if (String(nuevo[k]) !== String(r[k] ?? "")) { cambios[k] = nuevo[k]; detalle[k] = { antes: r[k] ?? "", despues: nuevo[k] }; }
        const fotosCambian = !r.fotoPendiente && (state.edQuitadas.length || state.edFotos.some(f => f.tipo === "nueva"));
        if (fotosCambian && !state.edFotos.length) { toast("Debe quedar al menos una foto", true); return; }
        if (!Object.keys(cambios).length && !fotosCambian) { state.editId = null; renderLista(); toast("No hubo cambios"); return; }
        try {
          if (fotosCambian) await guardarFotosEdicion(r);
          if (Object.keys(cambios).length) await guardarEdicion(r, cambios, detalle);
          state.editId = null;
          toast("Cambios guardados" + (state.syncMode === "cloud" && !enLinea() ? ". Se subirán cuando haya internet" : ""));
          await loadRegistros(); render();
        } catch (e) { toast("No se pudo guardar: " + (e && (e.code || e.message) || "intenta de nuevo"), true); }
      };
    }
  }

  function confirmarFoto(url) {
    return new Promise(ok => {
      const el = document.createElement("div");
      el.className = "preview-overlay";
      el.innerHTML = `
        <div class="flex items-center justify-between px-4 py-3" style="padding-top:calc(12px + env(safe-area-inset-top,0px))">
          <div class="text-white text-sm font-semibold">Foto nueva</div>
        </div>
        <img src="${url}" alt="Foto nueva">
        <div class="flex gap-3 px-4 py-4" style="padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))">
          <button id="cfNo" class="btn-primary flex-1" style="background:var(--danger)">Eliminar foto</button>
          <button id="cfSi" class="btn-primary flex-1">Se ve bien</button>
        </div>`;
      document.body.appendChild(el);
      el.querySelector("#cfSi").onclick = () => { el.remove(); ok(true); };
      el.querySelector("#cfNo").onclick = () => { el.remove(); ok(false); };
    });
  }
  async function fotoEdicion(fileOrBlob) {
    const r = state.registros.find(x => x.id === state.editId); if (!r) return;
    const v = id => (document.getElementById(id) || {}).value || "";
    ensureLocation();
    toast("Procesando foto...");
    try {
      const blob = await watermarkPhoto(fileOrBlob, { nis: r.nis, direccion: v("ed_direccion"), urb: v("ed_urb"), distrito: v("ed_distrito") });
      const url = URL.createObjectURL(blob);
      if (await confirmarFoto(url)) { state.edFotos.push({ tipo: "nueva", blob, url }); pintarFotosEdicion(); }
      else URL.revokeObjectURL(url);
    } catch (e) { toast("No se pudo procesar la foto", true); }
  }
  function pintarFotosEdicion() {
    const g = document.getElementById("edFotos"); if (!g) return;
    g.innerHTML = state.edFotos.map((f, i) => `
      <div class="photo-slot">
        <img src="${f.url}" alt="Foto ${i + 1}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'Sin conexión',style:'font-size:11px;color:#4A5A6E'}))">
        ${f.tipo === "nueva" ? `<span class="absolute bottom-1 left-1 badge" style="background:#E1F3FB;color:#0B4A6B;font-size:10px;padding:2px 6px">nueva</span>` : ""}
        <button data-edq="${i}" class="absolute top-1 right-1 rounded-full text-white text-xs font-bold" style="background:rgba(0,0,0,.65);width:26px;height:26px" aria-label="Quitar foto ${i + 1}">✕</button>
      </div>`).join("") + `
      <button id="edFotoMas" class="photo-slot" aria-label="Agregar foto"><span style="font-size:28px;color:var(--ink-soft)">+</span></button>`;
    g.querySelectorAll("[data-edq]").forEach(b => b.onclick = () => {
      const f = state.edFotos[+b.dataset.edq];
      if (f.tipo === "nueva") URL.revokeObjectURL(f.url);
      else state.edQuitadas.push(f);
      state.edFotos.splice(+b.dataset.edq, 1); pintarFotosEdicion();
    });
    document.getElementById("edFotoMas").onclick = () => { state.camDestino = "editar"; abrirCamara(); };
  }

  async function guardarFotosEdicion(r) {
    const ts = String(Date.now() + 1);
    const antes = r.local ? (r.fotosBlobs || []).length : (r.fotos || []).length;
    const agregadas = state.edFotos.filter(f => f.tipo === "nueva").length;
    const nota = { cuando: Number(ts), por: state.operario,
                   cambios: { fotos: { antes, despues: state.edFotos.length, quitadas: state.edQuitadas.length, agregadas } } };
    if (r.local) {
      const x = (await IDB.all()).find(y => y.id === r.id);
      if (!x) throw new Error("registro no encontrado");
      x.fotosBlobs = state.edFotos.map(f => f.blob);
      delete x.fotoIds;                                      // se vuelven a subir todas con el orden nuevo
      x.ediciones = { ...(x.ediciones || {}), [ts]: nota };
      await IDB.put(x);
      return;
    }
    await IDB.fput({
      meta: { form: formDe(r), nis: r.nis, fecha: todayISO(), hora: nowHM(), operario: state.operario },
      id: nuevoId("f"), regId: r.id, creadoEn: Date.now(), nota, ts,
      mantener: state.edFotos.filter(f => f.tipo === "asset").map(f => f.id),
      nuevas: state.edFotos.filter(f => f.tipo === "nueva").map(f => f.blob),
      quitar: state.edQuitadas.map(f => f.id), subidas: []
    });
    sincronizar();
  }

  // Guarda la corrección: en el celular si aún no se subió; si ya se subió, se envía al servidor (o queda en cola sin internet)
  async function guardarEdicion(r, cambios, detalle) {
    const ts = String(Date.now());
    const nota = { cuando: Number(ts), por: state.operario, cambios: detalle };
    if (r.local) {
      const x = (await IDB.all()).find(y => y.id === r.id);
      if (!x) throw new Error("registro no encontrado");
      Object.assign(x, cambios);
      x.ediciones = { ...(x.ediciones || {}), [ts]: nota };
      await IDB.put(x);
      return;
    }
    const ops = leerLS("gpfo_edit_ops", []);
    ops.push({ id: r.id, data: { ...cambios, ediciones: { [ts]: nota } } });
    guardarLS("gpfo_edit_ops", ops);
    const cache = leerLS("gpfo_cache_registros", []).map(x => x.id === r.id
      ? { ...x, ...cambios, ediciones: { ...(x.ediciones || {}), [ts]: nota }, editPendiente: true } : x);
    guardarLS("gpfo_cache_registros", cache);
    sincronizar();
  }
