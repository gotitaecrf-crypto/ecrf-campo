  function salirAdmin() {
    if (state.adminDirty) toast("Se descartaron los cambios sin guardar");
    state.admin = false; state.adminMods = null; state.adminDirty = false; state.adminTab = "modulos"; state.adminRd = null; state.adminCharlaEd = null;
    document.getElementById("app").classList.add("max-w-md");
    render(); window.scrollTo(0, 0);
  }
  function pedirFicha(titulo, texto, boton) {
    return new Promise(ok => {
      const el = document.createElement("div");
      el.id = "admFicha";
      el.style.cssText = "position:fixed;inset:0;z-index:96;background:rgba(3,32,76,.55);display:flex;align-items:center;justify-content:center;padding:16px";
      el.innerHTML = `<div style="background:#fff;border-radius:18px;padding:18px;width:100%;max-width:360px">
        <div class="font-bold text-lg mb-1">${escA(titulo || "Confirma con tu ficha")}</div>
        <div class="text-sm mb-3" style="color:var(--ink-soft)">${escA(texto || "Por seguridad, los cambios del panel se guardan solo con la ficha del administrador.")}</div>
        <input id="admFichaIn" class="input" type="password" inputmode="numeric" maxlength="5" placeholder="Ficha (5 dígitos)" autocomplete="off">
        <div style="display:flex;gap:10px;margin-top:14px">
          <button id="admFichaNo" class="btn-ghost" style="flex:1">Cancelar</button>
          <button id="admFichaSi" class="btn-primary" style="flex:1">${escA(boton || "Guardar")}</button>
        </div></div>`;
      document.body.appendChild(el);
      const inp = el.querySelector("#admFichaIn"); inp.focus();
      inp.oninput = () => { inp.value = inp.value.replace(/\D/g, "").slice(0, 5); };
      const fin = v => { el.remove(); ok(v); };
      el.querySelector("#admFichaNo").onclick = () => fin(null);
      el.querySelector("#admFichaSi").onclick = () => fin(inp.value.length === 5 ? inp.value : (toast("La ficha tiene 5 dígitos", true), null));
      inp.onkeydown = e => { if (e.key === "Enter") el.querySelector("#admFichaSi").click(); };
    });
  }
  async function guardarModulosAdmin() {
    if (!apiListo() || !enLinea()) { toast("Necesitas internet para guardar", true); return; }
    const mods = state.adminMods;
    if (!mods.some(m => MODULOS_APP[m.id] && m.activo !== false && (m.roles || []).includes("OPERARIO")))
      if (!confirmarSuave("Deja al menos un módulo activo para los operarios")) return;
    const ficha = await pedirFicha(); if (!ficha) return;
    const btn = document.getElementById("admGuardar"); if (btn) { btn.disabled = true; btn.textContent = "Guardando…"; }
    try {
      const r = await apiPost({ tipo: "modulos", ficha, modulos: mods.map((m, i) => ({ id: m.id, titulo: m.titulo, descripcion: m.descripcion, activo: m.activo !== false, orden: i + 1, roles: m.roles || [] })) });
      localStorage.setItem("ecrf_modulos", JSON.stringify(r.modulos));
      state.adminMods = null; state.adminDirty = false;
      toast("Módulos guardados ✅ Los celulares los verán al abrir la app con internet");
    } catch (e) {
      toast(e && e.code === "ficha" ? "Ficha incorrecta" : e && e.code === "permiso" ? "Solo los administradores pueden guardar" : "No se pudo guardar. Revisa tu internet", true);
    }
    renderAdmin();
  }
  const confirmarSuave = msg => { toast(msg, true); return false; };   // aviso sin diálogo del navegador


  /* =====================================================================================
     MÓDULO «REPORTE DIARIO DE ACTIVIDADES»
     Mañana: charla de seguridad (YouTube) + actividades planificadas · Tarde: estado de cada actividad y cierre.
     Todo se guarda en el servidor (hojas RD_*). La identidad sale de una sesión firmada que entrega el servidor
     tras confirmar la ficha (no del nombre que envía el navegador).
     ===================================================================================== */
  const ICO_RD = `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3h6v3H9z"/><path d="M8.5 12l2 2 4.5-4.5"/><path d="M8.5 17h7"/></svg>`;
  const RD_EST_TXT = { "": "Pendiente de registro", PENDIENTE_REGISTRO: "Pendiente de registro", PENDIENTE_CIERRE: "Pendiente de cierre", CERRADO: "Cerrado" };
  const RD_EST_COLOR = { "": "#FFF1C7;color:#6B4A00", PENDIENTE_REGISTRO: "#FFF1C7;color:#6B4A00", PENDIENTE_CIERRE: "#E1F3FB;color:#0B4A6B", CERRADO: "#DDF3E7;color:#12613B" };
  const RD_EJEC_TXT = { EJECUTADA: "Ejecutada", PARCIAL: "Parcialmente ejecutada", NO_EJECUTADA: "No ejecutada" };
  const RD_VIDEO_TXT = { "": "Sin iniciar", EN_CURSO: "En reproducción", INCOMPLETO: "Incompleto", COMPLETADO: "Completado", ERROR: "Error de reproducción", SIN_CHARLA_CONFIGURADA: "Sin charla configurada" };
  const horaDe = s => (/\d{2}:\d{2}:\d{2}/.exec(String(s || "")) || [""])[0];
  const fechaTxt = iso => /^\d{4}-\d{2}-\d{2}$/.test(String(iso || "")) ? String(iso).split("-").reverse().join("/") : String(iso || "");
  const badgeRd = e => `<span class="badge" style="background:${RD_EST_COLOR[e || ""]}">${RD_EST_TXT[e || ""]}</span>`;
  const fmtPct = n => n == null || n === "" ? "—" : String(Math.round(Number(n) * 100) / 100).replace(".", ",") + " %";
  const nuevaClave = () => "k" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  // ---------- sesión firmada ----------
  function sesionGuardada() {
    try { const s = JSON.parse(localStorage.getItem("ecrf_sesion") || "null"); if (s && s.n === state.operario && s.exp > Date.now() + 60000) return s.sesion; } catch (e) {}
    return null;
  }
  async function obtenerSesion(ficha) {
    const r = await apiPost({ tipo: "sesion", ficha });
    try { localStorage.setItem("ecrf_sesion", JSON.stringify({ n: state.operario, sesion: r.sesion, exp: r.exp })); } catch (e) {}
    return r.sesion;
  }
  async function asegurarSesion() {
    const s = sesionGuardada(); if (s) return s;
    if (!apiListo() || !enLinea()) throw { code: "sin_internet", message: "Necesitas internet para el reporte diario" };
    const f = await pedirFicha("Confirma tu ficha", "Para el reporte diario confirmamos tu identidad una sola vez en este equipo.", "Continuar");
    if (!f) throw { code: "cancelado", message: "" };
    try { return await obtenerSesion(f); }
    catch (e) { throw { code: e.code === "ficha" ? "ficha" : "red", message: e.code === "ficha" ? "Ficha incorrecta" : "No se pudo confirmar tu ficha. Revisa tu internet" }; }
  }
  async function rdApi(tipo, datos) {
    if (!apiListo() || !enLinea()) throw { code: "sin_internet", message: "Necesitas internet para el reporte diario" };
    let s = await asegurarSesion();
    try { return await apiPost({ tipo, sesion: s, ...(datos || {}) }); }
    catch (e) {
      if (e && e.code === "sesion") { try { localStorage.removeItem("ecrf_sesion"); } catch (x) {} s = await asegurarSesion(); return await apiPost({ tipo, sesion: s, ...(datos || {}) }); }
      throw e;
    }
  }
  const msgError = e => (e && e.message) || (e && e.code === "sin_internet" ? "Necesitas internet" : "No se pudo completar. Revisa tu internet e inténtalo otra vez");

  // ---------- borradores en el celular (por si se corta la señal o se cierra la app antes de guardar) ----------
  const claveBorrador = () => "rd_borr_" + state.operario + "_" + ((state.rdDatos && state.rdDatos.fecha) || "");
  const leerBorr = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };
  const guardarBorr = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const borrarBorr = k => { try { localStorage.removeItem(k); } catch (e) {} };

  // ---------- vista principal ----------

        .rd-pct{font-size:44px;font-weight:900;line-height:1;color:var(--brand-dark)}
      </style>
      <div class="rd-top"><div class="rd-wrap px-4 pt-3 pb-3 flex items-center gap-3">
        <button id="rdVolver" class="text-white font-bold text-xl leading-none px-1" aria-label="Volver al inicio">‹</button>
        <span class="form-ico" style="display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);color:#fff;width:46px;height:46px">${ICO_RD}</span>
        <div class="flex-1 min-w-0"><div class="font-extrabold leading-tight">Reporte diario de actividades</div>
          <div class="text-xs" style="color:#C9D8EA">${escA(state.operario)}</div></div>
        <span class="logo-chip"><img src="${LOGO_SEDAPAL}" alt="SEDAPAL"></span>
      </div></div>
      <div style="background:var(--card);border-bottom:1px solid var(--line)"><div class="rd-wrap flex px-4">
        <div class="tab-btn ${state.rdTab === "hoy" ? "active" : ""}" data-rdtab="hoy">Hoy</div>

      </div></div>
      <div class="rd-wrap px-4 py-4 pb-24" id="rdContent"></div>`;
    document.getElementById("rdVolver").onclick = salirReporteDiario;
    document.querySelectorAll("[data-rdtab]").forEach(t => t.onclick = () => { if (state.rdTab !== t.dataset.rdtab) { detenerVideo(); state.rdTab = t.dataset.rdtab; render(); } });
    if (state.rdTab === "hechos") renderRdHechos(); else renderRdHoy();
  }

  async function cargarRdHoy() {
    const c = document.getElementById("rdContent");
    if (c) c.innerHTML = `<div class="text-center text-sm py-10" style="color:var(--ink-soft)">Cargando tu reporte…</div>`;
    try {
      const d = await rdApi("rd_hoy");
      state.rdDatos = d;
      try { localStorage.setItem("rd_cache_" + state.operario, JSON.stringify(d)); } catch (e) {}
    } catch (e) {
      if (e && e.code === "cancelado") { salirReporteDiario(); return; }
      const cache = leerBorr("rd_cache_" + state.operario);
      if (c) c.innerHTML = `<div class="card p-4 text-sm" style="background:#FFF1C7;color:#6B4A00"><b>${escA(msgError(e))}.</b><br>
        El reporte diario se guarda en el servidor, así que necesitas señal para registrarlo o cerrarlo.
        ${cache ? `Lo último que se descargó es del ${fechaTxt(cache.fecha)}.` : ""}</div>
        <button id="rdReintentar" class="btn-primary w-full mt-3">Reintentar</button>`;
      const b = document.getElementById("rdReintentar"); if (b) b.onclick = () => cargarRdHoy();

  function renderRdHoy() {
    const c = document.getElementById("rdContent"); if (!c) return;

    c.innerHTML = `

          <input id="rdOtra" class="input mb-2" maxlength="300" placeholder="Escribe la actividad" value="${ed && !ed.catalogoId ? escA(ed.descripcion) : ""}" style="${ed && !ed.catalogoId ? "" : "display:none"}">
          <label class="text-xs font-semibold block mb-1" for="rdCom" style="color:var(--ink-soft)">Comentarios o detalles (opcional)</label>

          ${borr.acts.length ? borr.acts.map((a, i) => `

                ${a.comentario ? `<div class="text-xs" style="color:var(--ink-soft)">${escA(a.comentario)}</div>` : ""}</div>
              <button class="text-sm font-semibold rdEd" data-i="${i}" style="color:var(--brand)">Editar</button>

            </div>`).join("") : `<div class="text-sm py-3 text-center" style="color:var(--ink-soft)">Aún no agregas actividades</div>`}
          <button id="rdGuardarM" class="btn-primary w-full mt-3" ${borr.acts.length && completada ? "" : "disabled"}>Guardar reporte de la mañana</button>
          <div id="rdGuardarErr" class="rd-err"></div>

      </div>`;
    const sel = document.getElementById("rdSel"), otra = document.getElementById("rdOtra");

      if (sel.value === "__otra") { const t = otra.value.trim(); if (!t) { err.textContent = "Escribe la actividad"; return; } a = { catalogoId: "", descripcion: t }; }
      else if (sel.value) { const cat = d.catalogo.find(x => x.id === sel.value); a = { catalogoId: cat.id, descripcion: cat.descripcion }; }
      else { err.textContent = "Elige una actividad del catálogo o escribe otra"; return; }
      a.comentario = document.getElementById("rdCom").value.trim();
      const b = leerBorr(claveBorrador()) || borr;
      if (ed) b.acts[ed.i] = a; else b.acts.push(a);
      guardarBorr(claveBorrador(), b); state.rdEditando = null; renderRdManana(rep);
    };
    const ce = document.getElementById("rdCancelEd"); if (ce) ce.onclick = () => { state.rdEditando = null; renderRdManana(rep); };
    document.querySelectorAll(".rdEd").forEach(b => b.onclick = () => { const i = +b.dataset.i; state.rdEditando = { ...borr.acts[i], i }; renderRdManana(rep); document.getElementById("rdSel").scrollIntoView({ block: "center" }); });
    document.querySelectorAll(".rdQuitar").forEach(b => b.onclick = () => { borr.acts.splice(+b.dataset.i, 1); guardarBorr(claveBorrador(), borr); state.rdEditando = null; renderRdManana(rep); });
    document.getElementById("rdGuardarM").onclick = guardarRdManana;
    if (ch && !completada) montarVideo(ch, cv);

  // ---------- reproductor de YouTube con evidencia técnica ----------
  let ytListo = null, rdPlayer = null, rdTimer = null;
  function cargarApiYoutube() {
    if (window.YT && window.YT.Player) return Promise.resolve();
    if (ytListo) return ytListo;
    ytListo = new Promise((ok, mal) => {
      const anterior = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => { if (anterior) try { anterior(); } catch (e) {} ok(); };
      const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; s.onerror = () => { ytListo = null; mal(new Error("yt")); };
      document.head.appendChild(s);
      setTimeout(() => { if (!(window.YT && window.YT.Player)) { ytListo = null; mal(new Error("timeout")); } }, 20000);
    });
    return ytListo;
  }
  function detenerVideo() {
    clearInterval(rdTimer); rdTimer = null;
    if (rdPlayer) { try { rdPlayer.destroy(); } catch (e) {} rdPlayer = null; }
  }
  async function montarVideo(ch, cv) {
    detenerVideo();
    const msg = t => { const m = document.getElementById("rdVMsg"); if (m) m.textContent = t || ""; };
    const pinta = (visto, dur, est) => {
      const pct = dur ? Math.min(100, Math.round(visto / dur * 100)) : 0;
      const b = document.getElementById("rdBarra"); if (b) b.style.width = pct + "%";
      const a = document.getElementById("rdAvance"); if (a) a.textContent = `Visto ${pct} %` + (dur ? ` · ${Math.floor(visto / 60)}:${String(Math.floor(visto % 60)).padStart(2, "0")} de ${Math.floor(dur / 60)}:${String(Math.floor(dur % 60)).padStart(2, "0")}` : "");
      if (est) { const e = document.getElementById("rdVEst"); if (e) e.textContent = RD_VIDEO_TXT[est] || est; }
    };
    try { await cargarApiYoutube(); }
    catch (e) { msg("No se pudo cargar el reproductor de YouTube. Revisa tu conexión e inténtalo de nuevo."); return; }
    if (!document.getElementById("rdPlayer")) return;
    // "visto" = segundos distintos del video reproducidos de corrido (ver dos veces el mismo tramo no suma, adelantar no cuenta)
    const cubiertos = new Set();
    const marca = (a, b) => { if (!(b > a) || b - a > 1.6) return; for (let s = Math.floor(a); s < Math.ceil(b - 0.05); s++) cubiertos.add(s); visto = Math.min(dur || Infinity, cubiertos.size); };
    let visto = 0, ultimo = null, dur = 0, inicioEnviado = !!(cv && cv.inicio), ultimoEnvio = 0, enviandoFin = false;
    const enviar = async (evento, extra) => {
      try {
        const r = await rdApi("rd_video", { evento, duracion: dur, visto: Math.round(visto), posicion: rdPlayer && rdPlayer.getCurrentTime ? rdPlayer.getCurrentTime() : 0, ...(extra || {}) });
        if (r.reporte) {
          state.rdDatos.reporte = { ...(state.rdDatos.reporte || {}), ...r.reporte, actividades: (state.rdDatos.reporte || {}).actividades };
          const ini = document.getElementById("rdVIni"); if (ini && r.reporte.charla.inicio) ini.textContent = horaDe(r.reporte.charla.inicio);
          const fin = document.getElementById("rdVFin"); if (fin && r.reporte.charla.fin) fin.textContent = horaDe(r.reporte.charla.fin);
          pinta(visto, dur, r.reporte.charla.estado);
        }
        return r;
      } catch (e) { msg(msgError(e) + ". El avance del video no se pudo registrar; si vuelve la señal, repite el final del video."); return null; }
    };
    rdPlayer = new YT.Player("rdPlayer", {
      videoId: ch.videoId, width: "100%", height: "100%",
      playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
      events: {
        onReady: () => { dur = rdPlayer.getDuration() || 0; pinta(visto, dur); },
        onError: ev => {
          const t = { 2: "El enlace del video no es válido.", 5: "El video no se puede reproducir en este equipo.", 100: "El video no existe o es privado.", 101: "El dueño del video no permite verlo dentro de la app.", 150: "El dueño del video no permite verlo dentro de la app." }[ev.data] || "No se pudo reproducir el video.";
          msg(t + " Avisa al administrador. No se registrará la charla como vista.");
          enviar("error", { codigoError: ev.data });
        },
        onStateChange: async ev => {
          const S = YT.PlayerState;
          if (ev.data === S.PLAYING) {
            dur = rdPlayer.getDuration() || dur; msg(""); ultimo = rdPlayer.getCurrentTime();
            if (!inicioEnviado) { inicioEnviado = true; enviar("inicio"); }
            if (!rdTimer) rdTimer = setInterval(() => {
              if (!rdPlayer || !rdPlayer.getPlayerState || rdPlayer.getPlayerState() !== YT.PlayerState.PLAYING) return;
              const t = rdPlayer.getCurrentTime();
              if (ultimo !== null) marca(ultimo, t);          // solo cuenta lo reproducido sin saltos
              ultimo = t; pinta(visto, dur, "EN_CURSO");
              if (Date.now() - ultimoEnvio > 30000) { ultimoEnvio = Date.now(); enviar("progreso"); }
            }, 1000);
          } else if (ev.data === S.PAUSED) { if (ultimo !== null) marca(ultimo, rdPlayer.getCurrentTime()); ultimo = null; enviar("pausa"); }
          else if (ev.data === S.ENDED) {
            clearInterval(rdTimer); rdTimer = null;
            if (ultimo !== null) marca(ultimo, dur || rdPlayer.getDuration()); ultimo = null; pinta(visto, dur);
            if (enviandoFin) return; enviandoFin = true;
            const r = await enviar("fin"); enviandoFin = false;
            if (r && r.reporte && r.reporte.charla.estado === "COMPLETADO") { toast("Charla completada ✅ Ya puedes registrar tus actividades"); detenerVideo(); renderRdHoy(); }
            else if (r) msg(r.msg || "El video no se vio completo. Vuelve a reproducirlo desde el inicio sin adelantarlo.");
          }
        }
      }
    });
  }

          <div class="text-xs mb-3" style="color:var(--ink-soft)">Se calcula solo: ejecutadas ÷ planificadas × 100</div>
          <div class="grid grid-cols-2 gap-2 text-sm mb-3">
            <div class="rd-dato"><small>Planificadas</small><b>${k.tot}</b></div>

          <div class="text-xs mb-3" style="color:var(--ink-soft)">Charla: ${escA(RD_VIDEO_TXT[rep.charla.estado] || rep.charla.estado || "—")}${rep.charla.tema ? " · " + escA(rep.charla.tema) : ""}</div>
          <button id="rdCerrar" class="btn-primary w-full">Cerrar reporte</button>

        </div>
      </div>`;
    const guardarLocal = () => guardarBorr(kc, b);
    document.querySelectorAll(".rdEst").forEach(x => x.onclick = () => {

    document.getElementById("rdCerrar").onclick = async () => {

  /* ---------------- Mapa de la ruta (OpenStreetMap) + navegación en Google Maps ---------------- */
  const FORM_CORTO = { GPFO0381: "0381 Presiones", GPFO0405: "0405 Reparación", GPFO0416: "0416 Muestreo" };
  const PARADAS_TRAMO = 10;                       // Google Maps en el celular: destino + 9 paradas intermedias
  let mapaL = null;
  function cargarLeaflet() {
    if (window.L) return Promise.resolve();
    return new Promise((ok, mal) => {
      const css = document.createElement("link"); css.rel = "stylesheet";
      css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(css);
      const js = document.createElement("script"); js.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
      js.onload = ok; js.onerror = mal; document.head.appendChild(js);
    });
  }
  const distKm = (a, b) => {
    const R = 6371, r = x => x * Math.PI / 180;
    const dLa = r(b.lat - a.lat), dLo = r(b.lon - a.lon);
    const h = Math.sin(dLa / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLo / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  };
  // Orden por cercanía: el más cercano primero y luego se mejora deshaciendo cruces (2-opt)
  function ordenarCercania(puntos, inicio) {
    if (puntos.length < 2) return puntos.slice();
    const quedan = puntos.slice(), orden = [];
    let actual = inicio || quedan[0];
    if (!inicio) orden.push(quedan.shift());
    while (quedan.length) {
      let iMin = 0, dMin = Infinity;
      quedan.forEach((p, i) => { const d = distKm(actual, p); if (d < dMin) { dMin = d; iMin = i; } });
      actual = quedan.splice(iMin, 1)[0]; orden.push(actual);
    }
    const largo = r => r.reduce((s, p, i) => s + (i ? distKm(r[i - 1], p) : (inicio ? distKm(inicio, p) : 0)), 0);
    let mejoro = true, vueltas = 0;
    while (mejoro && vueltas++ < 50) {
      mejoro = false;
      for (let i = 0; i < orden.length - 1; i++) for (let k = i + 1; k < orden.length; k++) {
        const prueba = orden.slice(0, i).concat(orden.slice(i, k + 1).reverse(), orden.slice(k + 1));
        if (largo(prueba) + 1e-9 < largo(orden)) { orden.splice(0, orden.length, ...prueba); mejoro = true; }
      }
    }
    return orden;
  }
  function paradasRuta() {
    return state.pendientes.filter(p => esSupervisor() || p.para === state.operario).map(p => {
      const cache = NIS_REMOTO[p.nis] || nisLocal(p.nis) || {};
      const lat = p.latNis ?? cache.latNis, lon = p.lonNis ?? cache.lonNis;
      return { ...p, lat: lat == null || lat === "" ? null : Number(lat), lon: lon == null || lon === "" ? null : Number(lon) };
    });
  }
  function claveOrden() { return "ecrf_orden_ruta_" + (state.operario || ""); }
  function aplicarOrden(paradas) {
    const guardado = leerLS(claveOrden(), []);
    const pos = id => { const i = guardado.indexOf(id); return i < 0 ? 1e6 + (paradas.find(p => p.id === id).creadoEn || 0) : i; };
    return paradas.slice().sort((a, b) => pos(a.id) - pos(b.id));
  }
  function urlTramo(tramo) {
    const dest = tramo[tramo.length - 1], medio = tramo.slice(0, -1);
    const q = new URLSearchParams({ api: "1", destination: dest.lat + "," + dest.lon, travelmode: "driving" });
    if (medio.length) q.set("waypoints", medio.map(p => p.lat + "," + p.lon).join("|"));
    return "https://www.google.com/maps/dir/?" + q.toString();     // sin origen: Google parte desde donde estás
  }

  async function abrirMapaRuta() {
    ensureLocation();
    let el = document.getElementById("mapaRuta");
    if (!el) { el = document.createElement("div"); el.id = "mapaRuta"; document.body.appendChild(el); }
    el.style.cssText = "position:fixed;inset:0;z-index:85;background:#F2F5F8;display:flex;flex-direction:column";
    el.innerHTML = `
      <div style="background:var(--brand-dark);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;align-items:center;gap:10px">
        <button id="mapaCerrar" aria-label="Cerrar mapa" style="background:none;border:0;color:#fff;font-size:22px;width:40px;height:40px">✕</button>
        <div style="flex:1;min-width:0"><b style="font-size:17px">Mi ruta</b><div id="mapaResumen" style="font-size:12px;opacity:.85">Cargando…</div></div>
      </div>
      <div id="mapaL" style="flex:1;min-height:200px;background:#dfe7ee"></div>
      <div id="mapaPanel" style="background:#fff;border-top:1px solid #CFD8E3;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));max-height:46vh;overflow:auto"></div>`;
    el.querySelector("#mapaCerrar").onclick = cerrarMapaRuta;

    // NIS de la ruta que aún no tienen coordenadas en el celular: se consultan a la base
    const sinCoord = paradasRuta().filter(p => p.lat == null && NIS_REMOTO[p.nis] === undefined);
    if (sinCoord.length && enLinea()) await Promise.all(sinCoord.slice(0, 40).map(p => buscarNisServidor(p.nis).catch(() => {})));
    try { await cargarLeaflet(); } catch (e) {
      el.querySelector("#mapaL").innerHTML = `<div style="padding:30px;text-align:center;color:#4A5A6E">No se pudo cargar el mapa. Revisa tu internet.</div>`;
    }
    pintarMapaRuta();

  function cerrarMapaRuta() {
    if (mapaL) { mapaL.remove(); mapaL = null; }
    const el = document.getElementById("mapaRuta"); if (el) el.remove();
  }

  function pintarMapaRuta() {
    const todas = aplicarOrden(paradasRuta());
    const conCoord = todas.filter(p => p.lat != null && p.lon != null);
    const sinCoord = todas.filter(p => p.lat == null || p.lon == null);
    const tramos = []; for (let i = 0; i < conCoord.length; i += PARADAS_TRAMO) tramos.push(conCoord.slice(i, i + PARADAS_TRAMO));
    const res = document.getElementById("mapaResumen");
    if (res) res.textContent = `${todas.length} NIS · ${conCoord.length} en el mapa${sinCoord.length ? " · " + sinCoord.length + " sin ubicación" : ""}`;

    const panel = document.getElementById("mapaPanel");
    panel.innerHTML = `
      ${conCoord.length > 1 ? `<button id="mapaOrdenar" class="btn-ghost w-full mb-2">↻ Ordenar por cercanía${state.coords && state.coords.lat != null ? " (desde donde estoy)" : ""}</button>` : ""}
      ${tramos.map((t, i) => `
        <a href="${urlTramo(t)}" target="_blank" rel="noopener" class="btn-primary w-full mb-2" style="display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none">
          ▶ Abrir en Google Maps${tramos.length > 1 ? ` · tramo ${i + 1} (paradas ${i * PARADAS_TRAMO + 1}–${i * PARADAS_TRAMO + t.length})` : ""}
        </a>`).join("")}
      <div class="text-xs mt-2 mb-1 font-semibold" style="color:var(--ink-soft)">Orden de visita</div>
      ${conCoord.map((p, i) => `<div class="text-sm py-1" style="border-bottom:1px solid #EEF2F6"><b>${i + 1}.</b> NIS ${escA(p.nis)} · ${escA(p.direccion || "")} <span style="color:var(--ink-soft)">· ${escA(FORM_CORTO[formDe(p)] || "")}${esSupervisor() ? " · " + escA(p.para) : ""}</span></div>`).join("")}
      ${sinCoord.length ? `<div class="text-xs mt-3 p-2 rounded-lg" style="background:#FFF1C7;color:#6B4A00"><b>Sin ubicación en la base (no salen en el mapa):</b><br>${sinCoord.map(p => "NIS " + escA(p.nis) + " · " + escA(p.direccion || "")).join("<br>")}</div>` : ""}`;
    const bOrd = document.getElementById("mapaOrdenar");
    if (bOrd) bOrd.onclick = () => {
      const c = state.coords && state.coords.lat != null ? { lat: state.coords.lat, lon: state.coords.lon } : null;
      const orden = ordenarCercania(conCoord, c);
      guardarLS(claveOrden(), orden.map(p => p.id).concat(sinCoord.map(p => p.id)));
      toast("Ruta ordenada por cercanía");
      pintarMapaRuta();
    };

    if (!window.L) return;
    if (!mapaL) {
      mapaL = L.map("mapaL", { zoomControl: true });
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(mapaL);
    } else mapaL.eachLayer(l => { if (!(l instanceof L.TileLayer)) mapaL.removeLayer(l); });
    const limites = [];
    conCoord.forEach((p, i) => {
      const icono = L.divIcon({ className: "", iconSize: [30, 30], iconAnchor: [15, 15],
        html: `<div style="width:30px;height:30px;border-radius:50%;background:#03204C;color:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font:700 13px Roboto,Arial,sans-serif">${i + 1}</div>` });
      L.marker([p.lat, p.lon], { icon: icono }).addTo(mapaL)
        .bindPopup(`<b>${i + 1}. NIS ${escA(p.nis)}</b><br>${escA(p.direccion || "")}<br><small>${escA(p.urb || "")} ${escA(p.distrito || "")} · ${escA(FORM_CORTO[formDe(p)] || "")}</small><br><a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}" target="_blank" rel="noopener">Ir solo a este punto</a>`);
      limites.push([p.lat, p.lon]);
    });
    if (conCoord.length > 1) L.polyline(conCoord.map(p => [p.lat, p.lon]), { color: "#33B1E4", weight: 3, dashArray: "6 6" }).addTo(mapaL);
    if (state.coords && state.coords.lat != null) {
      L.circleMarker([state.coords.lat, state.coords.lon], { radius: 8, color: "#fff", weight: 3, fillColor: "#1A73E8", fillOpacity: 1 }).addTo(mapaL).bindPopup("Estás aquí");
      limites.push([state.coords.lat, state.coords.lon]);
    }
    if (limites.length) mapaL.fitBounds(limites, { padding: [36, 36], maxZoom: 17 });
    else mapaL.setView([-12.06, -77.04], 11);
    setTimeout(() => mapaL && mapaL.invalidateSize(), 150);
  }

  /* =====================================================================================
     BARRA LATERAL Y MÓDULOS «GIS & LOGÍSTICA» (Mapa de NIS, Planificador de rutas, Laboratorio ECRF)
     La barra lateral se ve fija en PC (≥ 1024 px). En el celular, el menú de inicio muestra los mismos grupos.
     ===================================================================================== */
  const ICS = p => `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  const ICO_MAPA = ICS(`<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>`);
  const ICO_RUTA = ICS(`<circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/>`);

  // Encabezado común de las vistas GIS (mismo estilo que el Reporte diario)
  function cabeceraGis(titulo, sub, ico) {

  let mapaNisL = null, planL = null;

  // Si el recuadro del mapa cambia de tamaño (girar el celular, cargar el panel), el mapa se reajusta solo
  function vigilarTamano(mapa) {
    if (!window.ResizeObserver) return;
    const ro = new ResizeObserver(() => { if (mapa._loaded && mapa.getContainer().isConnected) mapa.invalidateSize(); });
    ro.observe(mapa.getContainer()); mapa.on("unload", () => ro.disconnect());
  }
  function capaBase(mapa) {
    vigilarTamano(mapa);
    const calles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' });
    const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "Imágenes &copy; Esri" });
    calles.addTo(mapa);
    L.control.layers({ "Calles": calles, "Satélite": sat }, null, { position: "topright" }).addTo(mapa);
  }
  function ubicacionAhora() {
    return new Promise(ok => {
      if (!navigator.geolocation) return ok(null);
      navigator.geolocation.getCurrentPosition(p => {
        state.coords = { lat: p.coords.latitude, lon: p.coords.longitude, alt: null, speed: null }; state.gpsUltimo = { lat: state.coords.lat, lon: state.coords.lon, en: Date.now() }; ok(state.coords);
      }, () => ok(null), { enableHighAccuracy: true, timeout: 9000 });
    });
  }
  const fmtKm = km => km == null ? "—" : km < 1 ? Math.round(km * 1000) + " m" : (Math.round(km * 10) / 10).toString().replace(".", ",") + " km";

  // Conexión cercana: rectángulo celeste (Moorea Blue). Mi ubicación: círculo verde con «Aquí estás».

  const ICONO_AQUI = () => L.divIcon({ className: "", iconSize: [22, 22], iconAnchor: [11, 11],
    html: `<div style="position:relative;width:22px;height:22px"><span style="position:absolute;inset:0;border-radius:50%;background:#1E9E4A;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.5)"></span>
      <span style="position:absolute;left:50%;bottom:26px;transform:translateX(-50%);white-space:nowrap;background:#1E9E4A;color:#fff;font:700 12px Roboto,Arial,sans-serif;padding:3px 8px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.35)">Aquí estás</span></div>` });
  const PIN_NIS = () => L.divIcon({ className: "", iconSize: [34, 44], iconAnchor: [17, 42],

  /* ---------------- MAPA DE NIS ---------------- */
  const claveHistNis = () => "ecrf_mapa_hist_" + (state.operario || "");
  function renderMapaNis() {
    const q = state.mnQuery || "";
    const sel = state.mnSel && (NIS_REMOTO[state.mnSel] || nisLocal(state.mnSel));
    const est = q.length === 7 ? estadoBusqueda(q) : "";
    const hist = leerLS(claveHistNis(), []);
    const yo = state.coords && state.coords.lat != null ? state.coords : state.gpsUltimo || null;
    const dist = sel && yo && sel.latNis != null ? distKm(yo, { lat: Number(sel.latNis), lon: Number(sel.lonNis) }) : null;
    const operarios = listaUsuarios().filter(u => (u.rol || "OPERARIO") === "OPERARIO");
    document.getElementById("app").innerHTML = `${estilosGis()}
      ${cabeceraGis("Mapa de NIS", "visor de conexiones de la base", ICO_MAPA)}

              : est === "sinred" ? "Sin internet: solo se encuentran los NIS consultados antes en este equipo." : q.length && q.length < 7 ? "El NIS tiene 7 dígitos." : "Base de conexiones con coordenadas del GIS."}</div>
            ${hist.length ? `<div class="gis-lbl mt-3">Últimos NIS consultados</div><div class="flex gap-2" style="flex-wrap:wrap">${hist.slice(0, 3).map(n => `<button class="gis-chip mnHist" data-n="${n}" aria-pressed="${n === state.mnSel}">${n}</button>`).join("")}</div>` : ""}
          </div>
          ${htmlCercanos()}
          ${sel ? `
          <div class="card p-4 mt-3" id="mnFicha">
            <div class="flex items-center justify-between gap-2"><b class="text-lg" style="color:var(--brand-dark)">NIS ${escA(state.mnSel)}</b>
              ${sel.latNis != null ? `<span class="badge" style="background:#DDF3E7;color:#12613B">Con ubicación GIS</span>` : `<span class="badge" style="background:#FFF1C7;color:#6B4A00">Sin coordenadas</span>`}</div>

              <div class="rd-dato"><small>Distrito</small><b>${escA(sel.distrito || "—")}</b></div>
              <div class="rd-dato"><small>Sector</small><b>${escA(sel.sector || "—")}</b></div>
              <div class="rd-dato"><small>CCSS</small><b>${escA(sel.ccss || "—")}</b></div>
              <div class="rd-dato"><small>Distancia</small><b>${dist == null ? (yo ? "—" : "Activa tu ubicación") : fmtKm(dist)}</b></div>
              ${sel.latNis != null ? `<div class="rd-dato" style="grid-column:1/-1"><small>Coordenadas (WGS84)</small><b style="font-variant-numeric:tabular-nums">${Number(sel.latNis).toFixed(6)}, ${Number(sel.lonNis).toFixed(6)}</b></div>` : ""}
            </div>
            ${sel.latNis != null ? `<a class="btn-primary w-full mt-3" style="display:flex;justify-content:center;text-decoration:none" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${sel.latNis},${sel.lonNis}">▶ Cómo llegar (Google Maps)</a>` : ""}
            <div class="gis-lbl mt-4">Registrar con este NIS</div>
            <div class="mn-atajos">
              <button class="mnAtajo" data-f="GPFO0381"><span>${ICO_LAT.GPFO0381}</span>Toma de presiones</button>
              <button class="mnAtajo" data-f="GPFO0405"><span>${ICO_LAT.GPFO0405}</span>Verificación de reparación</button>
              <button class="mnAtajo" data-f="GPFO0416"><span>${ICO_LAT.GPFO0416}</span>Verificación por muestreo</button>
            </div>
            <div class="gis-lbl mt-4">Agregar a la ruta</div>
            <div class="grid gap-2" style="grid-template-columns:1fr 1fr">
              <select id="mnForm" class="input"><option value="GPFO0381">0381 Presiones</option><option value="GPFO0405">0405 Reparación</option><option value="GPFO0416">0416 Muestreo</option></select>
              ${esSupervisor() ? `<select id="mnPara" class="input">${operarios.map(u => `<option>${escA(u.name)}</option>`).join("")}<option>${escA(state.operario)}</option></select>` : `<button id="mnAgregar" class="btn-ghost">+ A mi ruta</button>`}
            </div>
            ${esSupervisor() ? `<button id="mnAgregar" class="btn-ghost w-full mt-2">+ Agregar a la ruta del operario</button>` : ""}
          </div>` : `<div class="card p-4 mt-3 text-sm" style="color:var(--ink-soft)">Escribe un NIS para ubicarlo en el mapa con su dirección, sector y CCSS.</div>`}
          <div class="card p-3 mt-3 flex items-center justify-between gap-2">
            <label class="text-sm flex items-center gap-2" style="font-weight:600"><input type="checkbox" id="mnRuta" ${state.mnVerRuta ? "checked" : ""}> Mostrar mi ruta (${paradasRuta().length})</label>
          </div>
        </div>
        <div class="gis-mapa" id="mnMapa" role="region" aria-label="Mapa"></div>
      </div>`;
    const inp = document.getElementById("mnNis");
    const buscar = async () => {
      const v = inp.value.replace(/\D/g, "").slice(0, 7); state.mnQuery = v;
      if (v.length !== 7) { renderMapaNis(); return; }
      if (!nisLocal(v) && NIS_REMOTO[v] === undefined) { renderMapaNis(); await buscarNisServidor(v); }
      if (nisLocal(v)) { centrarEnNis(v); return; }

  // Ventana de un NIS en el mapa: datos y atajos a los formularios con ese NIS ya cargado

  // Abre el formulario elegido con el NIS ya cargado (dirección, distrito, sector y coordenadas)

  /* ---------- Conexiones cercanas (radio alrededor de mi ubicación o de un punto del mapa) ---------- */

  async function buscarCercanos(lat, lon, origen) {
    const r = state.mnRadio || 50;
    if (!apiListo() || !enLinea()) { state.mnCerca = { error: "Necesitas internet para buscar conexiones cercanas" }; return renderMapaNis(); }
    state.mnCerca = { lat, lon, r, origen, cargando: true, items: state.mnCerca && state.mnCerca.items }; state.mnCercaVer = 30;
    renderMapaNis();
    try {
      const d = await apiGet({ action: "nis_cerca", lat: lat.toFixed(6), lon: lon.toFixed(6), r });

      d.items.forEach(x => { if (NIS_REMOTO[x.nis] === undefined || NIS_REMOTO[x.nis] === null) NIS_REMOTO[x.nis] = desdeServidor(x.nis, { dir: x.dir, urb: x.urb, dist: x.dist, sec: x.sec, ccss: x.ccss, lat: x.lat, lon: x.lon }); });
      guardarCacheNis();
      state.mnCerca = { lat, lon, r: d.r, origen, items: d.items, total: d.total };
    } catch (e) {
      state.mnCerca = { lat, lon, r, origen, error: e && e.code === "sin_base_geo" ? "Falta cargar la base por ubicación (carpeta ECRF_BASE_GEO) en el Drive" : (e && e.message) || "No se pudo buscar. Revisa tu internet" };
    }

  function activarCercanos() {

      toast("Buscando tu ubicación…");
      const c = await ubicacionAhora();
      if (!c) { state.mnCerca = { error: "No se pudo obtener tu ubicación. Activa el GPS o toca un punto del mapa." }; return renderMapaNis(); }

  // NIS buscado: el mapa va a su ubicación y muestra las conexiones cercanas a él en el radio elegido
  function centrarEnNis(nis) {

  }
  function elegirCercano(nis) {

  let turnoMapa = 0;                                   // si se vuelve a pintar mientras carga, solo vale el último

    const BotonYo = L.Control.extend({ options: { position: "topleft" }, onAdd() {

      });

    });

      const a = e.target.closest(".mnAqui"); if (a) { const p = mapaNisL._popup && mapaNisL._popup.getLatLng(); if (p) buscarCercanos(p.lat, p.lng, "mapa"); return; }
      const v = e.target.closest(".mnVerFicha"); if (v) { mapaNisL.closePopup(); elegirCercano(v.dataset.n); return; }
      const f = e.target.closest(".mnIrForm"); if (f) irAFormularioConNis(f.dataset.f, f.dataset.n);

    else if (sel && sel.latNis != null && lim.length === 1) mapaNisL.setView(lim[0], 18);
    else if (lim.length) mapaNisL.fitBounds(lim, { padding: [40, 40], maxZoom: 18 });

  /* ---------------- RÉPLICA GIS ----------------
     Redes de agua (tuberías, válvulas, accesorios e hidrantes) en un radio alrededor de tu ubicación.

  const ICO_REPLICA = ICS(`<path d="M3 7h6v4h6V7h6"/><path d="M12 11v10"/><circle cx="12" cy="21" r="0.5"/><path d="M9 4v6M15 4v6"/>`);
  const RG_RADIOS = [100, 200, 300, 500];
  const RG_COLOR = { prim: "#A900E6", sec: "#0070FF", valv: "#E60000", acc: "#E60000" };   // Anemone Violet, Cretan Blue, Poinsettia Red (aprox.)
  const RG_CAPAS = [
    { k: "prim", n: "Tuberías primarias" }, { k: "sec", n: "Tuberías secundarias" }, { k: "v", n: "Válvulas del sistema" },
    { k: "a", n: "Accesorios" }, { k: "h", n: "Hidrantes" }, { k: "et", n: "Etiquetas (material y diámetro)" }
  ];
  let replicaL = null, replicaFondo = null;
  function rgVisibles() { const v = state.rgCapas || (state.rgCapas = { prim: true, sec: true, v: true, a: true, h: true, et: true }); return v; }
  function renderReplica() {
    const d = state.rgDatos, r = state.rgRadio || 200, vis = rgVisibles();
    const cuenta = d && d.puntos ? d.puntos.reduce((m, p) => (m[p[0]] = (m[p[0]] || 0) + 1, m), {}) : {};
    const muestra = k => `<canvas class="rg-muestra" data-k="${k}" width="44" height="22" aria-hidden="true"></canvas>`;
    document.getElementById("app").innerHTML = `${estilosGis()}
      ${cabeceraGis("Réplica GIS", "redes de agua a tu alrededor", ICO_REPLICA)}
      <div class="gis-wrap px-4 py-4 pb-24 gis-split rg-split">

            <div class="gis-lbl">Radio de carga</div>

            <div id="rgEstado" class="text-sm mt-3" style="color:var(--ink-soft)">${
              d && d.cargando ? "Cargando redes…" : d && d.error ? `<span style="color:var(--danger);font-weight:600">${escA(d.error)}</span>`

            <div class="text-xs mt-2" style="color:var(--ink-soft)">Usa ◎ en el mapa para volver a tu ubicación, o mueve el mapa y toca «Cargar esta zona».</div>

          <div class="card p-4 mt-3">
            <div class="gis-lbl">Capas</div>
            <div class="rg-capas">${RG_CAPAS.map(c => `<label class="rg-capa"><input type="checkbox" class="rgCapa" data-k="${c.k}" ${vis[c.k] ? "checked" : ""}>${c.k === "et" ? `<span class="rg-et">AC 100</span>` : muestra(c.k)}<span>${c.n}</span></label>`).join("")}</div>

    document.querySelectorAll(".rgRadio").forEach(b => b.onclick = () => {

    }
  }
  async function cargarReplica(lat, lon, origen) {
    const r = state.rgRadio || 200;
    if (!apiListo() || !enLinea()) { state.rgDatos = { error: "Necesitas internet para cargar las redes" }; return renderReplica(); }

    const est = document.getElementById("rgEstado"); if (est) est.textContent = "Cargando redes…";
    try {
      const d = await rdApi("gis_cerca", { lat: lat.toFixed(6), lon: lon.toFixed(6), r });
      state.rgDatos = { centro: [lat, lon], origen, r: d.r, lineas: prepararLineas(d.lineas), puntos: d.puntos, encuadrar: true };
    } catch (e) {
      state.rgDatos = { centro: [lat, lon], origen, r, error: e && e.code === "sin_replica" ? "Falta cargar la carpeta ECRF_REPLICA_GIS en el Drive" : msgError(e) };
    }

  // cada tubería con su caja (para dibujar solo las que tocan cada cuadro del mapa)
  function prepararLineas(ls) {
    return (ls || []).map(f => {
      const c = []; let s = 90, n = -90, w = 180, e = -180;
      for (let i = 3; i + 1 < f.length; i += 2) { const la = f[i] / 1e6, lo = f[i + 1] / 1e6; c.push([la, lo]); s = Math.min(s, la); n = Math.max(n, la); w = Math.min(w, lo); e = Math.max(e, lo); }

        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg></a>`;
      L.DomEvent.disableClickPropagation(box);

        if (reciente) cargarReplica(v.lat, v.lon, "gps");

        if (!c) { if (!reciente) toast("No se pudo obtener tu ubicación. Revisa que el GPS esté activo", true); return; }

      });

    } });
    new Botones().addTo(replicaL);
    const Zona = L.Control.extend({ options: { position: "topright" }, onAdd() {

      const b = document.getElementById("rgZona"), c = state.rgDatos && state.rgDatos.centro; if (!b) return;

    });
    if (d.centro && d.encuadrar) { replicaL.fitBounds(L.latLng(d.centro).toBounds(d.r * 2), { padding: [10, 10], maxZoom: 19 }); d.encuadrar = false; }

  // ---------- dibujo en lienzo (no interactivo) ----------
  const CapaRedes = () => L.GridLayer.extend({
    options: { updateWhenIdle: false, keepBuffer: 2, maxZoom: 20, zIndex: 450 },
    createTile(c) {
      const t = document.createElement("canvas"), dpr = Math.min(2, window.devicePixelRatio || 1);
      t.width = t.height = 256 * dpr; t.style.width = t.style.height = "256px";
      const d = state.rgDatos; if (!d || !d.lineas) return t;
      try {
        const x = t.getContext("2d"); x.scale(dpr, dpr);
        const m = this._map, z = c.z, ox = c.x * 256, oy = c.y * 256, vis = rgVisibles();
        const xy = (la, lo) => { const p = m.project([la, lo], z); return [p.x - ox, p.y - oy]; };
        const marg = 70;                                                   // para etiquetas e íconos que cruzan el borde
        const nw = m.unproject([ox - marg, oy - marg], z), se = m.unproject([ox + 256 + marg, oy + 256 + marg], z);
        const dentro = (la, lo) => la <= nw.lat && la >= se.lat && lo >= nw.lng && lo <= se.lng;
        const lineas = d.lineas.filter(l => l.n >= se.lat && l.s <= nw.lat && l.e >= nw.lng && l.w <= se.lng);
        // 1) tuberías: primero las secundarias, encima las primarias
        x.lineCap = "round"; x.lineJoin = "round";
        [2, 1].forEach(tipo => {
          if (!vis[tipo === 1 ? "prim" : "sec"]) return;

          lineas.forEach(l => {
            if (!vis[l.t === 1 ? "prim" : "sec"] || !l.et) return;
            const w = x.measureText(l.et).width + 12;
            // el tramo más largo de la tubería lleva la etiqueta (y uno cada ~250 px si es muy larga)

            tramos.slice(0, Math.max(1, Math.floor(tramos.reduce((s, q) => s + q.len, 0) / 250))).forEach(({ a, b }) => {

  // Simbología de accesorios (como la leyenda del GIS). El eje x sigue la tubería.
  const RG_ACC_LEY = [["CRU", "Cruz"], ["T", "Tee"], ["Y", "Yee"], ["COD", "Codo"], ["THID", "Tee de hidrante"], ["UNI", "Unión"], ["TAP", "Tapón"],
                      ["RED", "Reducción"], ["TRED", "Tee de reducción"], ["CRED", "Cruz de reducción"], ["CR", "CR"], ["OTRO", "Otro"]];
  function dibujarAccesorio(x, cod, rot, esc) {
    x.save(); x.rotate(rot || 0); x.scale(esc || 1, esc || 1);

    const flecha = (px, py, dir) => { x.beginPath(); x.moveTo(px + dir * 3, py); x.lineTo(px - dir * 1.5, py - 2.5); x.lineTo(px - dir * 1.5, py + 2.5); x.closePath(); x.fill(); };

      case "T": linea(-s, 0, s, 0); linea(0, 0, 0, -s); tope(-s, 0, 1); tope(s, 0, 1); tope(0, -s, 0); break;
      case "Y": linea(-s, 0, s, 0); linea(0, 0, 4, -4.5); tope(-s, 0, 1); tope(s, 0, 1); break;
      case "COD": linea(-s, 0, 0, 0); linea(0, 0, 0, -s); tope(-s, 0, 1); tope(0, -s, 0); break;
      case "THID": x.strokeStyle = "#5A3A1A"; x.fillStyle = "#5A3A1A"; linea(-s, 0, s, 0); linea(0, 0, 0, -s); tope(-s, 0, 1); tope(s, 0, 1);

      case "TAP": linea(-1.5, -s, -1.5, s); linea(1.5, -s, 1.5, s); break;
      case "JEXP": x.fillRect(-4, -4, 8, 8); x.strokeStyle = "#fff"; linea(-2.5, -2.5, 2.5, -2.5); linea(2.5, -2.5, -2.5, 2.5); linea(-2.5, 2.5, 2.5, 2.5); break;
      case "RED": x.beginPath(); x.moveTo(-4, -4); x.lineTo(4, 0); x.lineTo(-4, 4); x.closePath(); x.fill(); break;
      case "TRED": linea(-s, 0, s, 0); linea(0, 0, 0, -s); flecha(-s + 1, 0, -1); flecha(s - 1, 0, 1); tope(0, -s, 0); break;
      case "CRED": linea(-s, 0, s, 0); linea(0, -s, 0, s); flecha(-s + 1, 0, -1); flecha(s - 1, 0, 1); flecha(0, -s + 1, 0); tope(0, -s, 0); tope(0, s, 0); break;
      case "CR": x.beginPath(); x.moveTo(-4, -4); x.lineTo(4, 0); x.lineTo(-4, 4); x.closePath(); x.fill(); x.fillRect(-4, -1, 3, 2); break;

  function fotoReducida(file) {

      img.src = url;
    });

  function htmlAdminVehiculo() {
    const d = state.labDatos;
    if (!d) { cargarLab(); return `<div class="text-sm py-6" style="color:var(--ink-soft)">Cargando…</div>`; }
    if (d.error) return `<div class="card p-4 text-sm" style="color:var(--danger)">${escA(d.error)}</div>`;
    const v = state.adminVeh || (state.adminVeh = { diasAlerta: "7", estado: "Operativo", ...(d.vehiculo || {}) });
    const campo = ([k, n, tipo]) => `<div ${k === "tipoUnidad" || k === "modelo" || k === "mantDetalle" || tipo === "url" ? 'style="grid-column:1/-1"' : ""}>
      <label class="gis-lbl" for="veh_${k}">${n}${k === "placa" ? " *" : ""}</label>
      ${tipo === "estado" ? `<select id="veh_${k}" class="input vehCampo" data-k="${k}">${ESTADOS_VEH.map(e => `<option ${e === v[k] ? "selected" : ""}>${e}</option>`).join("")}</select>`
        : `<input id="veh_${k}" class="input vehCampo" data-k="${k}" ${tipo === "fecha" ? 'type="date"' : tipo === "num" ? 'type="number" min="1" max="90"' : tipo === "url" ? 'type="url" placeholder="https://drive.google.com/…"' : ""} value="${escA(v[k] || "")}">`}</div>`;
    return `<div class="adm-veh">${LAB_SECCIONES.map(s => `<section class="card p-4"><h3 class="lab-st">${s.t}</h3><div class="grid gap-3 lab-form2">${s.c.map(campo).join("")}</div></section>`).join("")}</div>

      <div class="adm-guardar-veh"><button id="vehGuardar" class="btn-primary">Guardar datos del vehículo</button></div>`;
  }
  function activarAdminVehiculo(app) {
    app.querySelectorAll(".vehCampo").forEach(i => i.oninput = i.onchange = () => { state.adminVeh[i.dataset.k] = i.value; });
    const b = document.getElementById("vehGuardar"); if (!b) return;
    b.onclick = async () => {
      const e = document.getElementById("vehErr"); e.textContent = "";
      const v = state.adminVeh;
      if (!String(v.placa || "").trim()) { e.textContent = "La placa es obligatoria"; return; }
      const malo = LAB_SECCIONES.flatMap(s => s.c).find(([k, , t]) => t === "url" && v[k] && !/^https:\/\//.test(v[k]));
      if (malo) { e.textContent = "El enlace de «" + malo[1] + "» debe empezar con https://"; return; }
      b.disabled = true; b.textContent = "Guardando…";
      try { state.labDatos = await rdApi("lab_vehiculo", { vehiculo: v }); state.adminVeh = null; toast("Vehículo guardado ✅"); }
      catch (x) { e.textContent = msgError(x); }
      b.disabled = false; b.textContent = "Guardar datos del vehículo";
      if (state.admin) { const y = window.scrollY; renderAdmin(); window.scrollTo(0, y); }
    };
  }

  /* ---------------- Generar PDF (cada operario el suyo; el supervisor, el de cualquiera) ---------------- */
  const MESES_APP = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","setiembre","octubre","noviembre","diciembre"];
  function abrirPanelPdf() {
    const hoy = new Date();
    const meses = [];
    for (let i = 0; i < 6; i++) {
      const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
      meses.push({ v: d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"), t: MESES_APP[d.getMonth()] + " " + d.getFullYear() });
    }
    const p = state.pdf = state.pdf || { form: "GPFO0381", mes: meses[0].v, quincena: hoy.getDate() <= 15 ? 1 : 2, para: state.operario };
    if (!esSupervisor()) p.para = state.operario;
    let el = document.getElementById("panelPdf");
    if (!el) {
      el = document.createElement("div"); el.id = "panelPdf";
      el.style.cssText = "position:fixed;inset:0;z-index:80;background:rgba(3,32,76,.55);display:flex;align-items:flex-end;justify-content:center";
      document.body.appendChild(el);
      el.addEventListener("click", e => { if (e.target === el) cerrarPanelPdf(); });
    }
    const chip = (grupo, v, t, activo) => `<button data-${grupo}="${v}" style="min-height:46px;border-radius:12px;font-weight:700;font-size:15px;border:${activo ? "2px solid var(--brand-dark);background:var(--brand-dark);color:#fff" : "1.5px solid #CFD8E3;background:#fff;color:var(--ink)"}">${t}</button>`;
    const nombres = OPERARIOS.map(o => o.name);   // el supervisor puede generar el suyo o el de cualquier operario
    el.innerHTML = `
      <div style="background:#F2F5F8;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <b style="font-size:20px;color:var(--brand-dark)">Generar PDF</b>
          <button id="pdfCerrar" aria-label="Cerrar" style="font-size:24px;line-height:1;background:none;border:0;color:var(--ink-soft);width:40px;height:40px">✕</button>
        </div>
        <label class="text-sm font-semibold block mb-1" style="color:var(--ink-soft)">Operario</label>
        ${esSupervisor()
          ? `<select id="pdfPara" class="w-full mb-3" style="height:50px;border:1.5px solid #CFD8E3;border-radius:12px;background:#fff;padding:0 12px;font-size:16px;font-weight:600">
               ${nombres.map(n => `<option ${n === p.para ? "selected" : ""}>${escA(n)}</option>`).join("")}</select>`
          : `<div class="mb-3" style="height:50px;display:flex;align-items:center;border-radius:12px;background:#fff;border:1.5px solid #CFD8E3;padding:0 12px;font-size:16px;font-weight:600">${escA(state.operario)}</div>`}
        <label class="text-sm font-semibold block mb-1" style="color:var(--ink-soft)">Formulario</label>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px" class="mb-3">
          ${chip("f", "GPFO0381", "0381<br><small style='font-weight:500'>Presiones</small>", p.form === "GPFO0381")}
          ${chip("f", "GPFO0405", "0405<br><small style='font-weight:500'>Reparación</small>", p.form === "GPFO0405")}
          ${chip("f", "GPFO0416", "0416<br><small style='font-weight:500'>Muestreo</small>", p.form === "GPFO0416")}
        </div>
        <label class="text-sm font-semibold block mb-1" style="color:var(--ink-soft)">Mes</label>
        <select id="pdfMes" class="w-full mb-3" style="height:50px;border:1.5px solid #CFD8E3;border-radius:12px;background:#fff;padding:0 12px;font-size:16px;font-weight:600">
          ${meses.map(m => `<option value="${m.v}" ${m.v === p.mes ? "selected" : ""}>${m.t}</option>`).join("")}
        </select>
        ${p.form === "GPFO0416" ? `
          <label class="text-sm font-semibold block mb-1" style="color:var(--ink-soft)">Quincena</label>
          <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px" class="mb-3">
            ${chip("q", 1, "1ra · del 1 al 15", p.quincena === 1)}
            ${chip("q", 2, "2da · del 16 al fin", p.quincena === 2)}
          </div>` : ""}
        <div id="pdfEstado" class="text-sm mb-3" style="color:var(--ink-soft)"></div>
        <button id="pdfGenerar" class="btn-primary w-full">Generar PDF</button>
      </div>`;
    el.querySelector("#pdfCerrar").onclick = cerrarPanelPdf;
    el.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { p.form = b.dataset.f; abrirPanelPdf(); });
    el.querySelectorAll("[data-q]").forEach(b => b.onclick = () => { p.quincena = Number(b.dataset.q); abrirPanelPdf(); });
    el.querySelector("#pdfMes").onchange = e => { p.mes = e.target.value; };
    const sel = el.querySelector("#pdfPara"); if (sel) sel.onchange = e => { p.para = e.target.value; };
    el.querySelector("#pdfGenerar").onclick = generarPdf;
  }
  function cerrarPanelPdf() { const el = document.getElementById("panelPdf"); if (el) el.remove(); }

  async function generarPdf() {
    const p = state.pdf, est = document.getElementById("pdfEstado"), btn = document.getElementById("pdfGenerar");
    const aviso = (t, color) => { est.style.color = color || "var(--ink-soft)"; est.innerHTML = t; };
    if (!apiListo() || !enLinea()) { aviso("Necesitas internet para generar el PDF.", "#8E2019"); return; }
    btn.disabled = true; btn.textContent = "Generando…";
    try {
      if (p.para === state.operario && await porSubir()) {          // primero se suben los registros pendientes del celular
        aviso("Subiendo tus registros pendientes…");
        await sincronizar();
      }
      const quedan = p.para === state.operario ? await porSubir() : 0;
      aviso("Armando el PDF, espera unos segundos…");
      const r = await apiPost({ tipo: "pdf", para: p.para, form: p.form, mes: p.mes, quincena: p.quincena });
      aviso(`<div style="background:#DDF3E7;color:#12613B;border-radius:12px;padding:12px">
          <b>Listo:</b> ${r.n} registro(s) · ${escA(r.periodo)}<br><span style="font-size:12px;word-break:break-all">${escA(r.nombre)}</span>
          ${quedan ? `<br><span style="color:#6B4A00">Ojo: ${quedan} registro(s) aún no se subieron y no salen en el PDF.</span>` : ""}
        </div>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px">
          <a href="${r.url}" target="_blank" rel="noopener" class="btn-ghost" style="display:flex;align-items:center;justify-content:center;text-decoration:none">Ver PDF</a>
          <a href="${r.descarga}" target="_blank" rel="noopener" class="btn-primary" style="display:flex;align-items:center;justify-content:center;text-decoration:none">Descargar</a>
        </div>`);
    } catch (e) {
      const msg = e && e.code === "sin_registros" ? e.message
        : e && e.code === "permiso" ? e.message
        : "No se pudo generar el PDF. Revisa tu internet e inténtalo otra vez.";
      aviso(escA(msg || ""), "#8E2019");
    } finally {
      btn.disabled = false; btn.textContent = "Generar PDF";
    }
  }

  /* ---------------- App instalable / actualizaciones ---------------- */
  function avisoActualizacion(sw) {
    if (document.getElementById("avisoVersion")) return;
    const el = document.createElement("div");
    el.id = "avisoVersion";
    el.style.cssText = "position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:90;background:#03204C;color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3)";
    el.innerHTML = `<div style="flex:1;font-weight:600;font-size:14px">Hay una nueva versión de la app</div><button style="background:#33B1E4;color:#03204C;border:0;border-radius:10px;padding:8px 12px;font-weight:800">Actualizar</button>`;
    el.querySelector("button").onclick = () => { sw.postMessage("actualizar"); };
    document.body.appendChild(el);
  }
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    let recargando = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (!recargando) { recargando = true; location.reload(); } });
    navigator.serviceWorker.register("sw.js").then(reg => {
      if (reg.waiting && navigator.serviceWorker.controller) avisoActualizacion(reg.waiting);
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        nw && nw.addEventListener("statechange", () => { if (nw.state === "installed" && navigator.serviceWorker.controller) avisoActualizacion(nw); });
      });
      setInterval(() => reg.update().catch(() => {}), 30 * 60000);
    }).catch(() => {});
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
