<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">

<title>ECRF Campo – SEDAPAL</title>

<script src="config.js"></script>

<style>
  :root {
    --bg: #EEF3F8;
    --card: #ffffff;
    --ink: #0F1B2D;
    --ink-soft: #4A5A6E;
    --line: #D3DDE8;
    --brand: #0B5FA5;
    --brand-dark: #03204C;
    --cyan: #33B1E4;
    --accent: #F2A900;
    --danger: #C0362C;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  .input {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font-size: 16px;
  }
  .input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(51,177,228,.30); }
  .btn-primary {
    background: var(--brand); color: white; border-radius: 12px; padding: 13px 18px;
    font-weight: 600; text-align: center; border: none;
  }
  .btn-primary:disabled { opacity: .45; }
  .btn-primary:active { background: var(--brand-dark); }
  .btn-ghost {
    background: transparent; color: var(--brand); border: 1px solid var(--brand);
    border-radius: 12px; padding: 12px 16px; font-weight: 600;
  }
  /* campo que no se puede modificar (datos de la base de NIS, fecha y hora automáticas) */
  .input-ro { background: #EEF2F6 !important; color: #334155; border-color: #D5DEE8 !important; display: flex; align-items: center; gap: 6px; min-height: 48px; }
  .input-ro::before { content: "🔒"; font-size: 12px; opacity: .65; }
  input.input-ro::before { content: none; }
  /* «Ver en mapa»: bloque propio debajo del último campo, sin montarse sobre «Sector» */
  .btn-mapa { display: flex; width: 100%; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; clear: both; position: relative; min-height: 48px; }
  .btn-app { display: flex; justify-content: center; align-items: center; gap: 10px; text-decoration: none; }
  .ico-app { display: inline-flex; flex: none; }
  .ico-app img { width: 26px; height: 26px; border-radius: 7px; background: #fff; object-fit: contain; }
  .pl-waze .ico-app img { width: 18px; height: 18px; border-radius: 5px; }
  .ico-gen { align-items: center; }
  .pl-waze { display: inline-flex; align-items: center; gap: 5px; }
  .ubi-sel { display: grid; gap: 8px; }
  .ubi-tipo { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--brand-dark); border-radius: 12px; overflow: hidden; }
  .ubi-tipo button { min-height: 46px; font-weight: 800; font-size: 15px; background: var(--card); color: var(--ink); border: 0; }
  .ubi-tipo button[aria-pressed="true"] { background: var(--brand-dark); color: #fff; }
  .ubiLista:disabled { opacity: .6; }
  .pin-dot {
    width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--brand); background: transparent;
  }
  .pin-dot.filled { background: var(--brand); }
  .keypad button {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    font-size: 24px; font-weight: 600; color: var(--ink); padding: 0; min-height: 58px;
  }
  .keypad button:active { background: var(--line); }
  .tab-btn { flex: 1; text-align: center; padding: 12px 0; font-weight: 600; color: var(--ink-soft); border-bottom: 3px solid transparent; }
  .tab-btn.active { color: var(--brand); border-color: var(--cyan); }
  .hero { background: var(--brand-dark); color: #fff; position: relative; overflow: hidden; }
  .hero::after { content: ""; position: absolute; left: -10%; right: -10%; bottom: -38px; height: 70px; border-radius: 50%; background: var(--bg); }
  .logo-chip { background: #fff; border-radius: 10px; padding: 5px 8px; display: inline-flex; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  .logo-chip img { display: block; height: 22px; width: auto; }
  .mano { display: block; }
  @keyframes aguja { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-6deg); } }
  .mano-anim .aguja { transform-origin: 60px 58px; animation: aguja 2.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .mano-anim .aguja { animation: none; } }
  .photo-slot {
    aspect-ratio: 1; border-radius: 12px; border: 2px dashed var(--line);
    display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
    background: var(--card);
  }
  .photo-slot img { width: 100%; height: 100%; object-fit: cover; }
  .badge { font-size: 12px; padding: 4px 10px; border-radius: 999px; font-weight: 600; }
  /* ---------- Intro animada ---------- */
  .intro { position: fixed; inset: 0; z-index: 100; background: #03204C; color: #fff; display: flex; flex-direction: column;
           padding: calc(14px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px)); overflow: hidden;
           transition: opacity .45s ease; }
  .intro.salir { opacity: 0; pointer-events: none; }
  .intro-saltar { position: absolute; top: calc(14px + env(safe-area-inset-top,0px)); right: 16px; background: rgba(255,255,255,.14);
                  color: #fff; border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; z-index: 2; }
  .intro-top { display: flex; flex-direction: column; gap: 14px; }
  .intro-logo { align-self: flex-start; opacity: 0; animation: iFade .5s .1s forwards; }
  .intro-h1 { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; }
  .intro-h1 .t1 { font-size: 30px; font-weight: 800; opacity: 0; transform: translateY(10px); animation: iUp .5s .35s forwards; }
  .intro-h1 .t2 { font-size: 62px; font-weight: 900; letter-spacing: 1px; color: #F2C230; opacity: 0; transform: scale(.6);
                  transform-origin: left center; animation: iPop .55s .6s cubic-bezier(.2,1.6,.4,1) forwards; text-shadow: 0 4px 0 #B88100; }
  .intro-h1 .t3 { margin-top: 10px; background: #33B1E4; color: #03204C; font-weight: 800; font-size: 17px; padding: 6px 12px; border-radius: 8px;
                  opacity: 0; transform: translateX(-16px); animation: iSide .5s .95s forwards; }
  .intro-escena { flex: 1; width: 100%; min-height: 0; margin-top: 8px; }
  .i-panel { opacity: 0; transform: translateY(14px); transform-box: fill-box; animation: iUp .5s 1.5s forwards; }
  .i-onda { stroke-dasharray: 320; stroke-dashoffset: 320; animation: iTrazo 1.4s 1.9s ease-out forwards; }
  .i-led { opacity: .25; animation: iLed .5s 3.2s 4 alternate; }
  .i-tecnico { opacity: 0; transform: translateX(60px); animation: iSideR .7s .5s ease-out forwards; }
  .i-ola { transform-box: fill-box; transform-origin: center; transform: scale(.05); opacity: 0; }
  .i-ola.o1 { animation: iOla 1.8s 1.2s infinite; } .i-ola.o2 { animation: iOla 1.8s 1.8s infinite; } .i-ola.o3 { animation: iOla 1.8s 2.4s infinite; }
  .i-chorro circle { opacity: 0; }
  .i-chorro .g1 { animation: iGota1 1s .9s infinite; } .i-chorro .g2 { animation: iGota2 1s 1.15s infinite; }
  .i-chorro .g3 { animation: iGota3 1s 1.4s infinite; } .i-chorro .g4 { animation: iGota4 1s 1.65s infinite; }
  .i-alerta { opacity: 0; animation: iFade .4s 3.1s forwards; }
  .i-ping { transform-box: fill-box; transform-origin: center; animation: iPing 1s 3.1s infinite; }
  .intro-pie { display: flex; flex-direction: column; gap: 12px; opacity: 0; animation: iFade .6s 3.6s forwards; }
  .intro-app { display: flex; align-items: center; gap: 12px; }
  .intro-app b { display: block; font-size: 22px; font-weight: 900; }
  .intro-app small { color: #C9D8EA; font-size: 13px; }
  .intro-barra { height: 4px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; }
  .intro-barra i { display: block; height: 100%; width: 0; background: #33B1E4; animation: iBarra 5.4s linear forwards; }
  @keyframes iFade { to { opacity: 1; } }
  @keyframes iUp { to { opacity: 1; transform: none; } }
  @keyframes iSide { to { opacity: 1; transform: none; } }
  @keyframes iSideR { to { opacity: 1; transform: none; } }
  @keyframes iPop { to { opacity: 1; transform: scale(1); } }
  @keyframes iTrazo { to { stroke-dashoffset: 0; } }
  @keyframes iLed { to { opacity: 1; } }
  @keyframes iOla { 0% { transform: scale(.05); opacity: .9; } 100% { transform: scale(1); opacity: 0; } }
  @keyframes iPing { 0% { transform: scale(.6); opacity: 1; } 100% { transform: scale(1.8); opacity: 0; } }
  @keyframes iGota1 { 0% { opacity: 1; transform: translate(0,0); } 100% { opacity: 0; transform: translate(-16px,-26px); } }
  @keyframes iGota2 { 0% { opacity: 1; transform: translate(0,0); } 100% { opacity: 0; transform: translate(12px,-30px); } }
  @keyframes iGota3 { 0% { opacity: 1; transform: translate(0,0); } 100% { opacity: 0; transform: translate(-4px,-34px); } }
  @keyframes iGota4 { 0% { opacity: 1; transform: translate(0,0); } 100% { opacity: 0; transform: translate(20px,-18px); } }
  @keyframes iBarra { to { width: 100%; } }
  @media (prefers-reduced-motion: reduce) {
    .intro *, .intro *::before { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
  }

  /* ---------- Menú de formularios ---------- */
  .menu-hero { position: relative; overflow: hidden; background: #0B5FA5; color: #fff; min-height: 236px;
               padding: calc(12px + env(safe-area-inset-top,0px)) 16px 0; }
  .menu-paisaje { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; }
  .menu-top { position: relative; display: flex; align-items: center; justify-content: space-between; }
  .menu-salir { background: rgba(3,32,76,.55); color: #fff; border: 1px solid rgba(255,255,255,.35); border-radius: 10px;
                padding: 8px 14px; font-weight: 700; font-size: 14px; }
  .menu-txt { position: relative; margin-top: 14px; }
  .menu-hola { display: inline-block; background: #03204C; color: #fff; font-size: 13px; font-weight: 700;
               padding: 4px 10px; border-radius: 999px; }
  .menu-tit { font-size: 34px; font-weight: 900; line-height: 1.05; margin-top: 6px; letter-spacing: -.5px;
              text-shadow: 0 2px 0 rgba(3,32,76,.45); }
  .menu-sub { font-size: 14px; font-weight: 600; color: #E1F3FB; margin-top: 2px; }
  .menu-elige { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 800; color: var(--brand-dark); }
  .menu-elige-num { width: 32px; height: 32px; border-radius: 10px; background: var(--brand); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
  .form-card { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--card);
               border: 1.5px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
  .form-card:not(:disabled):active { transform: scale(.99); }
  .form-card:disabled { opacity: .78; }
  .menu-grupo { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: #5B6B7F; margin: 18px 4px 8px; }
  .menu-grupo:first-child { margin-top: 4px; }
  /* Barra lateral (solo PC) */
  .lat { position: fixed; top: 0; bottom: 0; left: 0; width: 280px; background: #fff; border-right: 1px solid var(--line); z-index: 60; display: none; flex-direction: column; overflow-y: auto; }
  @media (min-width: 1024px) { body.con-lat { padding-left: 280px; } body.con-lat .lat { display: flex; } }
  .lat-marca { display: flex; align-items: center; gap: 10px; padding: calc(14px + env(safe-area-inset-top,0px)) 16px 14px; background: var(--brand-dark); color: #fff; }
  .lat-marca b { display: block; font-size: 17px; font-weight: 900; line-height: 1.1; }
  .lat-marca small { display: block; font-size: 11px; color: #C9D8EA; }
  .lat-inicio { display: block; width: calc(100% - 24px); margin: 12px 12px 4px; text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #F6F9FC; }
  .lat-inicio span { display: block; font-weight: 800; font-size: 14px; color: var(--brand-dark); }
  .lat-inicio small { font-size: 11px; color: var(--ink-soft); }
  .lat-inicio[aria-current="true"] { border-color: #7CCBEA; background: #E1F3FB; }
  .lat-grupos { padding: 6px 12px 12px; display: grid; gap: 14px; flex: 1; align-content: start; }
  .lat-gtit { font-size: 11px; font-weight: 800; color: #8A97A8; text-transform: uppercase; letter-spacing: .07em; padding: 0 6px; margin-bottom: 6px; }
  .lat-item { width: 100%; display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: 12px; text-align: left; color: var(--ink); background: transparent; border: 0; }
  .lat-item:hover { background: #F1F5F9; }
  .lat-item:focus-visible, .lat-inicio:focus-visible { outline: 3px solid #33B1E4; outline-offset: 1px; }
  .lat-item[aria-current="true"] { background: #00639E; color: #fff; box-shadow: 0 2px 6px rgba(0,99,158,.25); }
  .lat-item b { display: block; font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lat-item small { display: block; font-size: 11px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lat-item[aria-current="true"] small { color: #CFE8F7; }
  .lat-ico { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: 0 0 32px; color: var(--brand-dark); }
  .lat-ico svg { width: 18px; height: 18px; }
  .lat-item[aria-current="true"] .lat-ico { background: rgba(255,255,255,.2) !important; color: #fff; }
  .lat-pie { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px calc(12px + env(safe-area-inset-bottom,0px)); border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-soft); background: #F8FAFC; }
  .lat-pie button { color: var(--danger); font-weight: 700; }
  .form-ico { width: 64px; height: 64px; border-radius: 16px; background: #E1F3FB; display: grid; place-items: center; flex-shrink: 0; }
  .preview-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 60;
    display: flex; flex-direction: column;
  }
  .cam-overlay { position: fixed; inset: 0; background: #000; z-index: 70; display: flex; flex-direction: column; }
  .cam-overlay video { flex: 1; width: 100%; min-height: 0; object-fit: cover; background: #000; }
  .cam-bar { display: flex; align-items: center; justify-content: space-between; padding: 18px 28px calc(22px + env(safe-area-inset-bottom,0px)); }
  .cam-shutter { width: 76px; height: 76px; border-radius: 50%; background: #fff; border: 6px solid rgba(255,255,255,.35); background-clip: padding-box; }
  .cam-shutter:active { transform: scale(.94); }
  .cam-side { width: 64px; color: #fff; font-size: 15px; font-weight: 600; background: none; border: 0; }
  .preview-overlay img {
    flex: 1; width: 100%; object-fit: contain; touch-action: pinch-zoom;
  }
  .toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    background: var(--brand-dark); color: white; padding: 14px 16px; border-radius: 14px;
    font-weight: 600; text-align: center; z-index: 50; box-shadow: 0 10px 30px rgba(0,0,0,.25); pointer-events: none;
    transition: transform .25s ease, opacity .25s ease;
  }
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>

<body>

<div id="app" class="mx-auto max-w-md min-h-screen flex flex-col"></div>

<script id="nis-data" type="application/json">[]</script>

<script>
(function () {
  "use strict";

  /* ============ CONFIGURACION: editar aqui ============ */
  /* ================= CONFIGURACIÓN DEL SERVIDOR (Google Apps Script) ================= */
  // Los valores reales se escriben en config.js (así no hay que tocar este archivo)
  const API_URL = (window.ECRF_CONFIG && window.ECRF_CONFIG.API_URL) || "";
  const TOKEN   = (window.ECRF_CONFIG && window.ECRF_CONFIG.TOKEN) || "";
  const APP_VERSION = "1.0.0";
  const apiListo = () => /^https:\/\/script\.google\.com\//.test(API_URL);

  async function apiGet(params) {
    const q = new URLSearchParams({ ...params, token: TOKEN, quien: localStorage.getItem("gpfo_operario") || "", t: Date.now() });
    const r = await fetch(API_URL + "?" + q.toString());
    if (!r.ok) throw { code: "http_" + r.status };
    const j = await r.json(); if (!j.ok) throw { code: j.error || "servidor", message: j.msg }; return j;
  }
  async function apiPost(body) {
    // text/plain evita la verificación previa (CORS); Apps Script recibe el JSON igual
    const r = await fetch(API_URL, { method: "POST", body: JSON.stringify({ ...body, token: TOKEN, operario: localStorage.getItem("gpfo_operario") || "" }) });
    if (!r.ok) throw { code: "http_" + r.status };
    const j = await r.json(); if (!j.ok) throw { code: j.error || "servidor", message: j.msg }; return j;
  }
  // Adaptador: misma forma que la base de datos anterior, pero guarda en Google Sheets
  function coleccion(nombre) {
    const q = {
      _n: 500,
      orderBy() { return q; },
      limit(n) { q._n = n; return q; },
      async get() {
        const r = await apiGet({ action: "list", col: nombre, n: q._n });
        return { docs: r.items.map(x => ({ id: x.id, data: () => x.data })) };
      },
      doc(id) {
        return {
          set: data => apiPost({ tipo: "set", col: nombre, id, data }),
          update: data => apiPost({ tipo: "update", col: nombre, id, data }),
          delete: () => apiPost({ tipo: "delete", col: nombre, id })
        };
      }
    };
    return q;
  }
  const driveDb = { collection: coleccion };
  const blobABase64 = b => new Promise((ok, mal) => { const f = new FileReader(); f.onload = () => ok(String(f.result).split(",")[1]); f.onerror = mal; f.readAsDataURL(b); });
  const driveAssets = {
    async upload(blob, opt = {}) {
      const r = await apiPost({ tipo: "foto", base64: await blobABase64(blob), meta: opt.meta || {} });
      return { id: r.id };
    },
    delete: id => apiPost({ tipo: "foto_del", id })
  };
  const fotoUrl = id => "https://drive.google.com/thumbnail?id=" + encodeURIComponent(id) + "&sz=w800";
  const fotoUrlGrande = id => "https://drive.google.com/thumbnail?id=" + encodeURIComponent(id) + "&sz=w2000";
  // Fotos de un registro: las del celular (aún no subidas) o las del Drive
  const urlsLocales = {};
  function fotosDe(r) {
    if (r.local && r.fotosBlobs && r.fotosBlobs.length) {
      if (!urlsLocales[r.id]) urlsLocales[r.id] = r.fotosBlobs.map(b => URL.createObjectURL(b));
      return urlsLocales[r.id].map(u => ({ mini: u, grande: u }));
    }
    return (r.fotos || []).map(id => ({ mini: fotoUrl(id), grande: fotoUrlGrande(id) }));
  }

  /* ---------------- Visor de fotos a pantalla completa ----------------
     Tocar una foto la abre grande. Se pasa con las flechas o deslizando; doble toque = acercar. */
  function abrirVisor(fotos, idx) {
    if (!fotos.length) return;
    let i = Math.max(0, Math.min(idx || 0, fotos.length - 1)), zoom = false;
    let el = document.getElementById("visorFotos");
    if (!el) { el = document.createElement("div"); el.id = "visorFotos"; document.body.appendChild(el); }
    el.style.cssText = "position:fixed;inset:0;z-index:98;background:#000;display:flex;flex-direction:column";
    const pintar = () => {
      el.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;color:#fff">
          <b style="font-size:15px">Foto ${i + 1} de ${fotos.length}</b>
          <button id="visorCerrar" aria-label="Cerrar" style="background:none;border:0;color:#fff;font-size:26px;width:44px;height:44px">✕</button>
        </div>
        <div id="visorArea" style="flex:1;overflow:auto;display:flex;align-items:${zoom ? "flex-start" : "center"};justify-content:${zoom ? "flex-start" : "center"};touch-action:${zoom ? "pan-x pan-y" : "pan-y"}">
          <img id="visorImg" src="${fotos[i].grande}" alt="Foto ${i + 1}" style="${zoom ? "width:220%;max-width:none;flex-shrink:0" : "max-width:100%;max-height:100%;object-fit:contain"}"
            onerror="this.onerror=null;this.src='${fotos[i].mini}'">
        </div>
        ${fotos.length > 1 ? `
        <div style="display:flex;justify-content:space-between;padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px))">
          <button id="visorAnt" style="background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:700" ${i === 0 ? "disabled" : ""}>‹ Anterior</button>
          <button id="visorSig" style="background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:700" ${i === fotos.length - 1 ? "disabled" : ""}>Siguiente ›</button>
        </div>` : `<div style="height:calc(14px + env(safe-area-inset-bottom,0px))"></div>`}
        <div style="position:absolute;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));text-align:center;color:#C9D8EA;font-size:12px;pointer-events:none">Doble toque para acercar</div>`;
      el.querySelector("#visorCerrar").onclick = cerrarVisor;
      const ir = d => { if (i + d >= 0 && i + d < fotos.length) { i += d; zoom = false; pintar(); } };
      const a = el.querySelector("#visorAnt"), s = el.querySelector("#visorSig");
      if (a) a.onclick = () => ir(-1); if (s) s.onclick = () => ir(1);
      const area = el.querySelector("#visorArea");
      let x0 = null, ultimoToque = 0;
      area.ontouchstart = e => { if (e.touches.length === 1) x0 = e.touches[0].clientX; };
      area.ontouchend = e => {
        const ahora = Date.now();
        if (ahora - ultimoToque < 300) { zoom = !zoom; pintar(); ultimoToque = 0; return; }
        ultimoToque = ahora;
        if (x0 === null || zoom) return;
        const dx = e.changedTouches[0].clientX - x0; x0 = null;
        if (Math.abs(dx) > 60) ir(dx < 0 ? 1 : -1);
      };
      area.ondblclick = () => { zoom = !zoom; pintar(); };
    };
    pintar();
  }
  function cerrarVisor() { const el = document.getElementById("visorFotos"); if (el) el.remove(); }
  async function sha256(t) {
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
  }

  // Operarios de campo y su FICHA (5 dígitos).
  const LARGO_FICHA = 5;
  const OPERARIOS_DEFECTO = [
    { name: "Erick Espinoza Pacosonco", ficha: "24741" },
    { name: "Miguel Lozano Quinto", ficha: "23237" },
    { name: "Brayan Miguel Alca Vasquez", ficha: "16355", rol: "ADMINISTRADOR" }
  ];
  const PROVINCIA = "Provincia de Lima";
  /* ====================================================== */

  let NIS_DB = JSON.parse(document.getElementById("nis-data").textContent);   // base de ejemplo hasta que llegue la del servidor
  // Lista de usuarios: la del servidor (hoja USUARIOS) si ya se descargó; si no, la de respaldo
  function listaUsuarios() {
    try { const u = JSON.parse(localStorage.getItem("ecrf_usuarios") || "null"); if (u && u.length) return u; } catch (e) {}
    return OPERARIOS_DEFECTO.map(o => ({ name: o.name, ficha: o.ficha, rol: o.rol || "OPERARIO" }));
  }
  const OPERARIOS = { find: f => listaUsuarios().find(f), filter: f => listaUsuarios().filter(f), map: f => listaUsuarios().map(f), some: f => listaUsuarios().some(f) };
  const app = document.getElementById("app");

  const state = {
    operario: (() => { const n = localStorage.getItem("gpfo_operario"); return n && OPERARIOS.some(o => o.name === n) ? n : null; })(),
    form: sessionStorage.getItem("ecrf_form") || null,
    pinBuffer: "",
    tab: "nuevo",
    nisQuery: "",
    nisSel: null, // {nis,direccion,urb,distrito,sector}
    presion: "",
    fecha: todayISO(),
    hora: nowHM(),
    fotos: [], // {blob, previewUrl}
    previewIdx: null,
    coords: null, // {lat,lon,alt}
    saving: false,
    registros: [],
    pendientes: [],     // ruta del día: NIS preparados para completar en campo
    pendienteId: null,  // pendiente que se está completando
    rutaQuery: "",
    rutaSel: null,
    rutaPara: null,
    editId: null,
    codigoSgio: "", fechaDeteccion: "", ubicacion: "", caudal: "", fechaVerif: todayISO(), horaVerif: nowHM(), situacion: "Reparada",
    m: { tecnico: "", cFecha: "", cUbi: "", cPres: "", cCaudal: "", sFecha: todayISO(), sHora: nowHM(), sUbi: "", sPres: "", sCaudal: "" },
    edFotos: [],
    edQuitadas: [],
    camDestino: "registro",
    quitarId: null,
    syncMode: "checking" // "cloud" | "local" | "checking"
  };

  let db = null, assets = null, downloads = null;

  function todayISO() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function nowHM() {
    const d = new Date();
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  function fmtFechaHoraLarga(fecha, hora) {
    const meses = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
    const [y, m, d] = fecha.split("-").map(Number);
    let [hh, mm] = hora.split(":").map(Number);
    const ampm = hh >= 12 ? "p.m." : "a.m.";
    let h12 = hh % 12; if (h12 === 0) h12 = 12;
    return `${d} ${meses[m - 1]} ${y} ${String(h12).padStart(2,"0")}:${String(mm).padStart(2,"0")} ${ampm}`;
  }

  /* ---------------- Configuración y base de suministros ---------------- */
  async function cargarSuministrosLocales() {
    try { const g = await IDB.kget("suministros"); if (g && g.rows && g.rows.length) NIS_DB = g.rows.map(r => ({ nis: r[0], direccion: r[1], urb: r[2], distrito: r[3], sector: r[4] })); } catch (e) {}
  }
  async function cargarConfigServidor() {
    if (!apiListo() || !enLinea()) return;
    try {
      const c = await apiGet({ action: "config" });
      if (c.usuarios && c.usuarios.length) localStorage.setItem("ecrf_usuarios", JSON.stringify(c.usuarios.map(u => ({ name: u.nombre, hash: u.hash, rol: u.rol }))));
      guardarTecnicos(c.tecnicos);
      if (Array.isArray(c.modulos) && c.modulos.length) {
        const antes = localStorage.getItem("ecrf_modulos"), ahora = JSON.stringify(c.modulos);
        localStorage.setItem("ecrf_modulos", ahora);
        if (antes !== ahora && state.operario && !state.form && !state.admin) render();   // el menú se actualiza solo
      }
      let local = null; try { local = await IDB.kget("suministros"); } catch (e) {}
      if (c.suministrosVersion && (!local || local.v !== c.suministrosVersion)) {
        const s = await apiGet({ action: "suministros" });
        await IDB.kput({ v: c.suministrosVersion, rows: s.rows }, "suministros");
        await cargarSuministrosLocales();
    await cargarCacheNis();
        toast("Base de suministros actualizada (" + s.rows.length.toLocaleString("es-PE") + " NIS)");
      }
      if (!state.operario) render();
    } catch (e) { /* sin conexión: se usa lo guardado */ }
  }

  /* ---------------- Capabilities ---------------- */
  async function initCapabilities() {
    if (apiListo()) { db = driveDb; assets = driveAssets; }
    state.syncMode = (db && assets) ? "cloud" : "local";
    await cargarSuministrosLocales();
    cargarConfigServidor();
    await migrarLegado();
    if (state.operario) await loadRegistros();
    render();
    sincronizar();
    window.addEventListener("online", async () => { await sincronizar(); await loadRegistros(); render(); });
    window.addEventListener("offline", pintarEstadoSync);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") sincronizar(); });
    setInterval(sincronizar, 60000);
  }

  /* ---------------- Almacenamiento en el celular (IndexedDB) ---------------- */
  const IDB = (() => {
    let p;
    const abrir = () => p || (p = new Promise(ok => {
      try {
        const r = indexedDB.open("gpfo0381", 3);
        r.onupgradeneeded = () => {
          const d = r.result;
          if (!d.objectStoreNames.contains("regs")) d.createObjectStore("regs", { keyPath: "id" });
          if (!d.objectStoreNames.contains("fotoOps")) d.createObjectStore("fotoOps", { keyPath: "id" });
          if (!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
        };
        r.onsuccess = () => ok(r.result); r.onerror = () => ok(null);
      } catch (e) { ok(null); }
    }));
    const rq = r => new Promise((ok, mal) => { r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error); });
    const st = async (m, n = "regs") => { const d = await abrir(); if (!d) throw new Error("almacenamiento no disponible"); return d.transaction(n, m).objectStore(n); };
    return {
      put: async v => rq((await st("readwrite")).put(v)),
      del: async k => rq((await st("readwrite")).delete(k)),
      all: async () => rq((await st("readonly")).getAll()),
      fput: async v => rq((await st("readwrite", "fotoOps")).put(v)),
      fdel: async k => rq((await st("readwrite", "fotoOps")).delete(k)),
      fall: async () => rq((await st("readonly", "fotoOps")).getAll()),
      kget: async k => rq((await st("readonly", "kv")).get(k)),
      kput: async (v, k) => rq((await st("readwrite", "kv")).put(v, k)),
    };
  })();
  const leerLS = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || "null") ?? d; } catch (e) { return d; } };
  const guardarLS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const nuevoId = pre => pre + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);

  // Registros antiguos guardados en localStorage (con fotos en texto) pasan a IndexedDB
  async function migrarLegado() {
    const viejos = leerLS("gpfo_registros", []);
    if (!viejos.length) return;
    try {
      for (const r of viejos) {
        const blobs = await Promise.all((r.fotosB64 || []).map(u => fetch(u).then(x => x.blob())));
        const { fotosB64, ...resto } = r;
        await IDB.put({ ...resto, id: r.id || nuevoId("r"), fotosBlobs: blobs, subido: false });
      }
      localStorage.removeItem("gpfo_registros");
    } catch (e) {}
  }

  /* ---------------- Sincronización con el servidor ---------------- */
  let sincronizando = false;
  const enLinea = () => navigator.onLine !== false;
  async function porSubir() {
    if (state.syncMode !== "cloud") return 0;
    try { return (await IDB.all()).length + (await IDB.fall()).length + leerLS("gpfo_edit_ops", []).length; } catch (e) { return 0; }
  }
  async function badgeHTML() {
    if (state.syncMode === "local") return `<span class="badge" style="background:#FFF1C7;color:#6B4A00">● Guardado en el celular</span>`;
    const n = await porSubir();
    if (!enLinea()) return `<span class="badge" style="background:#FFF1C7;color:#6B4A00">● Sin internet${n ? " · " + n + " por subir" : ""}</span>`;
    if (n) return `<span class="badge" style="background:#E1F3FB;color:#0B4A6B">● Subiendo ${n}…</span>`;
    return `<span class="badge" style="background:#DDF3E7;color:#12613B">● Todo subido</span>`;
  }
  async function pintarEstadoSync() {
    const el = document.getElementById("syncBadge");
    if (el) el.innerHTML = await badgeHTML();
  }
  async function flushPendOps() {
    const ops = leerLS("gpfo_pend_ops", []);
    while (ops.length) {
      const op = ops[0];
      if (op.op === "add") await db.collection("pendientes").doc(op.id).set(op.data);
      else { try { await db.collection("pendientes").doc(op.id).delete(); } catch (e) { if (!/not.?found/i.test(String(e && (e.code || e.message)))) throw e; } }
      ops.shift(); guardarLS("gpfo_pend_ops", ops);
    }
  }
  // Errores que no se arreglan reintentando (p. ej. alguien borró la fila en la hoja)
  const esImposible = e => /not_found|tipo|datos/.test(String(e && (e.code || e.message) || ""));
  function descartarOp(que, op, e) {
    const d = leerLS("gpfo_ops_descartadas", []); d.push({ que, op, error: String(e && (e.code || e.message)), cuando: Date.now() });
    guardarLS("gpfo_ops_descartadas", d.slice(-50));
    toast("Una " + que + " no se pudo subir: el registro ya no existe en la hoja", true);
  }
  async function sincronizar() {
    if (sincronizando || state.syncMode !== "cloud" || !enLinea()) { pintarEstadoSync(); return; }
    sincronizando = true; let subidos = 0;
    pintarEstadoSync();
    try {
      await flushPendOps();
      const edits = leerLS("gpfo_edit_ops", []);
      while (edits.length) {
        try {
          await db.collection("registros").doc(edits[0].id).update(edits[0].data);   // ediciones: mapa por fecha, reintentar no duplica
          subidos++;
        } catch (e) {
          if (!esImposible(e)) throw e;                     // sin internet: se reintenta luego
          descartarOp("edición", edits[0], e);              // el registro ya no existe en la hoja: se aparta y se sigue
        }
        edits.shift(); guardarLS("gpfo_edit_ops", edits);
      }
      const fops = (await IDB.fall()).sort((a, b) => a.creadoEn - b.creadoEn);
      for (const op of fops) {
        for (let i = op.subidas.length; i < op.nuevas.length; i++) {
          const up = await assets.upload(op.nuevas[i], { type: "image/jpeg", meta: { ...(op.meta || {}), n: i + 1 } });
          op.subidas.push(up.id); await IDB.fput(op);
        }
        try {
          await db.collection("registros").doc(op.regId).update({ fotos: op.mantener.concat(op.subidas), ediciones: { [op.ts]: op.nota } });
        } catch (e) { if (!esImposible(e)) throw e; descartarOp("fotos", { id: op.regId, fotos: op.subidas }, e); }
        for (const id of op.quitar) { try { await assets.delete(id); } catch (e) {} }
        await IDB.fdel(op.id); subidos++;
      }
      const locales = (await IDB.all()).sort((a, b) => (a.creadoEn || 0) - (b.creadoEn || 0));
      for (const r of locales) {
        const blobs = r.fotosBlobs || [];
        const ids = r.fotoIds || [];
        for (let i = ids.length; i < blobs.length; i++) {       // retoma desde la última foto subida
          const up = await assets.upload(blobs[i], { type: "image/jpeg", meta: { form: formDe(r), nis: r.nis, fecha: r.fecha, hora: r.hora, operario: r.operario, n: i + 1 } });
          ids.push(up.id); r.fotoIds = ids; await IDB.put(r);
        }
        const { fotosBlobs, fotoIds, subido, pendienteId, local, nFotos, ...datos } = r;
        await db.collection("registros").doc(r.id).set({ ...datos, fotos: ids });   // mismo id: nunca se duplica
        await IDB.del(r.id); subidos++;
      }
    } catch (e) { /* sin conexión o error: se reintenta solo */ }
    sincronizando = false;
    if (subidos) { toast("Subido al servidor (" + subidos + ")"); await loadRegistros(); if (state.tab !== "nuevo") render(); }
    pintarEstadoSync();
  }

  // Roles: OPERARIO < SUPERVISOR < ADMINISTRADOR (el administrador ve y puede todo lo del supervisor, y además el panel)
  function rolDe(nombre) {
    const u = listaUsuarios().find(o => o.name === nombre);
    const r = String(u ? u.rol : "").toUpperCase();
    if (/^ADMIN/.test(r)) return "ADMINISTRADOR";
    if (/^SUPERV/.test(r) || (!u && /supervisor/i.test(nombre || ""))) return "SUPERVISOR";
    return "OPERARIO";
  }
  const esAdmin = () => rolDe(state.operario) === "ADMINISTRADOR";
  // Ver y gestionar lo de otros (hechos, rutas, PDF, reportes): nadie. Cada usuario ve solo lo suyo, sea operario, supervisor o administrador.
  const esSupervisor = () => false;
  function misPendientes() {
    const hoy = aplicarOrden(state.pendientes);   // orden de "Ordenar por cercanía" si se usó; si no, por fecha de carga
    const delForm = hoy.filter(p => (!p.form || formDe(p) === (state.form || "GPFO0381")) && esDeHoy(p));   // sin formulario: va en los 3
    return esSupervisor() ? delForm : delForm.filter(p => p.para === state.operario);
  }
  // La ruta es del día: un NIS agregado el lunes vale todo el lunes y el martes ya no aparece (ni en el celular ni en el servidor)
  const diaDe = ts => { const d = new Date(Number(ts) || 0); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  const esDeHoy = p => diaDe(p && p.creadoEn) === todayISO();
  function purgarRutaVieja() {
    if (!Array.isArray(state.pendientes) || state.diaRuta === todayISO()) return;
    state.diaRuta = todayISO();
    const antes = state.pendientes.length;
    state.pendientes = state.pendientes.filter(esDeHoy);
    if (state.pendientes.length !== antes) guardarLS("gpfo_pendientes", state.pendientes);
    guardarLS("gpfo_pend_ops", leerLS("gpfo_pend_ops", []).filter(o => o.op !== "add" || esDeHoy(o.data)));   // lo de días pasados ya no se sube
  }
  async function loadPendientes() {
    let lista = leerLS("gpfo_pendientes", []);
    if (state.syncMode === "cloud" && enLinea()) {
      try {
        await flushPendOps();
        const snap = await db.collection("pendientes").limit(500).get();
        lista = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      } catch (e) { /* sin conexión: se usa la copia del celular */ }
    }
    for (const op of leerLS("gpfo_pend_ops", [])) {   // cambios hechos sin internet que aún no se suben
      if (op.op === "add" && !lista.some(p => p.id === op.id)) lista.push({ id: op.id, ...op.data });
      if (op.op === "del") lista = lista.filter(p => p.id !== op.id);
    }
    state.pendientes = lista.filter(esDeHoy); state.diaRuta = todayISO();
    guardarLS("gpfo_pendientes", state.pendientes);
    guardarLS("gpfo_pend_ops", leerLS("gpfo_pend_ops", []).filter(o => o.op !== "add" || esDeHoy(o.data)));
  }
  async function agregarPendiente(p) {
    const id = nuevoId("p");
    state.pendientes.push({ id, ...p });
    guardarLS("gpfo_pendientes", state.pendientes);
    if (state.syncMode === "cloud") {
      const ops = leerLS("gpfo_pend_ops", []); ops.push({ op: "add", id, data: p }); guardarLS("gpfo_pend_ops", ops);
      sincronizar();
    }
  }
  async function borrarPendiente(id) {
    state.pendientes = state.pendientes.filter(p => p.id !== id);
    guardarLS("gpfo_pendientes", state.pendientes);
    if (state.syncMode === "cloud") {
      let ops = leerLS("gpfo_pend_ops", []);
      if (ops.some(o => o.op === "add" && o.id === id)) ops = ops.filter(o => o.id !== id);   // nunca llegó a subir
      else ops.push({ op: "del", id });
      guardarLS("gpfo_pend_ops", ops);
      sincronizar();
    }
  }

  async function loadRegistros() {
    await loadPendientes();
    let locales = [];
    try { locales = await IDB.all(); } catch (e) {}
    const vistaLocal = locales.map(r => ({ ...r, nFotos: (r.fotosBlobs || []).length, local: true }))
                              .sort((a, b) => (b.creadoEn || 0) - (a.creadoEn || 0));
    if (state.syncMode !== "cloud") { state.registros = vistaLocal; return; }
    let nube = leerLS("gpfo_cache_registros", []);
    if (enLinea()) {
      try {
        const snap = await db.collection("registros").orderBy("creadoEn", "desc").limit(200).get();
        nube = snap.docs.map(d => ({ id: d.id, ...d.data(), nFotos: (d.data().fotos || []).length }));
        guardarLS("gpfo_cache_registros", nube);
      } catch (e) {}
    }
    const editsPend = leerLS("gpfo_edit_ops", []);
    if (editsPend.length) nube = nube.map(r => {
      const mis = editsPend.filter(e => e.id === r.id);
      if (!mis.length) return r;
      let x = { ...r, editPendiente: true };
      for (const e of mis) x = { ...x, ...e.data, ediciones: { ...(x.ediciones || {}), ...(e.data.ediciones || {}) } };
      return x;
    });
    let fopsPend = [];
    try { fopsPend = await IDB.fall(); } catch (e) {}
    if (fopsPend.length) nube = nube.map(r => {
      const op = fopsPend.find(o => o.regId === r.id);
      return op ? { ...r, fotoPendiente: true, editPendiente: true, nFotos: op.mantener.length + op.nuevas.length,
                    ediciones: { ...(r.ediciones || {}), [op.ts]: op.nota } } : r;
    });
    const idsLocales = new Set(vistaLocal.map(r => r.id));
    state.registros = [...vistaLocal, ...nube.filter(r => !idsLocales.has(r.id))];
  }

  /* ---------------- Login ---------------- */
  async function tryLogin(ficha, clave) {
    const btn = document.getElementById("loginEntrar"); if (btn) { btn.disabled = true; btn.textContent = "Ingresando…"; }
    const h = await sha256("ECRF:" + ficha + ":" + clave);
    // con los usuarios del servidor (hash de ficha + DNI); si aún no llegaron, la lista de respaldo (contraseña = ficha)
    let found = listaUsuarios().find(u => u.hash ? u.hash === h : (u.ficha === ficha && clave === ficha)), sesionLista = false;
    if (!found && apiListo() && enLinea()) {          // lista del celular desactualizada: lo confirma el servidor
      try { const r = await apiPost({ tipo: "sesion", ficha, clave });
        if (r.nombre) { found = { name: r.nombre }; sesionLista = true;
          try { localStorage.setItem("ecrf_sesion", JSON.stringify({ n: r.nombre, sesion: r.sesion, exp: r.exp })); } catch (e) {} } } catch (e) {}
    }
    if (found) {
      state.operario = found.name; state.loginError = ""; state.loginUsuario = null;
      localStorage.setItem("gpfo_operario", found.name);
      localStorage.setItem("ecrf_ficha", ficha);
      if (!sesionLista) {
        try { localStorage.removeItem("ecrf_sesion"); } catch (e) {}
        if (apiListo() && enLinea()) obtenerSesion(ficha, clave).catch(() => {});   // sesión firmada para el reporte diario
      }
      saludar(found.name);
      loadRegistros().then(render);
    } else {
      state.loginError = "Usuario o contraseña incorrectos";
      render();
    }
  }

  /* ---------------- Geolocation ---------------- */
  function ensureLocation() {
    if (state.coords || !navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      pos => {
        state.coords = {
          lat: pos.coords.latitude,
          lon: pos.coords.longitude,
          alt: (typeof pos.coords.altitude === "number") ? pos.coords.altitude : null,
          speed: (typeof pos.coords.speed === "number") ? pos.coords.speed : null
        };
      },
      () => { state.coords = { lat: null, lon: null, alt: null, speed: null }; },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  }

  function fmtCaptureStamp(d) {
    const meses = ["ene","feb","mar","abr","may","jun","jul","ago","sept","oct","nov","dic"];
    const ampm = d.getHours() >= 12 ? "p.m." : "a.m.";
    let h12 = d.getHours() % 12; if (h12 === 0) h12 = 12;
    const pad = n => String(n).padStart(2, "0");
    return `${d.getDate()} ${meses[d.getMonth()]} ${d.getFullYear()} ${h12}:${pad(d.getMinutes())}:${pad(d.getSeconds())} ${ampm}`;
  }

  // "SANTA ANITA" -> "Santa Anita" (deja en minúscula de, del, la, los...)
  function tituloWM(t) {
    if (/[a-záéíóúñ]/.test(String(t || "").replace(/\b(Mz|Lt)\b/g, ""))) return String(t).trim();   // ya está en forma legible
    const menores = new Set(["de","del","la","las","los","el","y"]);
    const prefijos = new Set(["urb","asoc","a.h","p.j","apv","coop","agru","c.h","ca","av","jr","ps","pr","al","gr","ml"]);
    const ws = String(t || "").toLowerCase().replace(/\s+/g, " ").trim().split(" ");
    return ws.map((w, i) => {
      if (/^([a-z]\.)+[a-z]?\.?$/.test(w)) return w.toUpperCase();          // P.J, A.H, C.H
      if (i > 0 && menores.has(w) && !prefijos.has(ws[i - 1])) return w;
      return w.charAt(0).toUpperCase() + w.slice(1);
    }).join(" ");
  }

  /* ---------------- Watermark ---------------- */
  // Fecha real de una foto de la galería: se lee del EXIF (DateTimeOriginal); si no tiene, la fecha del archivo
  async function fechaDeFoto(file) {
    try {
      const buf = new DataView(await file.slice(0, 256 * 1024).arrayBuffer());
      if (buf.getUint16(0) === 0xFFD8) {
        let p = 2;
        while (p + 4 < buf.byteLength) {
          const marca = buf.getUint16(p), largo = buf.getUint16(p + 2);
          if (marca === 0xFFE1 && buf.getUint32(p + 4) === 0x45786966) {   // "Exif"
            const t = p + 10, le = buf.getUint16(t) === 0x4949;
            const u16 = o => buf.getUint16(t + o, le), u32 = o => buf.getUint32(t + o, le);
            const leerTexto = (o, n) => { let s = ""; for (let i = 0; i < n - 1; i++) s += String.fromCharCode(buf.getUint8(t + o + i)); return s; };
            const buscar = (ifd, tags) => {
              const n = u16(ifd), r = {};
              for (let i = 0; i < n; i++) {
                const e = ifd + 2 + i * 12, tag = u16(e);
                if (tags.includes(tag)) r[tag] = tag === 0x8769 ? u32(e + 8) : leerTexto(u32(e + 8), u32(e + 4));
              }
              return r;
            };
            const ifd0 = buscar(u32(4), [0x0132, 0x8769]);
            const exif = ifd0[0x8769] ? buscar(ifd0[0x8769], [0x9003]) : {};
            const txt = exif[0x9003] || ifd0[0x0132];
            const m = /^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/.exec(txt || "");
            if (m) return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]);
            break;
          }
          if ((marca & 0xFF00) !== 0xFF00) break;
          p += 2 + largo;
        }
      }
    } catch (e) {}
    return file.lastModified ? new Date(file.lastModified) : new Date();
  }

  // info === false: sin datos de NIS (p. ej. la foto de EPPs); «extra»: líneas adicionales debajo de la fecha y hora
  function watermarkPhoto(file, info, fecha, real, extra) {
    const dato = info === false ? null : (info || state.nisSel);
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = async () => {
        try { await document.fonts.load('400 40px Roboto'); } catch (e) {}
        const MAXW = 1600;
        const scale = Math.min(1, MAXW / img.width);
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);

        const lines = [];
        const cuando = fecha || new Date();
        lines.push(fmtCaptureStamp(cuando));
        (extra || []).forEach(l => l && lines.push(l));
        if (dato) {
          if (String(dato.direccion || "").trim()) lines.push(tituloWM(dato.direccion));
          if (String(dato.urb || "").trim()) lines.push(tituloWM(dato.urb));
          if (String(dato.distrito || "").trim()) lines.push(tituloWM(dato.distrito));
        }
        lines.push(PROVINCIA);
        const c = state.coords || {};
        // la altitud es la del celular en este momento: solo se pone si la foto es de la última hora
        if (typeof c.alt === "number" && Math.abs(Date.now() - (real || cuando)) < 3600000) lines.push(`Altitud:${c.alt.toFixed(1)}msnm`);
        if (dato) lines.push(`NIS:${dato.nis}`);

        // Estilo como la cámara de referencia: abajo a la derecha, letra blanca con sombra, sin franja
        const fontSize = Math.max(14, Math.round(Math.min(w, h) * 0.042));
        const lineGap = Math.round(fontSize * 1.2);
        const marginX = Math.round(w * 0.025);
        const marginBottom = Math.round(h * 0.018);
        const x = w - marginX;

        ctx.font = `400 ${fontSize}px Roboto, "Segoe UI", Arial, sans-serif`;
        ctx.textAlign = "right";
        ctx.textBaseline = "alphabetic";
        ctx.lineJoin = "round";

        let y = h - marginBottom - (lines.length - 1) * lineGap;
        lines.forEach(line => {
          // contorno fino para que se lea sobre fondos claros
          ctx.save();
          ctx.lineWidth = Math.max(1.5, fontSize * 0.08);
          ctx.strokeStyle = "rgba(0,0,0,0.45)";
          ctx.strokeText(line, x, y);
          ctx.restore();
          // texto blanco con sombra suave
          ctx.save();
          ctx.shadowColor = "rgba(0,0,0,0.8)";
          ctx.shadowBlur = Math.max(2, fontSize * 0.22);
          ctx.shadowOffsetX = Math.max(1, Math.round(fontSize * 0.05));
          ctx.shadowOffsetY = Math.max(1, Math.round(fontSize * 0.05));
          ctx.fillStyle = "#ffffff";
          ctx.fillText(line, x, y);
          ctx.restore();
          y += lineGap;
        });

        canvas.toBlob(blob => {
          URL.revokeObjectURL(url);
          resolve(blob);
        }, "image/jpeg", 0.9);
      };
      img.onerror = reject;
      img.src = url;
    });
  }

  async function destinoFoto(fileOrBlob, fecha) {
    if (state.camDestino === "editar") return fotoEdicion(fileOrBlob, fecha);
    return procesarFoto(fileOrBlob, fecha);
  }
  // Fecha y hora de la marca de agua = las que el operario puso en el formulario:
  //   GPFO0381: fecha y hora de la toma · GPFO0405: fecha de verificación · GPFO0416: fecha SEDAPAL
  //   (cada uno con su hora). Si el campo está vacío, se usa la fecha/hora real de la foto.
  function fechaMarca(form, v, real) {
    const f = form === "GPFO0405" ? v.fechaVerificacion : form === "GPFO0416" ? v.fechaSedapal : v.fecha;
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(f || ""));
    if (!m) return real;
    let hh = real.getHours(), mm = real.getMinutes(), ss = real.getSeconds();
    const t = /^(\d{1,2}):(\d{2})/.exec(String(v.hora || ""));
    if (t) { hh = +t[1]; mm = +t[2]; }
    return new Date(+m[1], +m[2] - 1, +m[3], hh, mm, ss);
  }
  // Si cambian la fecha/hora después de tomar las fotos, las miniaturas se actualizan con la nueva marca
  let refrescando = null;
  function refrescarMarcas() {
    clearTimeout(refrescando);
    refrescando = setTimeout(async () => {
      for (const [i, f] of state.fotos.entries()) {
        if (!f.original) continue;
        const b = await watermarkPhoto(f.original, null, fechaMarca(state.form, valoresFormulario(), f.real), f.real);
        URL.revokeObjectURL(f.previewUrl); f.blob = b; f.previewUrl = URL.createObjectURL(b);
        const img = document.querySelector(`[data-view="${i}"] img`); if (img) img.src = f.previewUrl;
      }
    }, 300);
  }
  const valoresFormulario = () => ({ fecha: state.fecha, fechaVerificacion: state.fechaVerif, fechaSedapal: state.m && state.m.sFecha,
    hora: state.form === "GPFO0405" ? state.horaVerif : state.form === "GPFO0416" ? (state.m && state.m.sHora) : state.hora });

  async function procesarFoto(fileOrBlob, fecha) {
    if (state.fotos.length >= 5) { toast("Maximo 5 fotos", true); return; }
    ensureLocation();
    toast("Procesando foto...");
    try {
      const real = fecha || new Date();                      // cuándo se tomó de verdad
      const watermarked = await watermarkPhoto(fileOrBlob, null, fechaMarca(state.form, valoresFormulario(), real), real);
      const previewUrl = URL.createObjectURL(watermarked);
      state.fotos.push({ blob: watermarked, previewUrl, original: fileOrBlob, real });
      state.previewIdx = state.fotos.length - 1; // muestra de frente la foto con marca de agua
      render();
    } catch (e) {
      toast("No se pudo procesar la foto", true);
    }
  }

  // Respaldo: cámara nativa del celular (solo si la cámara dentro de la app no está disponible)
  async function handlePhotoCapture(fileInput) {
    const file = fileInput.files && fileInput.files[0];
    fileInput.value = "";
    if (file) await destinoFoto(file);
  }

  /* ---------------- Cámara dentro de la app ---------------- */
  let camStream = null, camaraNativa = false;
  function cerrarCamara() {
    if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
    const el = document.getElementById("camOverlay"); if (el) el.remove();
  }
  async function abrirCamara() {
    if (state.camDestino !== "editar" && state.fotos.length >= 5) { toast("Maximo 5 fotos", true); return; }
    ensureLocation();
    if (camaraNativa || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
      document.getElementById("inpFoto").click(); return;
    }
    const el = document.createElement("div");
    el.id = "camOverlay"; el.className = "cam-overlay";
    el.innerHTML = `
      <video id="camVideo" autoplay playsinline muted></video>
      <div class="cam-bar">
        <button class="cam-side" id="camCancel">Cancelar</button>
        <button class="cam-shutter" id="camShot" aria-label="Tomar foto" disabled></button>
        <span class="cam-side"></span>
      </div>`;
    document.body.appendChild(el);
    document.getElementById("camCancel").onclick = cerrarCamara;
    try {
      camStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false
      });
      const v = document.getElementById("camVideo");
      if (!v) { cerrarCamara(); return; }
      v.srcObject = camStream;
      await v.play().catch(() => {});
      const shot = document.getElementById("camShot");
      shot.disabled = false;
      shot.onclick = () => {
        if (!v.videoWidth) return;
        const c = document.createElement("canvas");
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
        c.toBlob(blob => { cerrarCamara(); if (blob) destinoFoto(blob); }, "image/jpeg", 0.95);
      };
    } catch (e) {
      // Sin permiso o sin cámara dentro de la app: se usa la cámara del celular
      camaraNativa = true;
      el.querySelector(".cam-bar").innerHTML = `
        <button class="cam-side" id="camCancel2">Cancelar</button>
        <button class="btn-primary" id="camNativa" style="flex:1;margin:0 12px">Abrir cámara del celular</button>`;
      document.getElementById("camCancel2").onclick = cerrarCamara;
      document.getElementById("camNativa").onclick = () => { cerrarCamara(); document.getElementById("inpFoto").click(); };
    }
  }

  function removeFoto(idx) {
    URL.revokeObjectURL(state.fotos[idx].previewUrl);
    state.fotos.splice(idx, 1);
    render();
  }

  /* ---------------- Guardar registro ---------------- */
  function validRecord() {
    const base = state.nisSel && String(state.nisSel.direccion || "").trim() && String(state.nisSel.distrito || "").trim() && state.fotos.length >= 1;
    if (state.form === "GPFO0416") {
      const m = state.m;
      return !!(base && state.codigoSgio && m.tecnico && m.cFecha && m.cUbi && m.cPres !== "" && m.cCaudal !== ""
                && m.sFecha && m.sUbi && m.sPres !== "" && m.sCaudal !== "");
    }
    if (state.form === "GPFO0405")
      return !!(base && state.codigoSgio && state.fechaDeteccion && state.ubicacion && state.caudal !== "" && state.fechaVerif && state.situacion);
    return !!(base && state.presion !== "" && state.fecha && state.hora);
  }

  async function guardarRegistro() {
    if (!validRecord() || state.saving) return;
    state.saving = true; render();

    const base = {
      operario: state.operario,
      nis: state.nisSel.nis,
      direccion: String(state.nisSel.direccion || "").trim(),
      urb: String(state.nisSel.urb || "").trim(),
      distrito: String(state.nisSel.distrito || "").trim(),
      sector: String(state.nisSel.sector || "").trim(),
      datosManual: !!state.nisSel.manual,
      ccss: state.nisSel.ccss || "", latNis: state.nisSel.latNis ?? null, lonNis: state.nisSel.lonNis ?? null,
      form: state.form,
      ...(state.form === "GPFO0416" ? (() => {
        const m = state.m, r = calcVariacion(m.cCaudal, m.sCaudal);
        return {
          codigoSgio: state.codigoSgio, tecnico: m.tecnico,
          fechaContratista: m.cFecha, ubicacionContratista: m.cUbi, presionContratista: Number(m.cPres), caudalContratista: Number(m.cCaudal),
          fechaSedapal: m.sFecha, ubicacionSedapal: m.sUbi, presionSedapal: Number(m.sPres), caudalSedapal: Number(m.sCaudal),
          variacion: r.variacion, errorPct: r.error, fecha: m.sFecha, hora: m.sHora || nowHM()
        };
      })() : state.form === "GPFO0405" ? {
        codigoSgio: state.codigoSgio, fechaDeteccion: state.fechaDeteccion, ubicacion: state.ubicacion,
        caudal: Number(state.caudal), fechaVerificacion: state.fechaVerif, situacion: state.situacion,
        fecha: state.fechaVerif, hora: state.horaVerif || nowHM()
      } : {
        presion: Number(state.presion), fecha: state.fecha, hora: state.hora
      }),
      lat: state.coords ? state.coords.lat : null,
      lon: state.coords ? state.coords.lon : null,
      creadoEn: Date.now()
    };

    try {
      // por si cambiaron la fecha u hora después de tomar las fotos: la marca de agua usa los valores finales
      for (const f of state.fotos) {
        if (!f.original) continue;
        f.blob = await watermarkPhoto(f.original, null, fechaMarca(state.form, valoresFormulario(), f.real), f.real);
      }
      const reg = { id: nuevoId("r"), ...base, fotosBlobs: state.fotos.map(f => f.blob), subido: false };
      await IDB.put(reg);                                   // queda guardado en el celular aunque no haya internet
      if (state.pendienteId) await borrarPendiente(state.pendienteId);
      toast(state.syncMode === "cloud" && !enLinea() ? "Guardado en el celular. Se subirá cuando haya internet" : "Registro guardado ✅");
      resetForm();
      await loadRegistros();
      sincronizar();
    } catch (e) {
      toast("Error al guardar: " + (e && (e.code || e.message) ? (e.code || e.message) : "intenta de nuevo"), true);
    }
    state.saving = false;
    render();
  }

  function blobToDataURL(blob) {
    return new Promise((resolve) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.readAsDataURL(blob);
    });
  }

  function resetForm() {
    state.fotos.forEach(f => URL.revokeObjectURL(f.previewUrl));
    state.fotos = [];
    state.nisSel = null;
    state.nisQuery = "";
    state.pendienteId = null;
    state.coords = null;   // el GPS se vuelve a tomar en el siguiente registro
    state.presion = "";
    state.fecha = todayISO();
    state.hora = nowHM();
    state.codigoSgio = ""; state.fechaDeteccion = ""; state.ubicacion = ""; state.caudal = "";
    state.fechaVerif = todayISO(); state.horaVerif = nowHM(); state.situacion = "Reparada"; state.horaFijadaPara = null;
    state.m = { tecnico: "", cFecha: "", cUbi: "", cPres: "", cCaudal: "", sFecha: todayISO(), sHora: nowHM(), sUbi: "", sPres: "", sCaudal: "" };
  }

  /* ---------------- Toast ---------------- */
  let toastTimer = null;

      el = document.createElement("div");

      el.className = "toast";

  /* ================= RENDER ================= */
  function render() {
    purgarRutaVieja();                                // si pasó la medianoche con la app abierta, la ruta de ayer se borra
    renderPantalla();
    if (typeof pintarLateral === "function") try { pintarLateral(); } catch (e) {}
  }
  function renderPantalla() {
    if (!state.operario) renderLogin();
    else if (state.gpsEstado !== "ok") return renderGps();
    else if (state.admin) return renderAdmin(), armarAtras();
    else if (state.rd) return renderReporteDiario(), armarAtras();
    else if (state.vista) return renderVistaGis(), armarAtras();
    else if (!state.form) renderMenu();
    else renderMain();
    renderPreviewOverlay();
    if (state.operario) armarAtras();
  }

  /* ---------------- Botón "atrás" de Android ----------------
     El historial del navegador lleva una entrada por cada nivel abierto (menú, formulario o módulo, y lo que esté encima:
     cámara, mapa, foto, edición…). Las entradas se agregan en el mismo momento en que el usuario toca algo: Chrome en
     Android se salta las entradas creadas sin un toque del usuario, y por eso antes el «atrás» a veces no regresaba.
     Atrás cierra lo de encima o vuelve al menú; en el menú, el primer «atrás» avisa y el segundo sale de la app. */
  let pilaAtras = 0, ignorarPop = false;
  function profundidad() {
    if (!state.operario || state.gpsEstado !== "ok") return 0;
    let d = 1;                                                           // reserva del menú (para el aviso de salir)
    if (state.form || state.vista || state.rd || state.admin) d++;
    if (state.editId || (state.rd && state.rdCierreId) || (state.previewIdx !== null && state.previewIdx !== undefined)) d++;
    ["visorFotos", "camOverlay", "mapaRuta", "panelPdf", "rdDetalle", "labDetalle", "admFicha"].forEach(id => { if (document.getElementById(id)) d++; });
    if (document.querySelector("#cfNo")) d++;
    return d;
  }
  function sincronizarAtras() {
    try {
      const d = profundidad();
      // solo se agregan entradas mientras dura el toque del usuario (si no, Chrome las marcaría para saltarlas)
      const toque = !navigator.userActivation || navigator.userActivation.isActive;
      if (pilaAtras < d) { if (toque) while (pilaAtras < d) history.pushState({ ecrf: ++pilaAtras }, ""); }
      else if (pilaAtras > d && d >= 1) { ignorarPop = true; history.go(d - pilaAtras); pilaAtras = d; }   // se cerró algo con la flecha de la app
    } catch (e) {}
  }
  function armarAtras() { sincronizarAtras(); }
  // cada toque del usuario puede abrir o cerrar un nivel: se revisa justo después (todavía cuenta como toque)
  document.addEventListener("click", () => setTimeout(sincronizarAtras, 0), true);
  new MutationObserver(() => { clearTimeout(window.__atrasT); window.__atrasT = setTimeout(sincronizarAtras, 30); }).observe(document.body, { childList: true });
  function volverAlMenu() { state.form = null; sessionStorage.removeItem("ecrf_form"); state.editId = null; state.previewIdx = null; render(); window.scrollTo(0, 0); }
  window.addEventListener("popstate", ev => {
    if (ignorarPop) { ignorarPop = false; return; }
    pilaAtras = (ev.state && ev.state.ecrf) || 0;
    if (!state.operario) return;                                        // en el ingreso, atrás sale normal
    const confirmar = document.querySelector("#cfNo");
    if (document.getElementById("visorFotos")) cerrarVisor();
    else if (confirmar) confirmar.click();                               // "foto nueva": atrás = no usarla
    else if (document.getElementById("camOverlay")) cerrarCamara();
    else if (document.getElementById("mapaRuta")) cerrarMapaRuta();
    else if (document.getElementById("panelPdf")) cerrarPanelPdf();
    else if (state.previewIdx !== null && state.previewIdx !== undefined) { state.previewIdx = null; render(); }
    else if (state.editId) { state.editId = null; renderLista(); }
    else if (document.getElementById("admFicha")) document.getElementById("admFicha").querySelector("#admFichaNo").click();
    else if (state.admin) salirAdmin();
    else if (document.getElementById("rdDetalle")) document.getElementById("rdDetalle").remove();
    else if (state.rd && state.rdCierreId) { state.rdCierreId = null; state.rdCierreRep = null; renderRdHoy(); }
    else if (state.rd) salirReporteDiario();
    else if (document.getElementById("labDetalle")) document.getElementById("labDetalle").remove();
    else if (state.vista) salirVistaGis();
    else if (state.form) volverAlMenu();
    else { toast("Presiona atrás otra vez para salir"); return; }       // ya está en el menú: el siguiente «atrás» sale
  });

  // Ingreso: usuario = ficha, contraseña = DNI (mientras el DNI no esté en la hoja USUARIOS, la contraseña es la ficha)

  const MANO_SVG = '<svg viewBox="0 0 120 124" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Manómetro"> <rect x="50" y="98" width="20" height="14" rx="3" fill="#0B5FA5" stroke="#03204C" stroke-width="3"/> <path d="M44 112h32l-4 9H48z" fill="#03204C"/> <circle cx="60" cy="58" r="47" fill="#03204C"/> <circle cx="60" cy="58" r="41" fill="#E6F4FB" stroke="#33B1E4" stroke-width="4"/> <path d="M31 78 A34 34 0 1 1 89 78" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/> <path d="M31 78 A34 34 0 0 1 36 36" fill="none" stroke="#33B1E4" stroke-width="7" stroke-linecap="round"/> <path d="M84 36 A34 34 0 0 1 89 78" fill="none" stroke="#F2A900" stroke-width="7" stroke-linecap="round"/> <g stroke="#03204C" stroke-width="3" stroke-linecap="round"> <path d="M60 27v6"/><path d="M38 36l4 4"/><path d="M82 36l-4 4"/><path d="M30 58h6"/><path d="M90 58h-6"/> </g> <path class="aguja" d="M60 58L80 36" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/> <circle cx="60" cy="58" r="7" fill="#03204C"/><circle cx="58" cy="56" r="2" fill="#fff"/> <ellipse cx="47" cy="74" rx="4" ry="5" fill="#03204C"/><ellipse cx="73" cy="74" rx="4" ry="5" fill="#03204C"/> <circle cx="48.3" cy="72.3" r="1.5" fill="#fff"/><circle cx="74.3" cy="72.3" r="1.5" fill="#fff"/> <path d="M52 83q8 7 16 0" fill="none" stroke="#03204C" stroke-width="3" stroke-linecap="round"/> <circle cx="39" cy="82" r="4" fill="#F7A8B8" opacity=".8"/><circle cx="81" cy="82" r="4" fill="#F7A8B8" opacity=".8"/> <path d="M33 40a33 33 0 0 1 16-14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/> <path d="M101 8c0 0-9 10-9 16a9 9 0 0 0 18 0c0-6-9-16-9-16z" fill="#33B1E4" stroke="#03204C" stroke-width="3" stroke-linejoin="round"/> <ellipse cx="98" cy="22" rx="2.2" ry="3.4" fill="#fff"/> </svg>';
  function mano(px, anim) { return `<span class="mano ${anim ? "mano-anim" : ""}" style="width:${px}px;height:${Math.round(px*124/120)}px">${MANO_SVG.replace("<svg ", `<svg width="${px}" height="${Math.round(px*124/120)}" `)}</span>`; }

  function escA(v) { return String(v ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  /* ---------- Búsqueda de NIS en la base de SEDAPAL (servidor) ---------- */
  const NIS_REMOTO = {};        // NIS ya consultados (se guardan en el celular para usar sin internet)
  const BUSCANDO = {};
  // Direcciones de la base (MAYÚSCULAS, "MAGNOLIAS, LAS") -> forma legible ("Av. Las Magnolias")
  // Si el texto ya viene escrito a mano (con minúsculas), se deja tal cual.
  const PREF_DIR = { JR: "Jr.", CA: "Ca.", AV: "Av.", PS: "Psje.", BL: "Blq.", ML: "Malecón", PR: "Prol.", PQ: "Parque", AL: "Alameda", VE: "Vía Expresa", AC: "Acceso" };
  const PREF_URB = { URB: "Urb.", CERCADO: "Cercado", COOP: "Coop.", ASOC: "Asoc.", "A.H": "A.H.", "U.V": "U.V.", "P.J": "P.J.", APV: "APV", "U.IND": "Urb. Ind.", "C.R": "C.R.", "C.H": "C.H." };
  const TITULOS = { GRAL: "Gral.", ALMTE: "Almte.", CMDTE: "Cmdte.", CRNL: "Crnl.", MCAL: "Mcal.", PDTE: "Pdte.", CAP: "Cap.", TTE: "Tte.", DR: "Dr.", ING: "Ing.", STA: "Sta.", STO: "Sto.", SGTO: "Sgto.", MONS: "Mons.", PROF: "Prof." };
  const MENORES = new Set(["de", "del", "la", "las", "los", "el", "y", "e"]);
  function palabrasLegibles(txt) {
    return txt.split(/\s+/).filter(Boolean).map((w, i) => {
      if (w.startsWith("(")) return "(" + palabrasLegibles(w.slice(1));            // "(CERCADO)" -> "(Cercado)"
      if (TITULOS[w]) return TITULOS[w];
      if (/^(I|II|III|IV|V|VI|VII|VIII|IX|X)$/.test(w) && i > 0) return w;      // etapas en romanos
      if (/^\d/.test(w)) return w.toLowerCase();                                 // 1RA -> 1ra
      if (/^[A-ZÑ]$/.test(w)) return w;                                          // letras sueltas (Mz A)
      const l = w.toLowerCase();
      if (i > 0 && MENORES.has(l)) return l;
      return l.charAt(0).toUpperCase() + l.slice(1);
    }).join(" ");
  }
  function legibleBase(t, tipo) {
    const s = String(t || "").trim();
    if (!s || /[a-záéíóúñ]/.test(s.replace(/\b(Mz|Lt)\b/g, ""))) return s;      // ya está escrito a mano
    let tok = s.split(/\s+/);
    const pref = (tipo === "urb" ? PREF_URB : PREF_DIR)[tok[0]];
    if (pref) tok = tok.slice(1);
    let nombre = tok, cola = [];
    if (tipo !== "urb") {
      const i = tok.findIndex(w => /^\d/.test(w) || /^(MZ|Mz|LT|Lt|S\/N)$/.test(w));
      if (i >= 0) { nombre = tok.slice(0, i); cola = tok.slice(i).map(w => w === "MZ" ? "Mz" : w === "LT" ? "Lt" : w); }
    }
    let n = nombre.join(" ");
    const coma = n.indexOf(",");
    if (coma >= 0) n = (n.slice(coma + 1).trim() + " " + n.slice(0, coma).trim()).trim();   // "MAGNOLIAS, LAS" -> "LAS MAGNOLIAS"
    if (tipo === "dist") return palabrasLegibles(n);
    return [pref, palabrasLegibles(n), cola.join(" ")].filter(Boolean).join(" ");
  }
  const desdeServidor = (nis, d) => ({ nis, direccion: legibleBase(d.dir, "dir"), urb: legibleBase(d.urb, "urb"), distrito: legibleBase(d.dist, "dist"), sector: d.sec || "",
                                        ccss: d.ccss || "", latNis: d.lat === "" ? null : d.lat, lonNis: d.lon === "" ? null : d.lon });
  async function cargarCacheNis() {
    try {
      const c = await IDB.kget("nisCache");
      if (c) for (const [k, v] of Object.entries(c))   // lo guardado antes de esta versión pasa a la forma legible
        NIS_REMOTO[k] = v ? { ...v, direccion: legibleBase(v.direccion, "dir"), urb: legibleBase(v.urb, "urb"), distrito: legibleBase(v.distrito, "dist") } : v;
    } catch (e) {}
  }
  async function guardarCacheNis() {
    try {
      const claves = Object.keys(NIS_REMOTO);
      if (claves.length > 5000) claves.slice(0, claves.length - 5000).forEach(k => delete NIS_REMOTO[k]);
      await IDB.kput(NIS_REMOTO, "nisCache");
    } catch (e) {}
  }
  function nisLocal(nis) {
    if (NIS_REMOTO[nis]) return NIS_REMOTO[nis];
    return NIS_DB.find(r => r.nis === nis) || null;
  }
  // Precarga: al escribir los 3 primeros dígitos, el servidor abre ese grupo de la base mientras el operario termina de escribir
  const PRECARGADOS = {};
  function precargarNis(q) {
    const p = String(q || "").slice(0, 3);
    if (p.length < 3 || q.length >= 7 || PRECARGADOS[p] || !apiListo() || !enLinea()) return;
    PRECARGADOS[p] = Date.now();
    apiGet({ action: "nis_pre", p }).catch(() => { delete PRECARGADOS[p]; });
  }
  async function buscarNisServidor(nis) {
    if (!apiListo() || !enLinea() || BUSCANDO[nis] || NIS_REMOTO[nis] !== undefined) return;
    BUSCANDO[nis] = true;
    try {
      const r = await apiGet({ action: "nis", nis });
      NIS_REMOTO[nis] = r.dato ? desdeServidor(nis, r.dato) : null;   // null = no existe en la base
      guardarCacheNis();
    } catch (e) { /* sin conexión: se podrá completar a mano */ }
    delete BUSCANDO[nis];
  }
  const estadoBusqueda = q => q.length < 7 ? "" : BUSCANDO[q] ? "buscando" : NIS_REMOTO[q] === null ? "noexiste"
                         : nisLocal(q) ? "ok" : (apiListo() && enLinea() ? "pendiente" : "sinred");
  function seleccionarNis(r) {
    state.nisSel = { nis: r.nis, direccion: r.direccion || "", urb: r.urb || "", distrito: r.distrito || "", sector: r.sector || "",
                     ccss: r.ccss || "", latNis: r.latNis ?? null, lonNis: r.lonNis ?? null, manual: false };
    ensureLocation(); renderNuevo();
  }
  function urlMapa(lat, lon) { return "https://www.google.com/maps/search/?api=1&query=" + lat + "," + lon; }
  function botonMapa(o, id) {
    return o && o.latNis != null && o.lonNis != null
      ? `<a id="${id}" href="${urlMapa(o.latNis, o.lonNis)}" target="_blank" rel="noopener" class="btn-ghost btn-mapa" style="text-decoration:none">📍 Ver en mapa</a>`
      : "";
  }

  function matchNis(q) {
    if (!q || q.length < 2) return [];
    const lista = NIS_DB.filter(r => r.nis.startsWith(q)).slice(0, 6);
    if (q.length === 7 && NIS_REMOTO[q] && !lista.some(r => r.nis === q)) lista.unshift(NIS_REMOTO[q]);
    return lista;
  }

  function renderMain() {
    const syncBadge = `<span id="syncBadge"></span>`;

    app.innerHTML = `
      <div class="px-4 pt-3 pb-3 flex items-center gap-3" style="background:var(--brand-dark);color:#fff">
        <button id="btnInicio" class="text-white font-bold text-xl leading-none px-1" aria-label="Volver al inicio">‹</button>
        ${FORM_INFO[state.form].icono(46)}
        <div class="flex-1 min-w-0">
          <div class="font-extrabold leading-tight">${FORM_INFO[state.form].titulo}</div>
          <div class="text-xs" style="color:#C9D8EA">${escA(state.operario)} · ${state.form}</div>
        </div>
        <span class="logo-chip"><img src="${LOGO_SEDAPAL}" alt="SEDAPAL"></span>
      </div>
      <div class="px-4 py-2 flex items-center justify-between" style="background:var(--card);border-bottom:1px solid var(--line)">
        ${syncBadge}
        <button id="btnSalir" class="text-sm font-semibold" style="color:var(--danger)">Salir</button>
      </div>
      <div class="flex border-b px-4" style="border-color:var(--line);background:var(--card)">
        <div class="tab-btn ${state.tab === "nuevo" ? "active" : ""}" data-tab="nuevo">Registro</div>
        <div class="tab-btn ${state.tab === "ruta" ? "active" : ""}" data-tab="ruta">Ruta (${misPendientes().length})</div>
        <div class="tab-btn ${state.tab === "lista" ? "active" : ""}" data-tab="lista">Hechos (${regsDelForm().length})</div>
      </div>
      <div class="flex-1 px-4 py-4 pb-24" id="tabContent"></div>
    `;
    document.getElementById("btnInicio").onclick = volverAlMenu;
    document.getElementById("btnSalir").onclick = () => {
      localStorage.removeItem("gpfo_operario"); localStorage.removeItem("ecrf_sesion"); sessionStorage.removeItem("ecrf_form"); state.form = null;
      state.operario = null; state.pinBuffer = "";
      render();
    };
    document.querySelectorAll(".tab-btn").forEach(t => t.onclick = () => { state.tab = t.dataset.tab; render(); });
    pintarEstadoSync();

    if (state.tab === "nuevo") renderNuevo();
    else if (state.tab === "ruta") renderRuta();

  function grupoUbicacion(sel, idBase) {
    if (UBICACIONES_REDES.includes(sel)) return "redes";
    if (UBICACIONES_CONEX.includes(sel)) return "conex";

  function chipsUbicacion(sel, idBase) {
    const g = grupoUbicacion(sel, idBase), lista = g === "redes" ? UBICACIONES_REDES : g === "conex" ? UBICACIONES_CONEX : [];
    const antiguo = sel && !UBICACIONES_REDES.includes(sel) && !UBICACIONES_CONEX.includes(sel);   // valor de un registro anterior
    return `<div class="ubi-sel">
      <div class="ubi-tipo" role="group" aria-label="Tipo de fuga">${[["redes", "Redes"], ["conex", "Conexiones"]].map(([k, t]) => `

      <select class="input ubiLista" id="${idBase}Sel" data-base="${idBase}" ${g ? "" : "disabled"} aria-label="Ubicación de la fuga">
        <option value="">${g ? "Elige la ubicación…" : "Primero elige Redes o Conexiones"}</option>
        ${antiguo ? `<option value="${escA(sel)}" selected>${escA(sel)} (registro anterior)</option>` : ""}
        ${lista.map(u => `<option ${u === sel ? "selected" : ""}>${escA(u)}</option>`).join("")}

  }

      state.ubiGrupo = state.ubiGrupo || {}; state.ubiGrupo[idBase] = b.dataset.g;
      const lista = b.dataset.g === "redes" ? UBICACIONES_REDES : UBICACIONES_CONEX;
      if (!lista.includes(leer())) poner("");
      repintar();
      const s = document.getElementById(idBase + "Sel"); if (s) s.focus();
    });
    const s = document.getElementById(idBase + "Sel");
    if (s) s.onchange = () => { poner(s.value); repintar(); };

          toast("Cambios guardados" + (state.syncMode === "cloud" && !enLinea() ? ". Se subirán cuando haya internet" : ""));

        } catch (e) { toast("No se pudo guardar: " + (e && (e.code || e.message) || "intenta de nuevo"), true); }
      };
    }
  }

  function confirmarFoto(url) {
    return new Promise(ok => {
      const el = document.createElement("div");
      el.className = "preview-overlay";
      el.innerHTML = `
        <div class="flex items-center justify-between px-4 py-3" style="padding-top:calc(12px + env(safe-area-inset-top,0px))">
          <div class="text-white text-sm font-semibold">Foto nueva</div>
        </div>
        <img src="${url}" alt="Foto nueva">
        <div class="flex gap-3 px-4 py-4" style="padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))">
          <button id="cfNo" class="btn-primary flex-1" style="background:var(--danger)">Eliminar foto</button>
          <button id="cfSi" class="btn-primary flex-1">Se ve bien</button>
        </div>`;
      document.body.appendChild(el);
      el.querySelector("#cfSi").onclick = () => { el.remove(); ok(true); };
      el.querySelector("#cfNo").onclick = () => { el.remove(); ok(false); };
    });
  }
  async function fotoEdicion(fileOrBlob, fecha) {
    const r = state.registros.find(x => x.id === state.editId); if (!r) return;
    const v = id => (document.getElementById(id) || {}).value || "";
    ensureLocation();
    toast("Procesando foto...");
    try {
      const real = fecha || new Date();
      const marca = fechaMarca(formDe(r), { fecha: v("ed_fecha") || r.fecha, hora: v("ed_hora") || r.hora,
        fechaVerificacion: v("ed_fver") || r.fechaVerificacion, fechaSedapal: v("ed_sfecha") || r.fechaSedapal }, real);
      const blob = await watermarkPhoto(fileOrBlob, { nis: r.nis, direccion: v("ed_direccion"), urb: v("ed_urb"), distrito: v("ed_distrito") }, marca, real);
      const url = URL.createObjectURL(blob);
      if (await confirmarFoto(url)) { state.edFotos.push({ tipo: "nueva", blob, url }); pintarFotosEdicion(); }
      else URL.revokeObjectURL(url);
    } catch (e) { toast("No se pudo procesar la foto", true); }
  }
  function pintarFotosEdicion() {
    const g = document.getElementById("edFotos"); if (!g) return;
    g.innerHTML = state.edFotos.map((f, i) => `
      <div class="photo-slot">
        <img src="${f.url}" alt="Foto ${i + 1}" class="edVer" data-i="${i}" style="cursor:pointer" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'Sin conexión',style:'font-size:11px;color:#4A5A6E'}))">
        ${f.tipo === "nueva" ? `<span class="absolute bottom-1 left-1 badge" style="background:#E1F3FB;color:#0B4A6B;font-size:10px;padding:2px 6px">nueva</span>` : ""}
        <button data-edq="${i}" class="absolute top-1 right-1 rounded-full text-white text-xs font-bold" style="background:rgba(0,0,0,.65);width:26px;height:26px" aria-label="Quitar foto ${i + 1}">✕</button>
      </div>`).join("") + `
      <button id="edFotoMas" class="photo-slot" aria-label="Agregar foto"><span style="font-size:28px;color:var(--ink-soft)">+</span></button>`;
    g.querySelectorAll(".edVer").forEach(im => im.onclick = () =>
      abrirVisor(state.edFotos.map(f => ({ mini: f.url, grande: f.tipo === "asset" ? fotoUrlGrande(f.id) : f.url })), Number(im.dataset.i)));
    g.querySelectorAll("[data-edq]").forEach(b => b.onclick = () => {
      const f = state.edFotos[+b.dataset.edq];
      if (f.tipo === "nueva") URL.revokeObjectURL(f.url);
      else state.edQuitadas.push(f);
      state.edFotos.splice(+b.dataset.edq, 1); pintarFotosEdicion();
    });
    document.getElementById("edFotoMas").onclick = () => { state.camDestino = "editar"; abrirCamara(); };
    const edGal = document.getElementById("edGaleria"); if (edGal) edGal.onclick = () => abrirGaleria("editar");
  }
