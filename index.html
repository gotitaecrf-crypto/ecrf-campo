  async function guardarFotosEdicion(r) {
    const ts = String(Date.now() + 1);
    const antes = r.local ? (r.fotosBlobs || []).length : (r.fotos || []).length;
    const agregadas = state.edFotos.filter(f => f.tipo === "nueva").length;
    const nota = { cuando: Number(ts), por: state.operario,
                   cambios: { fotos: { antes, despues: state.edFotos.length, quitadas: state.edQuitadas.length, agregadas } } };
    if (r.local) {
      const x = (await IDB.all()).find(y => y.id === r.id);
      if (!x) throw new Error("registro no encontrado");
      x.fotosBlobs = state.edFotos.map(f => f.blob);
      delete x.fotoIds;                                      // se vuelven a subir todas con el orden nuevo
      x.ediciones = { ...(x.ediciones || {}), [ts]: nota };
      await IDB.put(x);
      return;
    }
    await IDB.fput({
      meta: { form: formDe(r), nis: r.nis, fecha: todayISO(), hora: nowHM(), operario: state.operario },
      id: nuevoId("f"), regId: r.id, creadoEn: Date.now(), nota, ts,
      mantener: state.edFotos.filter(f => f.tipo === "asset").map(f => f.id),
      nuevas: state.edFotos.filter(f => f.tipo === "nueva").map(f => f.blob),
      quitar: state.edQuitadas.map(f => f.id), subidas: []
    });
    sincronizar();
  }

  // Guarda la corrección: en el celular si aún no se subió; si ya se subió, se envía al servidor (o queda en cola sin internet)
  async function guardarEdicion(r, cambios, detalle) {
    const ts = String(Date.now());
    const nota = { cuando: Number(ts), por: state.operario, cambios: detalle };
    if (r.local) {
      const x = (await IDB.all()).find(y => y.id === r.id);
      if (!x) throw new Error("registro no encontrado");
      Object.assign(x, cambios);
      x.ediciones = { ...(x.ediciones || {}), [ts]: nota };
      await IDB.put(x);
      return;
    }
    const ops = leerLS("gpfo_edit_ops", []);
    ops.push({ id: r.id, data: { ...cambios, ediciones: { [ts]: nota } } });
    guardarLS("gpfo_edit_ops", ops);
    const cache = leerLS("gpfo_cache_registros", []).map(x => x.id === r.id
      ? { ...x, ...cambios, ediciones: { ...(x.ediciones || {}), [ts]: nota }, editPendiente: true } : x);
    guardarLS("gpfo_cache_registros", cache);
    sincronizar();
  }

  function abrirGaleria(destino) {
    state.camDestino = destino;
    if (destino !== "editar" && state.fotos.length >= 5) { toast("Maximo 5 fotos", true); return; }
    ensureLocation();
    let g = document.getElementById("inpGaleria");
    if (!g) {
      g = document.createElement("input");
      g.type = "file"; g.accept = "image/*"; g.multiple = true; g.id = "inpGaleria"; g.style.display = "none";
      document.body.appendChild(g);
    }
    g.onchange = async () => {
      let archivos = [...(g.files || [])].filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|heic|webp)$/i.test(f.name));
      g.value = "";
      if (state.camDestino !== "editar") {
        const libres = 5 - state.fotos.length;
        if (archivos.length > libres) toast(`Solo se agregan ${libres} foto(s): máximo 5 por registro`, true);
        archivos = archivos.slice(0, libres);
      }
      for (const f of archivos) await destinoFoto(f, await fechaDeFoto(f));
    };
    g.click();
  }

        </div></div>`;
      document.body.appendChild(el);
      const us = el.querySelector("#admUsuarioIn"), inp = el.querySelector("#admFichaIn");
      (us || inp).focus();
      if (us) us.oninput = () => soloDigitos(us, LARGO_FICHA);
      inp.oninput = () => soloDigitos(inp, 12);

        const ficha = us ? us.value : fichaSabida;

  async function asegurarSesion() {
    const s = sesionGuardada(); if (s) return s;
    if (!apiListo() || !enLinea()) throw { code: "sin_internet", message: "Necesitas internet para el reporte diario" };
    const f = await pedirClave("Confirma tu contraseña", "Confirmamos tu identidad una sola vez en este equipo.", "Continuar");
    if (!f) throw { code: "cancelado", message: "" };
    try { return await obtenerSesion(f.ficha, f.clave); }

        .rd-foto-add span{font-size:12px;font-weight:700}

        .rd-bloq.off .rd-candado{display:flex;align-items:center;gap:8px;background:#FFF1C7;color:#6B4A00;border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;margin-bottom:10px}
        .rd-pct{font-size:44px;font-weight:900;line-height:1;color:var(--brand-dark)}
      </style>
      <div class="rd-top"><div class="rd-wrap px-4 pt-3 pb-3 flex items-center gap-3">
        <button id="rdVolver" class="text-white font-bold text-xl leading-none px-1" aria-label="Volver al inicio">‹</button>
        <span class="form-ico" style="display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);color:#fff;width:46px;height:46px">${ICO_RD}</span>
        <div class="flex-1 min-w-0"><div class="font-extrabold leading-tight">Reporte diario de actividades</div>
          <div class="text-xs" style="color:#C9D8EA">${escA(state.operario)}</div></div>
        <span class="logo-chip"><img src="${LOGO_SEDAPAL}" alt="SEDAPAL"></span>
      </div></div>
      <div style="background:var(--card);border-bottom:1px solid var(--line)"><div class="rd-wrap flex px-4">
        <div class="tab-btn ${state.rdTab === "hoy" ? "active" : ""}" data-rdtab="hoy">Hoy</div>
        <div class="tab-btn ${state.rdTab === "hechos" ? "active" : ""}" data-rdtab="hechos">Hechos</div>
      </div></div>
      <div class="rd-wrap px-4 py-4 pb-24" id="rdContent"></div>`;
    document.getElementById("rdVolver").onclick = salirReporteDiario;
    document.querySelectorAll("[data-rdtab]").forEach(t => t.onclick = () => { if (state.rdTab !== t.dataset.rdtab) { detenerVideo(); state.rdTab = t.dataset.rdtab; render(); } });
    if (state.rdTab === "hechos") renderRdHechos(); else renderRdHoy();
  }

  async function cargarRdHoy() {
    const c = document.getElementById("rdContent");
    if (c) c.innerHTML = `<div class="text-center text-sm py-10" style="color:var(--ink-soft)">Cargando tu reporte…</div>`;
    try {
      const d = await rdApi("rd_hoy");
      state.rdDatos = d;
      try { localStorage.setItem("rd_cache_" + state.operario, JSON.stringify(d)); } catch (e) {}
    } catch (e) {
      if (e && e.code === "cancelado") { salirReporteDiario(); return; }
      const cache = leerBorr("rd_cache_" + state.operario);
      if (c) c.innerHTML = `<div class="card p-4 text-sm" style="background:#FFF1C7;color:#6B4A00"><b>${escA(msgError(e))}.</b><br>
        El reporte diario se guarda en el servidor, así que necesitas señal para registrarlo o cerrarlo.
        ${cache ? `Lo último que se descargó es del ${fechaTxt(cache.fecha)}.` : ""}</div>
        <button id="rdReintentar" class="btn-primary w-full mt-3">Reintentar</button>`;
      const b = document.getElementById("rdReintentar"); if (b) b.onclick = () => cargarRdHoy();
      return;
    }
    if (state.rd && state.rdTab === "hoy") renderRdHoy();
  }

  function renderRdHoy() {
    const c = document.getElementById("rdContent"); if (!c) return;
    const d = state.rdDatos;
    if (!d) { cargarRdHoy(); return; }
    const cierre = state.rdCierreId ? (state.rdCierreRep || null) : null;
    const rep = cierre || d.reporte;
    const estado = rep ? rep.estado : "";
    c.innerHTML = `
      ${!cierre && d.pendientesAnteriores && d.pendientesAnteriores.length ? `
        <div class="card p-3 mb-3" style="background:#FFF1C7;border-color:#F2D27A">
          <div class="text-sm font-bold mb-2" style="color:#6B4A00">Tienes reportes de días anteriores sin cerrar</div>
          ${d.pendientesAnteriores.map(p => `<button class="btn-ghost w-full mb-2 rdCerrarAnt" data-id="${escA(p.id)}">Cerrar el reporte del ${fechaTxt(p.fecha)}</button>`).join("")}
        </div>` : ""}
      ${cierre ? `<button id="rdVolverHoy" class="text-sm font-semibold mb-3" style="color:var(--brand)">‹ Volver al reporte de hoy</button>` : ""}
      <div class="card p-4 mb-4">
        <div class="flex items-center justify-between gap-2 mb-3">
          <div class="font-bold text-lg">${cierre ? "Reporte del " + fechaTxt(rep.fecha) : "Mi reporte de hoy"}</div>${badgeRd(estado)}
        </div>
        <div class="grid grid-cols-2 gap-2 text-sm">
          <div class="rd-dato" style="grid-column:span 2"><small>Trabajador</small><b>${escA(d.trabajador)}</b></div>
          <div class="rd-dato"><small>Fecha de la jornada</small><b>${fechaTxt(rep ? rep.fecha : d.fecha)}</b></div>
          <div class="rd-dato"><small>Hora de inicio</small><b>${rep && rep.inicioEn ? horaDe(rep.inicioEn) : "—"}</b></div>
          ${rep && rep.mananaEn ? `<div class="rd-dato"><small>Registro de la mañana</small><b>${horaDe(rep.mananaEn)}</b></div>` : ""}
          ${rep && rep.salida ? `<div class="rd-dato"><small>Salida a campo</small><b>${horaDe(rep.salida.en)}</b></div>` : ""}
          ${rep && rep.retorno ? `<div class="rd-dato"><small>Retorno a la oficina</small><b>${horaDe(rep.retorno.en)}</b></div>` : ""}
          ${rep && rep.cerradoEn ? `<div class="rd-dato"><small>Cierre</small><b>${horaDe(rep.cerradoEn)}</b></div>` : ""}
        </div>
      </div>
      <div id="rdEtapa"></div>`;
    c.querySelectorAll(".rdCerrarAnt").forEach(b => b.onclick = async () => {
      try { const r = await rdApi("rd_detalle", { id: b.dataset.id }); state.rdCierreId = b.dataset.id; state.rdCierreRep = r.reporte; renderRdHoy(); window.scrollTo(0, 0); }
      catch (e) { toast(msgError(e), true); }
    });
    const vh = document.getElementById("rdVolverHoy"); if (vh) vh.onclick = () => { state.rdCierreId = null; state.rdCierreRep = null; renderRdHoy(); };
    if (!rep || estado === "PENDIENTE_REGISTRO") renderRdManana(rep);
    else if (estado === "PENDIENTE_CIERRE") renderRdCierre(rep);
    else if (estado === "PENDIENTE_RETORNO") renderRdRetorno(rep);
    else renderRdCerrado(rep);
  }

  // ---------- ETAPA 1: mañana ----------
  // Actividades del reporte: ítem 2 «Contratista» e ítem 3 «ECRF» (los borradores antiguos sin grupo son de la contratista)
  const RD_GRUPO_TXT = { CONTRATISTA: { titulo: "Actividades planificadas (Contratista)", sufijo: "", corto: "Contratista" },
                         ECRF: { titulo: "Actividades planificadas (ECRF)", sufijo: "E", corto: "ECRF" } };
  const grupoRd = a => (a && a.grupo === "ECRF") ? "ECRF" : "CONTRATISTA";
  const actsGrupo = (borr, g) => borr.acts.map((a, i) => ({ a, i })).filter(x => grupoRd(x.a) === g);
  function bloqueActsRd(g, num, cat, borr, ed, completada) {
    const t = RD_GRUPO_TXT[g], sf = t.sufijo, e = ed && ed.grupo === g ? ed : null, mias = actsGrupo(borr, g);
    return `
        <div class="card p-4 rd-bloq ${completada ? "" : "off"}" id="rdBloque${g}">
          <div class="rd-candado">🔒 Completa la charla de seguridad para registrar tus actividades</div>
          <div class="rd-step"><span>${num}</span>${t.titulo}</div>
          <label class="text-xs font-semibold block mb-1" for="rdSel${sf}" style="color:var(--ink-soft)">Actividad *</label>
          <select id="rdSel${sf}" class="input mb-2">
            <option value="">Elige una actividad…</option>
            ${cat.map(a => `<option value="${escA(a.id)}" ${e && e.catalogoId === a.id ? "selected" : ""}>${escA(a.descripcion)}</option>`).join("")}
            <option value="__otra" ${e && !e.catalogoId ? "selected" : ""}>Otra actividad (escribirla)</option>
          </select>
          <input id="rdOtra${sf}" class="input mb-2" maxlength="300" placeholder="Escribe la actividad" value="${e && !e.catalogoId ? escA(e.descripcion) : ""}" style="${e && !e.catalogoId ? "" : "display:none"}">
          <label class="text-xs font-semibold block mb-1" for="rdCom${sf}" style="color:var(--ink-soft)">Comentarios o detalles (opcional)</label>
          <textarea id="rdCom${sf}" class="input mb-2" rows="2" maxlength="1000" placeholder="Ej.: sector, lugar, con quién">${e ? escA(e.comentario) : ""}</textarea>
          <div id="rdActErr${sf}" class="rd-err"></div>
          <div class="flex gap-2 mb-3">
            ${e ? `<button id="rdCancelEd${sf}" class="btn-ghost flex-1">Cancelar</button>` : ""}
            <button id="rdAgregar${sf}" class="btn-primary flex-1">${e ? "Guardar cambios" : "+ Agregar actividad"}</button>
          </div>
          <div class="text-sm font-bold mb-2">Mis actividades · ${t.corto} (${mias.length})</div>
          ${mias.length ? mias.map(({ a, i }, k) => `
            <div class="rd-dato mb-2" style="display:flex;gap:10px;align-items:flex-start">
              <b style="min-width:22px">${k + 1}.</b>
              <div class="flex-1 min-w-0"><div class="font-semibold">${escA(a.descripcion)}</div>
                ${a.comentario ? `<div class="text-xs" style="color:var(--ink-soft)">${escA(a.comentario)}</div>` : ""}</div>
              <button class="text-sm font-semibold rdEd" data-i="${i}" style="color:var(--brand)">Editar</button>
              <button class="text-sm font-semibold rdQuitar" data-i="${i}" style="color:var(--danger)">Quitar</button>
            </div>`).join("") : `<div class="text-sm py-3 text-center" style="color:var(--ink-soft)">Aún no agregas actividades</div>`}
        </div>`;
  }
  // títulos de grupo para el cierre y el detalle
  function actsPorGrupo(acts, pintar) {
    return ["CONTRATISTA", "ECRF"].map(g => { const l = (acts || []).filter(a => grupoRd(a) === g);
      return l.length ? `<div class="rd-grupo">${RD_GRUPO_TXT[g].titulo}</div>` + l.map((a, k) => pintar(a, k + 1)).join("") : ""; }).join("");
  }
  // Ubicación GPS para la salida a campo y el retorno a la oficina (la hora la pone el servidor)
  // GPS para salida y retorno: lectura nueva; si el celular tarda (p. ej. porque ya sigue el GPS en segundo plano),
  // se usa la última posición del seguimiento si tiene menos de 1 minuto, o una lectura reciente del sistema
  function obtenerGps() {
    const pedir = (maxAge, tmo) => new Promise((ok, mal) => navigator.geolocation.getCurrentPosition(
      p => ok({ lat: p.coords.latitude, lon: p.coords.longitude, precision: Math.round(p.coords.accuracy || 0) }), mal,
      { enableHighAccuracy: true, timeout: tmo, maximumAge: maxAge }));
    const error = e => new Error(e && e.code === 1 ? "Permite el acceso a tu ubicación (GPS) para registrar la hora" : "No se pudo obtener tu ubicación GPS. Activa la ubicación del celular y vuelve a intentar");
    if (!navigator.geolocation) return Promise.reject(new Error("Este celular no permite obtener la ubicación GPS"));
    return pedir(0, 12000).catch(e => {
      if (e && e.code === 1) throw error(e);
      const u = state.gpsUltimo, c = state.coords;
      if (u && Date.now() - u.en < 60000) return { lat: u.lat, lon: u.lon, precision: c && c.prec != null ? Math.round(c.prec) : null };
      return pedir(60000, 15000).catch(e2 => { throw error(e2); });
    });
  }
  const mapaPunto = g => g && isFinite(g.lat) ? `<a href="https://www.google.com/maps/search/?api=1&query=${g.lat},${g.lon}" target="_blank" rel="noopener" style="color:var(--brand);font-weight:700">📍 Ver ubicación</a>${g.precision != null && g.precision !== "" && !isNaN(g.precision) ? ` <span style="color:var(--ink-soft)">(±${g.precision} m)</span>` : ""}` : "";
  const EPP_MAX_FOTOS = 3;
  // Ítem 4 (Verificación de EPPs), salida a campo y retorno a la oficina: para todos los roles (antes, solo en prueba)
  const rdPiloto = () => true;
  // Ítem 4: Verificación de EPPs con registro fotográfico (la foto basta: se entiende que son los EPP)
  function bloqueEppRd(borr, completada) {
    const e = borr.epp || {}, fotos = e.fotos || [];
    return `
        <div class="card p-4 rd-bloq ${completada ? "" : "off"}" id="rdBloqueEpp">
          <div class="rd-candado">🔒 Completa la charla de seguridad para registrar tus actividades</div>
          <div class="rd-step"><span>4</span>Verificación de EPPs</div>
          <div class="text-sm mb-3" style="color:var(--ink-soft)">Toma una foto de tu equipo de protección personal (EPP) completo como evidencia. Va en los anexos del PDF del reporte.</div>
          <div class="text-xs font-semibold mb-1" style="color:var(--ink-soft)">Registro fotográfico * (${fotos.length} de ${EPP_MAX_FOTOS})</div>
          <div class="rd-fotos">
            ${fotos.map((f, i) => `<div class="rd-foto"><img src="${f}" alt="Foto ${i + 1} de tus EPP"><button class="rdEppQuitar" data-i="${i}" aria-label="Quitar foto ${i + 1}">✕</button></div>`).join("")}
            ${fotos.length < EPP_MAX_FOTOS ? `<label class="rd-foto rd-foto-add" for="rdEppFoto">📷<span>Tomar foto</span></label>` : ""}
          </div>
          <input id="rdEppFoto" type="file" accept="image/*" capture="environment" style="display:none">
          <div id="rdEppErr" class="rd-err"></div>
        </div>`;
  }
  const faltaManana = (borr, completada) => {
    const e = borr.epp || {}, f = [];
    if (!completada) f.push("la charla de seguridad");
    if (!borr.acts.length) f.push("al menos una actividad");
    if (rdPiloto() && !(e.fotos || []).length) f.push("la foto de tus EPP");
    return f;
  };
  function renderRdManana(rep) {
    const d = state.rdDatos, ch = d.charla;
    const completada = !ch || (rep && rep.charla && rep.charla.estado === "COMPLETADO" && rep.charla.id === ch.id);
    const borr = leerBorr(claveBorrador()) || { clave: nuevaClave(), acts: [] };
    if (!leerBorr(claveBorrador())) guardarBorr(claveBorrador(), borr);
    const ed = state.rdEditando;
    const cv = rep && rep.charla && rep.charla.id === (ch && ch.id) ? rep.charla : null;
    document.getElementById("rdEtapa").innerHTML = `
      <div class="rd-grid dos">
        <div class="card p-4">
          <div class="rd-step"><span>1</span>Charla de seguridad</div>
          ${!ch ? `<div class="text-sm p-3 rounded-lg" style="background:#E1F3FB;color:#0B4A6B">El administrador aún no configuró una charla de seguridad. Puedes registrar tus actividades.</div>` : `
          ${ch.tema ? `<div class="text-xs font-bold" style="color:var(--brand)">${escA(ch.tema)}</div>` : ""}
          <div class="font-bold">${escA(ch.titulo)}</div>
          ${ch.descripcion ? `<div class="text-sm mb-2" style="color:var(--ink-soft)">${escA(ch.descripcion)}</div>` : `<div class="mb-2"></div>`}
          ${completada ? `<div class="p-3 rounded-lg text-sm font-semibold mb-2" style="background:#DDF3E7;color:#12613B">✅ Charla completada</div>`
            : `<div class="rd-vcaja" id="rdVCaja"><div class="rd-video mb-2"><div id="rdPlayer"></div><div id="rdCapa" class="rd-capa" aria-hidden="true"></div></div>
               <div class="rd-vctl mb-2"><button id="rdVPlay" class="btn-primary" disabled>▶ Reproducir</button><button id="rdVAtras" class="btn-ghost" disabled>⏪ 10 s</button><button id="rdVGrande" class="btn-ghost" aria-pressed="false">⛶ Pantalla completa</button></div></div>
               <div class="text-xs mb-2" style="color:var(--ink-soft)">Debes ver el video completo: puedes pausar y retroceder, pero no adelantar.</div>`}
          <div class="rd-barra mb-1"><i id="rdBarra" style="width:${completada ? 100 : cv && cv.duracion ? Math.min(100, Math.round(cv.visto / cv.duracion * 100)) : 0}%"></i></div>
          <div class="text-xs mb-2" style="color:var(--ink-soft)" id="rdAvance">${completada ? "Visto al 100 %" : cv && cv.duracion ? `Visto ${Math.min(100, Math.round(cv.visto / cv.duracion * 100))} %` : "Reproduce el video hasta el final"}</div>
          <div class="grid grid-cols-3 gap-2 text-sm">
            <div class="rd-dato"><small>Inicio</small><b id="rdVIni">${cv && cv.inicio ? horaDe(cv.inicio) : "—"}</b></div>
            <div class="rd-dato"><small>Fin</small><b id="rdVFin">${cv && cv.fin ? horaDe(cv.fin) : "—"}</b></div>
            <div class="rd-dato"><small>Estado</small><b id="rdVEst">${RD_VIDEO_TXT[completada ? "COMPLETADO" : cv ? cv.estado : ""] || "—"}</b></div>
          </div>
          <div id="rdVMsg" class="rd-err"></div>`}
        </div>
        ${bloqueActsRd("CONTRATISTA", 2, d.catalogo || [], borr, ed, completada)}
        ${bloqueActsRd("ECRF", 3, d.catalogoEcrf || [], borr, ed, completada)}
        ${rdPiloto() ? bloqueEppRd(borr, completada) : ""}
        <div class="card p-4 rd-bloq ${completada ? "" : "off"} rd-guardar">
          <div class="text-sm mb-2" style="color:var(--ink-soft)">Actividades registradas: <b>${actsGrupo(borr, "CONTRATISTA").length}</b> de la contratista · <b>${actsGrupo(borr, "ECRF").length}</b> de ECRF</div>
          ${faltaManana(borr, completada).length ? `<div class="text-xs mb-2" style="color:#6B4A00">Falta: ${faltaManana(borr, completada).join(" · ")}</div>` : ""}
          <button id="rdGuardarM" class="btn-primary w-full" ${faltaManana(borr, completada).length ? "disabled" : ""}>Guardar reporte de la mañana</button>
          ${rdPiloto() ? `<div class="text-xs mt-2" style="color:var(--ink-soft)">Después de guardar aparece el botón de <b>hora de salida a campo</b>.</div>` : ""}
          <div id="rdGuardarErr" class="rd-err"></div>
        </div>
      </div>`;
    ["CONTRATISTA", "ECRF"].forEach(g => {
      const sf = RD_GRUPO_TXT[g].sufijo, cat = g === "ECRF" ? (d.catalogoEcrf || []) : (d.catalogo || []);
      const sel = document.getElementById("rdSel" + sf), otra = document.getElementById("rdOtra" + sf);
      sel.onchange = () => { otra.style.display = sel.value === "__otra" ? "" : "none"; if (sel.value === "__otra") otra.focus(); };
      document.getElementById("rdAgregar" + sf).onclick = () => {
        const err = document.getElementById("rdActErr" + sf);
        let a;
        if (sel.value === "__otra") { const t = otra.value.trim(); if (!t) { err.textContent = "Escribe la actividad"; return; } a = { catalogoId: "", descripcion: t }; }
        else if (sel.value) { const c = cat.find(x => x.id === sel.value); a = { catalogoId: c.id, descripcion: c.descripcion }; }
        else { err.textContent = cat.length ? "Elige una actividad de la lista o escribe otra" : "Elige «Otra actividad» y escríbela"; return; }
        a.comentario = document.getElementById("rdCom" + sf).value.trim(); a.grupo = g;
        const b = leerBorr(claveBorrador()) || borr;
        if (ed && ed.grupo === g) b.acts[ed.i] = a; else b.acts.push(a);
        guardarBorr(claveBorrador(), b); state.rdEditando = null; renderRdManana(rep);
      };
      const ce = document.getElementById("rdCancelEd" + sf); if (ce) ce.onclick = () => { state.rdEditando = null; renderRdManana(rep); };
    });
    document.querySelectorAll(".rdEd").forEach(b => b.onclick = () => {
      const i = +b.dataset.i, a = borr.acts[i]; state.rdEditando = { ...a, grupo: grupoRd(a), i }; renderRdManana(rep);
      document.getElementById("rdSel" + RD_GRUPO_TXT[grupoRd(a)].sufijo).scrollIntoView({ block: "center" });
    });
    document.querySelectorAll(".rdQuitar").forEach(b => b.onclick = () => { borr.acts.splice(+b.dataset.i, 1); guardarBorr(claveBorrador(), borr); state.rdEditando = null; renderRdManana(rep); });
    // ítem 4: confirmaciones y fotos (se guardan en el celular hasta enviar el reporte)
    const reEpp = () => { const y = window.scrollY; renderRdManana(rep); window.scrollTo(0, y); };
    document.querySelectorAll(".rdEppQuitar").forEach(x => x.onclick = () => {
      const b = leerBorr(claveBorrador()) || borr; (b.epp.fotos || []).splice(+x.dataset.i, 1); guardarBorr(claveBorrador(), b); reEpp();
    });
    const fe = document.getElementById("rdEppFoto");
    if (fe) fe.onchange = async () => {
      const f = fe.files && fe.files[0]; if (!f) return;
      try {
        // marca de agua: fecha y hora de la toma y la ubicación GPS del celular en ese momento
        const ahora = new Date(); ensureLocation();
        const c = state.coords && state.coords.lat != null ? state.coords : state.gpsUltimo;

  // ---------- reproductor de la charla con evidencia técnica ----------
  // Solo se puede reproducir, pausar y retroceder: no hay barra para adelantar, el video está cubierto por una capa
  // (no se puede tocar el título ni el logo de YouTube) y si de alguna forma se adelanta, vuelve al punto máximo visto.
  let ytListo = null, rdPlayer = null, rdTimer = null;
  function cargarApiYoutube() {
    if (window.YT && window.YT.Player) return Promise.resolve();
    if (ytListo) return ytListo;
    ytListo = new Promise((ok, mal) => {
      const anterior = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => { if (anterior) try { anterior(); } catch (e) {} ok(); };
      const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; s.onerror = () => { ytListo = null; mal(new Error("yt")); };
      document.head.appendChild(s);
      setTimeout(() => { if (!(window.YT && window.YT.Player)) { ytListo = null; mal(new Error("timeout")); } }, 20000);
    });
    return ytListo;
  }
  function detenerVideo() {
    clearInterval(rdTimer); rdTimer = null;
    if (rdPlayer) { try { rdPlayer.destroy(); } catch (e) {} rdPlayer = null; }
  }
  // Enlace que el reproductor del celular puede abrir directamente (Drive, OneDrive y SharePoint)
  function urlVideoDirecta(ch) {
    const u = String(ch.url || "").trim();
    if (ch.fuente === "drive") return "https://drive.usercontent.google.com/download?id=" + encodeURIComponent(ch.videoId) + "&export=download&confirm=t";
    if (ch.fuente === "onedrive") return "https://api.onedrive.com/v1.0/shares/u!" + btoa(unescape(encodeURIComponent(u))).replace(/=+$/, "").replace(/\//g, "_").replace(/\+/g, "-") + "/root/content";
    if (ch.fuente === "sharepoint") return u + (u.includes("?") ? "&" : "?") + "download=1";
    return "";
  }
  // Adaptador común: YouTube (API del iframe) o video del celular (<video>)
  function reproductorCharla(ch, cont, eventos) {
    if (ch.fuente && ch.fuente !== "youtube") {
      const v = document.createElement("video");
      v.setAttribute("playsinline", ""); v.preload = "metadata"; v.src = urlVideoDirecta(ch); v.disablePictureInPicture = true;
      v.setAttribute("controlslist", "nodownload noplaybackrate noremoteplayback");
      cont.appendChild(v);
      v.addEventListener("loadedmetadata", () => eventos.listo());
      v.addEventListener("playing", () => eventos.reproduce());
      v.addEventListener("pause", () => { if (!v.ended) eventos.pausa(); });
      v.addEventListener("ended", () => eventos.fin());
      v.addEventListener("error", () => eventos.error("No se pudo abrir el video. El enlace debe ser público («cualquier persona con el enlace»)."));
      return { tipo: "html", play: () => v.play(), pause: () => v.pause(), tiempo: () => v.currentTime, duracion: () => v.duration || 0,
        ir: t => { v.currentTime = t; }, reproduciendo: () => !v.paused && !v.ended, destroy: () => { v.pause(); v.removeAttribute("src"); v.load(); v.remove(); } };
    }
    const div = document.createElement("div"); div.id = "rdYt"; cont.appendChild(div);
    let p = null;
    p = new YT.Player("rdYt", {
      videoId: ch.videoId, width: "100%", height: "100%",
      playerVars: { controls: 0, disablekb: 1, fs: 0, rel: 0, modestbranding: 1, playsinline: 1, iv_load_policy: 3, cc_load_policy: 0 },
      events: {
        onReady: () => eventos.listo(),
        onError: ev => eventos.error(({ 2: "El enlace del video no es válido.", 5: "El video no se puede reproducir en este equipo.", 100: "El video no existe o es privado.", 101: "El dueño del video no permite verlo dentro de la app.", 150: "El dueño del video no permite verlo dentro de la app." }[ev.data] || "No se pudo reproducir el video."), ev.data),
        onStateChange: ev => { const S = YT.PlayerState; if (ev.data === S.PLAYING) eventos.reproduce(); else if (ev.data === S.PAUSED) eventos.pausa(); else if (ev.data === S.ENDED) eventos.fin(); }
      }
    });
    return { tipo: "yt", play: () => p.playVideo && p.playVideo(), pause: () => p.pauseVideo && p.pauseVideo(), tiempo: () => (p.getCurrentTime ? p.getCurrentTime() : 0) || 0,
      duracion: () => (p.getDuration ? p.getDuration() : 0) || 0, ir: t => p.seekTo && p.seekTo(t, true),
      reproduciendo: () => !!(p.getPlayerState && p.getPlayerState() === YT.PlayerState.PLAYING), destroy: () => { try { p.destroy(); } catch (e) {} } };
  }
  // Botón «Pantalla completa» del video de la charla (incluye los botones Reproducir/Pausar y −10 s)
  function activarPantallaCompleta() {
    const caja = document.getElementById("rdVCaja"), b = document.getElementById("rdVGrande"); if (!caja || !b) return;
    const pinta = on => { b.textContent = on ? "✕ Salir de pantalla completa" : "⛶ Pantalla completa"; b.setAttribute("aria-pressed", String(on)); };
    const nativo = !!(caja.requestFullscreen || caja.webkitRequestFullscreen);
    b.onclick = async () => {
      const dentro = document.fullscreenElement === caja || document.webkitFullscreenElement === caja || caja.classList.contains("rd-vgrande");
      if (dentro) {
        if (caja.classList.contains("rd-vgrande")) { caja.classList.remove("rd-vgrande"); document.body.style.overflow = ""; pinta(false); }
        else (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        return;
      }
      try {
        if (!nativo) throw 0;
        await (caja.requestFullscreen || caja.webkitRequestFullscreen).call(caja);
        try { await screen.orientation.lock("landscape"); } catch (e) {}       // en celular, se gira solo si el sistema lo permite
      } catch (e) { caja.classList.add("rd-vgrande"); document.body.style.overflow = "hidden"; pinta(true); }
    };
    const cambio = () => pinta(document.fullscreenElement === caja || document.webkitFullscreenElement === caja);
    caja.addEventListener("fullscreenchange", cambio); caja.addEventListener("webkitfullscreenchange", cambio);
  }
  async function montarVideo(ch, cv) {
    detenerVideo();
    const msg = t => { const m = document.getElementById("rdVMsg"); if (m) m.textContent = t || ""; };
    const fmt = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
    const pinta = (visto, dur, est) => {
      const pct = dur ? Math.min(100, Math.round(visto / dur * 100)) : 0;
      const b = document.getElementById("rdBarra"); if (b) b.style.width = pct + "%";
      const a = document.getElementById("rdAvance"); if (a) a.textContent = `Visto ${pct} %` + (dur ? ` · ${fmt(visto)} de ${fmt(dur)}` : "");
      if (est) { const e = document.getElementById("rdVEst"); if (e) e.textContent = RD_VIDEO_TXT[est] || est; }
    };
    const cont = document.getElementById("rdPlayer"); if (!cont) return;
    if (!ch.fuente || ch.fuente === "youtube") {
      try { await cargarApiYoutube(); }
      catch (e) { msg("No se pudo cargar el reproductor de YouTube. Revisa tu conexión e inténtalo de nuevo."); return; }
      if (!document.getElementById("rdPlayer")) return;
    }
    // "visto" = segundos distintos del video reproducidos de corrido (ver dos veces el mismo tramo no suma, adelantar no cuenta)
    const cubiertos = new Set();
    let visto = 0, ultimo = null, dur = 0, maximo = 0, inicioEnviado = !!(cv && cv.inicio), ultimoEnvio = 0, enviandoFin = false;
    const marca = (a, b) => { if (!(b > a) || b - a > 1.6) return; for (let s = Math.floor(a); s < Math.ceil(b - 0.05); s++) cubiertos.add(s); visto = Math.min(dur || Infinity, cubiertos.size); };
    const bPlay = document.getElementById("rdVPlay"), bAtras = document.getElementById("rdVAtras"), capa = document.getElementById("rdCapa");
    activarPantallaCompleta();
    const botonPlay = () => { if (bPlay) bPlay.innerHTML = rdPlayer && rdPlayer.reproduciendo() ? "⏸ Pausar" : "▶ Reproducir"; };
    const enviar = async (evento, extra) => {
      try {
        const r = await rdApi("rd_video", { evento, duracion: dur, visto: Math.round(visto), posicion: rdPlayer ? rdPlayer.tiempo() : 0, ...(extra || {}) });
        if (r.reporte) {
          state.rdDatos.reporte = { ...(state.rdDatos.reporte || {}), ...r.reporte, actividades: (state.rdDatos.reporte || {}).actividades };
          const ini = document.getElementById("rdVIni"); if (ini && r.reporte.charla.inicio) ini.textContent = horaDe(r.reporte.charla.inicio);
          const fin = document.getElementById("rdVFin"); if (fin && r.reporte.charla.fin) fin.textContent = horaDe(r.reporte.charla.fin);
          pinta(visto, dur, r.reporte.charla.estado);
        }
        return r;
      } catch (e) { msg(msgError(e) + ". El avance del video no se pudo registrar; si vuelve la señal, repite el final del video."); return null; }
    };
    // vigila cada medio segundo: cuenta lo visto y, si el video saltó hacia adelante, lo regresa al punto máximo visto
    const vigilar = () => {
      if (!rdPlayer || !rdPlayer.reproduciendo()) return;
      const t = rdPlayer.tiempo();
      if (t > maximo + 2) { rdPlayer.ir(maximo); ultimo = maximo; avisoHasta = Date.now() + 5000; msg("No se puede adelantar el video: debes verlo completo."); return; }
      if (ultimo !== null) marca(ultimo, t);
      ultimo = t; maximo = Math.max(maximo, t); pinta(visto, dur, "EN_CURSO");
      if (Date.now() - ultimoEnvio > 30000) { ultimoEnvio = Date.now(); enviar("progreso"); }
    };
    let intentoPlay = null, avisoHasta = 0;
    rdPlayer = reproductorCharla(ch, cont, {
      listo: () => { dur = rdPlayer.duracion() || 0; pinta(visto, dur); if (bPlay) bPlay.disabled = false; if (bAtras) bAtras.disabled = false; },
      error: (t, codigo) => { msg(t + " Avisa al administrador. No se registrará la charla como vista."); enviar("error", { codigoError: codigo || "video" }); },
      reproduce: () => {
        clearTimeout(intentoPlay); if (capa) capa.classList.remove("rd-capa-toca");
        dur = rdPlayer.duracion() || dur; if (Date.now() > avisoHasta) msg(""); ultimo = rdPlayer.tiempo(); botonPlay();
        if (!inicioEnviado) { inicioEnviado = true; enviar("inicio"); }
        if (!rdTimer) rdTimer = setInterval(vigilar, 500);
      },
      pausa: () => { if (ultimo !== null) marca(ultimo, Math.min(rdPlayer.tiempo(), maximo + 1)); ultimo = null; botonPlay(); enviar("pausa"); },
      fin: async () => {
        clearInterval(rdTimer); rdTimer = null; botonPlay();
        if (ultimo !== null) marca(ultimo, dur || rdPlayer.duracion()); ultimo = null; pinta(visto, dur);
        if (enviandoFin) return; enviandoFin = true;
        const r = await enviar("fin"); enviandoFin = false;
        if (r && r.reporte && r.reporte.charla.estado === "COMPLETADO") { toast("Charla completada ✅ Ya puedes registrar tus actividades"); detenerVideo(); renderRdHoy(); }
        else if (r) msg(r.msg || "El video no se vio completo. Vuelve a reproducirlo desde el inicio.");
      }
    });
    if (bPlay) bPlay.onclick = () => {
      if (!rdPlayer) return;
      if (rdPlayer.reproduciendo()) { rdPlayer.pause(); return; }
      const r = rdPlayer.play(); if (r && r.catch) r.catch(() => {});
      // algunos celulares no dejan iniciar YouTube desde un botón externo: se habilita un solo toque sobre el video
      clearTimeout(intentoPlay);
      intentoPlay = setTimeout(() => { if (rdPlayer && !rdPlayer.reproduciendo() && capa && rdPlayer.tipo === "yt") { capa.classList.add("rd-capa-toca"); msg("Toca el video una vez para empezar."); } }, 2500);
    };
    if (bAtras) bAtras.onclick = () => { if (!rdPlayer) return; const t = Math.max(0, rdPlayer.tiempo() - 10); rdPlayer.ir(t); ultimo = rdPlayer.reproduciendo() ? t : null; };
    if (capa) capa.onclick = ev => { ev.preventDefault(); if (bPlay && !capa.classList.contains("rd-capa-toca")) bPlay.click(); };
  }

        toast("Reporte cerrado ✅ Cumplimiento " + fmtPct(r.reporte.cumplimiento));

    };
  }

  const sumarDia = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  const DIAS_CORTOS = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
  function estadoCharla(c, d) {
    if (!c.activa) return { k: "pausada", t: "Pausada" };
    if (c.id === d.vigenteId) return { k: "hoy", t: c.fecha ? "Hoy" : "En uso hoy" };
    if (!c.fecha) return { k: "defecto", t: "Por defecto" };
    return { k: "prog", t: "Programada" };

        <div class="text-xs mt-2" style="color:var(--ink-soft)">✓ charla programada · ◌ sin charla: se usa la charla por defecto${defecto ? ` («${escA(defecto.tema)}»)` : ""} · — sin charla. Toca un día libre para programarlo.</div>
      </section>
      ${ed ? `

  /* ---------------- Mapa de la ruta (OpenStreetMap) + navegación en Google Maps ---------------- */
  const FORM_CORTO = { GPFO0381: "0381 Presiones", GPFO0405: "0405 Reparación", GPFO0416: "0416 Muestreo" };
  const PARADAS_TRAMO = 10;                       // Google Maps en el celular: destino + 9 paradas intermedias
  let mapaL = null;
  function cargarLeaflet() {
    if (window.L) return Promise.resolve();
    return new Promise((ok, mal) => {
      const css = document.createElement("link"); css.rel = "stylesheet";
      css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(css);
      const js = document.createElement("script"); js.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
      js.onload = ok; js.onerror = mal; document.head.appendChild(js);
    });
  }
  const distKm = (a, b) => {
    const R = 6371, r = x => x * Math.PI / 180;
    const dLa = r(b.lat - a.lat), dLo = r(b.lon - a.lon);
    const h = Math.sin(dLa / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLo / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  };
  // Orden por cercanía: el más cercano primero y luego se mejora deshaciendo cruces (2-opt)
  function ordenarCercania(puntos, inicio) {
    if (puntos.length < 2) return puntos.slice();
    const quedan = puntos.slice(), orden = [];
    let actual = inicio || quedan[0];
    if (!inicio) orden.push(quedan.shift());
    while (quedan.length) {
      let iMin = 0, dMin = Infinity;
      quedan.forEach((p, i) => { const d = distKm(actual, p); if (d < dMin) { dMin = d; iMin = i; } });
      actual = quedan.splice(iMin, 1)[0]; orden.push(actual);
    }
    const largo = r => r.reduce((s, p, i) => s + (i ? distKm(r[i - 1], p) : (inicio ? distKm(inicio, p) : 0)), 0);
    let mejoro = true, vueltas = 0;
    while (mejoro && vueltas++ < 50) {
      mejoro = false;
      for (let i = 0; i < orden.length - 1; i++) for (let k = i + 1; k < orden.length; k++) {
        const prueba = orden.slice(0, i).concat(orden.slice(i, k + 1).reverse(), orden.slice(k + 1));
        if (largo(prueba) + 1e-9 < largo(orden)) { orden.splice(0, orden.length, ...prueba); mejoro = true; }
      }
    }
    return orden;
  }
  function paradasRuta() {
    return state.pendientes.filter(p => (esSupervisor() || p.para === state.operario) && esDeHoy(p)).map(p => {
      const cache = NIS_REMOTO[p.nis] || nisLocal(p.nis) || {};
      const lat = p.latNis ?? cache.latNis, lon = p.lonNis ?? cache.lonNis;
      return { ...p, lat: lat == null || lat === "" ? null : Number(lat), lon: lon == null || lon === "" ? null : Number(lon) };
    });
  }
  function claveOrden() { return "ecrf_orden_ruta_" + (state.operario || ""); }
  function aplicarOrden(paradas) {
    const guardado = leerLS(claveOrden(), []);
    const pos = id => { const i = guardado.indexOf(id); return i < 0 ? 1e6 + (paradas.find(p => p.id === id).creadoEn || 0) : i; };
    return paradas.slice().sort((a, b) => pos(a.id) - pos(b.id));
  }
  function urlTramo(tramo) {
    const dest = tramo[tramo.length - 1], medio = tramo.slice(0, -1);
    const q = new URLSearchParams({ api: "1", destination: dest.lat + "," + dest.lon, travelmode: "driving" });
    if (medio.length) q.set("waypoints", medio.map(p => p.lat + "," + p.lon).join("|"));
    return "https://www.google.com/maps/dir/?" + q.toString();     // sin origen: Google parte desde donde estás
  }

  async function abrirMapaRuta() {

    const sinCoord = paradasRuta().filter(p => p.lat == null && NIS_REMOTO[p.nis] === undefined);
    if (sinCoord.length && enLinea()) await Promise.all(sinCoord.slice(0, 40).map(p => buscarNisServidor(p.nis).catch(() => {})));
    try { await cargarLeaflet(); } catch (e) {
      el.querySelector("#mapaL").innerHTML = `<div style="padding:30px;text-align:center;color:#4A5A6E">No se pudo cargar el mapa. Revisa tu internet.</div>`;

  function cerrarMapaRuta() {
    if (mapaL) { mapaL.remove(); mapaL = null; }

  }

  function pintarMapaRuta() {
    const todas = aplicarOrden(paradasRuta());
    const conCoord = todas.filter(p => p.lat != null && p.lon != null);
    const sinCoord = todas.filter(p => p.lat == null || p.lon == null);
    const tramos = []; for (let i = 0; i < conCoord.length; i += PARADAS_TRAMO) tramos.push(conCoord.slice(i, i + PARADAS_TRAMO));
    const res = document.getElementById("mapaResumen");
    if (res) res.textContent = `${todas.length} NIS · ${conCoord.length} en el mapa${sinCoord.length ? " · " + sinCoord.length + " sin ubicación" : ""}`;

    const panel = document.getElementById("mapaPanel");
    panel.innerHTML = `
      ${conCoord.length > 1 ? `<button id="mapaOrdenar" class="btn-ghost w-full mb-2">↻ Ordenar por cercanía${state.coords && state.coords.lat != null ? " (desde donde estoy)" : ""}</button>` : ""}
      ${tramos.map((t, i) => `
        <a href="${urlTramo(t)}" target="_blank" rel="noopener" class="btn-primary w-full mb-2" style="display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none">
          ${icoApp("maps")}Abrir en Google Maps${tramos.length > 1 ? ` · tramo ${i + 1} (paradas ${i * PARADAS_TRAMO + 1}–${i * PARADAS_TRAMO + t.length})` : ""}
        </a>`).join("")}
      <div class="text-xs mt-2 mb-1 font-semibold" style="color:var(--ink-soft)">Orden de visita</div>
      ${conCoord.map((p, i) => `<div class="text-sm py-1" style="border-bottom:1px solid #EEF2F6"><b>${i + 1}.</b> NIS ${escA(p.nis)} · ${escA(p.direccion || "")} <span style="color:var(--ink-soft)">· ${escA(p.form ? FORM_CORTO[p.form] || "" : "")}${esSupervisor() ? " · " + escA(p.para) : ""}</span></div>`).join("")}
      ${sinCoord.length ? `<div class="text-xs mt-3 p-2 rounded-lg" style="background:#FFF1C7;color:#6B4A00"><b>Sin ubicación en la base (no salen en el mapa):</b><br>${sinCoord.map(p => "NIS " + escA(p.nis) + " · " + escA(p.direccion || "")).join("<br>")}</div>` : ""}`;
    const bOrd = document.getElementById("mapaOrdenar");
    if (bOrd) bOrd.onclick = () => {
      const c = state.coords && state.coords.lat != null ? { lat: state.coords.lat, lon: state.coords.lon } : null;
      const orden = ordenarCercania(conCoord, c);
      guardarLS(claveOrden(), orden.map(p => p.id).concat(sinCoord.map(p => p.id)));
      toast("Ruta ordenada por cercanía");

    };

    if (!window.L) return;
    if (!mapaL) {
      mapaL = L.map("mapaL", { zoomControl: true });
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(mapaL);
    } else mapaL.eachLayer(l => { if (!(l instanceof L.TileLayer)) mapaL.removeLayer(l); });
    const limites = [];
    conCoord.forEach((p, i) => {
      const icono = L.divIcon({ className: "", iconSize: [30, 30], iconAnchor: [15, 15],
        html: `<div style="width:30px;height:30px;border-radius:50%;background:#03204C;color:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font:700 13px Roboto,Arial,sans-serif">${i + 1}</div>` });
      L.marker([p.lat, p.lon], { icon: icono }).addTo(mapaL)
        .bindPopup(`<b>${i + 1}. NIS ${escA(p.nis)}</b><br>${escA(p.direccion || "")}<br><small>${escA(p.urb || "")} ${escA(p.distrito || "")} · ${escA(p.form ? FORM_CORTO[p.form] || "" : "")}</small><br><a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}" target="_blank" rel="noopener">Ir solo a este punto</a>`);
      limites.push([p.lat, p.lon]);
    });
    if (conCoord.length > 1) L.polyline(conCoord.map(p => [p.lat, p.lon]), { color: "#33B1E4", weight: 3, dashArray: "6 6" }).addTo(mapaL);
    if (state.coords && state.coords.lat != null) {
      L.circleMarker([state.coords.lat, state.coords.lon], { radius: 8, color: "#fff", weight: 3, fillColor: "#1A73E8", fillOpacity: 1 }).addTo(mapaL).bindPopup("Estás aquí");

  const sgOrdenFecha = v => { const m = String(v || "").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
    return m ? m[3] + m[2].padStart(2, "0") + m[1].padStart(2, "0") + (m[4] || "0").padStart(2, "0") + (m[5] || "00") : ""; };
  let sgPedido = 0;
  async function buscarSgioRango() {
    const desde = state.sgDesde, hasta = state.sgHasta, n = ++sgPedido;
    if (!desde || !hasta) { state.sgR = { error: "Elige la fecha de inicio y la de término" }; return renderSgio(); }
    if (desde > hasta) { state.sgR = { error: "La fecha de inicio es posterior a la de término" }; return renderSgio(); }
    state.sgR = { cargando: true }; renderSgio();
    try {
      const r = await rdApi("sgio_rango", { desde, hasta, por: "revision" });
      const ix = r.campos.indexOf("f_revision");
      r.filas.sort((x, y) => { const a = sgOrdenFecha(x[ix]), b = sgOrdenFecha(y[ix]); return a < b ? 1 : a > b ? -1 : 0; });   // la revisión más reciente primero
      if (n === sgPedido) state.sgR = r;
    } catch (e) { if (n === sgPedido) state.sgR = { error: msgError(e) }; }
    if (n === sgPedido && state.vista === "SGIO") renderSgio();
  }
  function sgRangoFiltradas(r) {
    const ix = c => r.campos.indexOf(c), est = state.sgREst || "", ie = ix("estado_fuga");
    const fil = SG_FILTROS.find(f => f[0] === state.sgFCampo), q = (state.sgFValor || "").trim().toUpperCase();
    const ic = fil ? ix(fil[2]) : -1;
    return r.filas.filter(f => (!est || (est === "pend" ? sgEsPend(f[ie]) : !sgEsPend(f[ie])))
      && (!fil || !q || String(f[ic] == null ? "" : f[ic]).toUpperCase().includes(q)));
  }
  // la fecha de registro de los datos antiguos (sin f_alta) se toma de f_aviso
  const sgCelda = (r, f, c) => { const ix = k => r.campos.indexOf(k); const v = f[ix(c)];
    return c === "f_alta" && (v === "" || v == null) ? f[ix("f_aviso")] : v; };
  function htmlTablaSg(r) {

        const h = sgEsPend(f[r.campos.indexOf("estado_fuga")]) ? horasSinAtencion(sgCelda(r, f, "f_alta"), f[r.campos.indexOf("f_revision")]) : null;

      }

      : `<div class="sg-tabla-w"><table class="sg-tabla sgr-tabla"><thead><tr>${SG_COLS.map(([c, t]) => `<th class="sgr-${c}">${escA(t)}</th>`).join("")}</tr></thead>
          <tbody>${filas.map(f => `<tr>${SG_COLS.map(([c]) => `<td class="sgr-${c}">${celda(f, c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}`;

  function renderSgio() {

  // ----- Ficha de la fuga (ventana sobre el listado) -----
  const sgFichas = {};

  /* ---------------- CENTRO DE CONTROL (módulo CENTRO_CONTROL) ----------------
     Solo fugas de EMERGENCIA, ubicadas por su NIS:
       · Pendiente (rojo parpadeante)
       · Más de 1 día sin atención (negro parpadeante): pendiente cuya fecha de registro es igual a la de revisión y que

       · Asignada (naranja parpadeante): pendiente con laboratorio asignado
       · Atendida hoy (verde, fijo): ya no está en PENDIENTE y se revisó hoy
     Al tocar un punto: datos de la fuga, asignar laboratorio y «Cómo llegar». */
  const CC_CLASES = {
    vencida: { color: "#111111", n: "Más de 1 día sin atención", c: "+1 día sin atención" },
    pendiente: { color: "#FF1A1A", n: "Pendientes", c: "Pendiente" },
    asignada: { color: "#FF8A00", n: "Asignadas", c: "Asignada" },

  const CC_ORDEN = ["vencida", "pendiente", "asignada", "atendida"];
  // «dd/mm/aaaa hh:mm» (hora de Lima) → fecha del celular
  const ccFecha = v => { const m = String(v || "").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
    return m ? new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0)) : null; };
  const ccMismoMinuto = (a, b) => String(a || "").slice(0, 16) === String(b || "").slice(0, 16) && !!a;
  // Horas sin atención: solo si la fecha de registro es igual a la de revisión (la fuga aún no se atiende)

    const f = ccFecha(registro); return f ? Math.max(0, (Date.now() - f.getTime()) / 3.6e6) : null;
  }
  function claseCC(f) {

    return h != null && h >= 24 ? "vencida" : "pendiente";
  }

  };
  function renderCentroControl() {
    document.getElementById("app").innerHTML = `${estilosGis()}
      ${cabeceraGis("Centro de Control", "fugas de emergencia", ICO_CC, "Gestión & Reportes")}
      <div class="gis-wrap px-4 py-4 pb-24 gis-split cc-split">

        <div class="gis-mapa cc-mapa" id="ccMapa" role="region" aria-label="Mapa del Centro de Control"></div>
      </div>
      <style>
        .cc-mapa{height:72vh;min-height:380px}@media (min-width:900px){.cc-split{grid-template-columns:minmax(0,360px) minmax(0,1fr)}.cc-mapa{height:calc(100vh - 140px)}}

  function pintarPanelCC() {

        ${sinUbic && f.clase !== "atendida" ? `<div class="cc-asig-in" hidden>

    el.innerHTML = `

          : listo ? `Solo emergencias · se actualiza solo cada 3 minutos${d.actualizado ? " · Última carga del SGIO: " + escA(d.actualizado) : ""}${sinUb ? ` · ${sinUb} sin ubicación en la base de NIS` : ""}` : "Cargando fugas…"}</div>
      </div>
      ${listo ? `<div class="card p-4 mt-3"><div class="gis-lbl">${ver === "todas" ? "Fugas en el mapa" : CC_CLASES[ver].n} (${lista.length})</div>

    el.querySelectorAll(".ccVer").forEach(b => b.onclick = () => { state.ccVer = b.dataset.v === state.ccVer && b.dataset.v !== "todas" ? "todas" : b.dataset.v; pintarPanelCC(); pintarMarcasCC(true); });

      if (f.lat != null) return ccAbrir(f.cod);
      const p = b.parentElement.querySelector(".cc-asig-in"); if (!p) return;   // sin ubicación: se asigna desde la lista
      p.hidden = !p.hidden; b.setAttribute("aria-expanded", String(!p.hidden)); if (!p.hidden) p.querySelector("select").focus();

  async function asignarCC(f, sel, btn, msg, listo) {
    if (!sel.value) { msg.style.color = "var(--danger)"; msg.textContent = "Elige un laboratorio de la lista"; sel.focus(); return; }
    btn.disabled = true; btn.textContent = "Asignando…"; msg.textContent = "";
    try {
      const r = await rdApi("sgio_asignar", { cod: f.cod, nis: f.nis, lab: sel.value });
      f.asignado = r.asignado; f.clase = claseCC(f);
      toast("Laboratorio " + r.asignado.lab + " asignado a la fuga " + f.cod);
      const m = ccMarcas[f.cod]; if (m) m.setIcon(iconoCC(f.clase));
      listo();
      pintarPanelCC();
    } catch (e) { btn.disabled = false; btn.textContent = f.asignado ? "Cambiar laboratorio" : "Asignar laboratorio"; msg.style.color = "var(--danger)"; msg.textContent = msgError(e); }
  }
  let ccMarcas = {}, ccCapa = null, ccYoM = null;
  const ICO_GPS = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg>`;
  async function crearMapaCC() {
    const turno = ++turnoMapa;
    try { await cargarLeaflet(); } catch (e) { const m = document.getElementById("ccMapa"); if (m) m.innerHTML = `<div class="gis-sinmapa">No se pudo cargar el mapa. Revisa tu internet.</div>`; return; }
    if (turno !== turnoMapa || !document.getElementById("ccMapa")) return;
    if (ccL) { ccL.remove(); ccL = null; }
    ccL = L.map("ccMapa", { zoomControl: true, maxZoom: 20 }); capaBase(ccL);
    // botón GPS debajo del + y −: actualiza «Aquí estás» sin acercar el mapa
    const Gps = L.Control.extend({ options: { position: "topleft" }, onAdd() {
      const d = L.DomUtil.create("div", "leaflet-bar leaflet-control");
      d.innerHTML = `<a href="#" role="button" class="cc-gps" id="ccGps" title="Actualizar mi ubicación" aria-label="Actualizar mi ubicación">${ICO_GPS}</a>`;
      L.DomEvent.disableClickPropagation(d);
      d.firstChild.onclick = e => { e.preventDefault(); ccUbicarme(true); };
      return d; } });
    new Gps().addTo(ccL);
    ccCapa = L.layerGroup().addTo(ccL); ccYoM = null;
    ccL.setView([-12.06, -77.04], 11);
    pintarMarcasCC(false);
    const yo = state.ccYo || (state.coords && state.coords.lat != null ? state.coords : state.gpsUltimo);
    if (yo && yo.lat != null) ponerYoCC(yo);
    ccUbicarme(false);
  }
  function ponerYoCC(yo) {
    if (!ccL) return;
    if (ccYoM) ccYoM.setLatLng([yo.lat, yo.lon]);
    else ccYoM = L.marker([yo.lat, yo.lon], { icon: ICONO_AQUI_CC(), zIndexOffset: 1000, keyboard: false, interactive: false }).addTo(ccL);
  }
  async function ccUbicarme(manual) {
    const b = document.getElementById("ccGps"); if (b) b.classList.add("busca");
    let c = await ubicacionAhora();
    if (!c || c.lat == null) {                         // sin lectura nueva: la última que tiene la app (si es reciente)
      const u = state.gpsUltimo; if (u && u.lat != null && Date.now() - (u.en || 0) < 5 * 60000) c = u;
    }
    if (b) b.classList.remove("busca");
    if (!c || c.lat == null) { if (manual) toast("No se pudo obtener tu ubicación. Revisa el GPS y el permiso de ubicación.", true); return; }
    state.ccYo = { lat: c.lat, lon: c.lon, en: Date.now() };
    if (!ccL) return;
    ponerYoCC(state.ccYo);
    if (manual && !ccL.getBounds().contains([c.lat, c.lon])) ccL.panTo([c.lat, c.lon]);   // se mueve, pero sin cambiar el acercamiento
    if (manual) toast("Ubicación actualizada");
  }
  function pintarMarcasCC(conservar) {
    if (!ccL || !ccCapa) return;
    const { visibles } = ccListas();
    ccCapa.clearLayers(); ccMarcas = {};
    const lim = [];
    visibles.filter(f => f.lat != null).forEach(f => {
      const c = CC_CLASES[f.clase];
      const m = L.marker([f.lat, f.lon], { icon: iconoCC(f.clase), zIndexOffset: f.clase === "atendida" ? 0 : f.clase === "vencida" ? 700 : 500, title: c.c + " · fuga " + f.cod + " · NIS " + f.nis })
        .addTo(ccCapa).bindPopup(() => ventanaCC(f), { maxWidth: 300 });
      m.on("popupopen", ev => activarVentanaCC(f, ev.popup));
      ccMarcas[f.cod] = m; lim.push([f.lat, f.lon]);
    });
    if (!conservar || !state.ccEncuadrado) { if (lim.length) { ccL.fitBounds(lim, { padding: [40, 40], maxZoom: 16 }); state.ccEncuadrado = true; } }
  }
  function ccAbrir(cod) {
    const m = ccMarcas[cod]; if (!m || !ccL) return;
    ccL.setView(m.getLatLng(), Math.max(ccL.getZoom(), 16)); m.openPopup();
    if (window.innerWidth < 900) document.getElementById("ccMapa").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function ventanaCC(f) {
    const labs = (state.ccDatos && state.ccDatos.laboratorios) || [], c = CC_CLASES[f.clase];
    const h = f.clase !== "atendida" ? horasSinAtencion(f.registro, f.revision) : null;
    const yo = state.ccYo || (state.gpsUltimo && state.gpsUltimo.lat != null ? state.gpsUltimo : null);
    const llegar = `https://www.google.com/maps/dir/?api=1${yo ? `&origin=${yo.lat},${yo.lon}` : ""}&destination=${f.lat},${f.lon}&travelmode=driving`;
    return `<div class="cc-pop">
      <div class="cc-pop-tit"><span class="cc-dot" style="background:${c.color}"></span>${c.c}</div>
      <dl><dt>NIS</dt><dd>${escA(f.nis || "—")}</dd><dt>Código de fuga</dt><dd><a href="#" class="cc-cod" id="ccCod" title="Ver todo el detalle de la fuga">${escA(f.cod)}</a></dd><dt>Dirección</dt><dd>${escA(f.dir || "—")}</dd>
        <dt>Localidad</dt><dd>${escA(f.loc || "—")}</dd><dt>Distrito</dt><dd>${escA(f.dist || "—")}</dd><dt>Fecha de registro</dt><dd>${escA(f.registro || "—")}</dd>
        <dt>Estado</dt><dd>${escA(f.estado || "—")}</dd>${h != null ? `<dt>Sin atención</dt><dd><b>${fmtHoras(h)}</b></dd>` : ""}</dl>
      ${f.asignado ? `<div class="cc-ya">Laboratorio asignado: <b>${escA(f.asignado.lab)}</b><br><small>${escA(f.asignado.por)} · ${escA(f.asignado.en)}</small></div>` : ""}
      ${f.clase !== "atendida" ? `

      <button class="cc-asig" id="ccAsig">${f.asignado ? "Cambiar laboratorio" : "Asignar laboratorio"}</button>
      <a class="cc-llegar" id="ccLlegar" href="${llegar}" target="_blank" rel="noopener">${icoApp("maps")}Cómo llegar</a>
      <div class="cc-msg" id="ccMsg"></div>` : ""}
    </div>`;
  }
  function activarVentanaCC(f, popup) {
    const cont = popup.getElement(); if (!cont) return;
    const cod = cont.querySelector("#ccCod");   // código subrayado: abre la ficha completa de la fuga (como en Incidencias SGIO)
    if (cod) cod.onclick = e => { e.preventDefault(); abrirFichaFuga(f.cod, f.registro || f.revision || "", cod); };

  function activarSgioAdmin() {
    const det = document.getElementById("sgAdm"); if (det) det.ontoggle = () => { state.sgAdmAbierto = det.open; };
    const cargar = async () => {
      try { const r = await rdApi("sgio_estado"); state.sgAdmin = { archivos: r.archivos }; }
      catch (e) { state.sgAdmin = { error: msgError(e) }; }
      if (state.vista === "SGIO") { const y = window.scrollY; renderSgio(); window.scrollTo(0, y); }
    };
    const bc = document.getElementById("sgAdmCargar"); if (bc) bc.onclick = () => { state.sgAdmAbierto = true; cargar(); };
    const preparar = async ids => {
      const a = state.sgAdmin; let hechos = 0;
      for (const id of ids) {
        a.trabajando = id; a.msg = ""; if (state.vista === "SGIO") { const y = window.scrollY; renderSgio(); window.scrollTo(0, y); }
        try {
          const r = await rdApi("sgio_preparar", { id });
          a.archivos = a.archivos.map(x => x.id === id ? r.archivo : x); hechos++;
          a.msg = "Listo: " + r.archivo.nombre + " · " + r.n + " incidencias"; a.msgErr = false;
        } catch (e) { a.msg = msgError(e); a.msgErr = true; break; }
      }
      a.trabajando = null;
      if (hechos) { state.sgR = null; Object.keys(sgFichas).forEach(k => delete sgFichas[k]); }
      if (state.vista === "SGIO") { const y = window.scrollY; renderSgio(); window.scrollTo(0, y); }
    };
    document.querySelectorAll(".sgPrep").forEach(b => b.onclick = () => preparar([b.dataset.id]));
    const bt = document.getElementById("sgPrepTodos"); if (bt) bt.onclick = () => preparar(state.sgAdmin.archivos.filter(x => !x.preparado).map(x => x.id));
  }
  function renderLaboratorio() {

  // ---------- Panel: subir documentos (PDF) y fotos; del PDF se leen los datos para completar el formulario ----------
  let pdfjsListo = null;
  function cargarPdfJs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    return pdfjsListo || (pdfjsListo = new Promise((ok, mal) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; ok(window.pdfjsLib); };
      s.onerror = () => { pdfjsListo = null; mal(new Error("pdfjs")); };
      document.head.appendChild(s);
    }));
  }
  async function textoDePdf(buf) {
    const lib = await cargarPdfJs();
    const pdf = await lib.getDocument({ data: buf }).promise;
    let t = "";
    for (let i = 1; i <= Math.min(pdf.numPages, 4); i++) {
      const c = await (await pdf.getPage(i)).getTextContent();
      t += c.items.map(x => x.str + (x.hasEOL ? "\n" : " ")).join("") + "\n";
    }
    return t.replace(/[ \t]+/g, " ");
  }
  const MESES_ES = { enero: 1, febrero: 2, marzo: 3, abril: 4, mayo: 5, junio: 6, julio: 7, agosto: 8, septiembre: 9, setiembre: 9, octubre: 10, noviembre: 11, diciembre: 12 };
  // todas las fechas del texto, con su posición: 18/09/2026, 18-09-2026, 2026-09-18, 18 de septiembre de 2026
  function fechasDeTexto(t) {
    const out = [], iso = (y, m, d) => (y >= 1990 && y <= 2100 && m >= 1 && m <= 12 && d >= 1 && d <= 31) ? `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}` : null;
    let m;
    const r1 = /\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})\b/g; while ((m = r1.exec(t))) { const f = iso(+m[3], +m[2], +m[1]); if (f) out.push({ f, i: m.index }); }
    const r2 = /\b(\d{4})-(\d{2})-(\d{2})\b/g; while ((m = r2.exec(t))) { const f = iso(+m[1], +m[2], +m[3]); if (f) out.push({ f, i: m.index }); }
    const r3 = /\b(\d{1,2})\s+de\s+([a-záéíóú]+)\s+(?:de|del)\s+(\d{4})\b/gi; while ((m = r3.exec(t))) { const mes = MESES_ES[m[2].toLowerCase()]; const f = mes && iso(+m[3], mes, +m[1]); if (f) out.push({ f, i: m.index }); }
    return out.sort((a, b) => a.i - b.i);
  }
  // fecha que aparece poco después de alguna de las palabras clave
  function fechaTras(t, fechas, re, usadas) {

      img.src = url;
    });
  }

    const fotoAdm = (k, t) => `<div class="adm-foto">${v[k] ? `<img src="${urlFotoDrive(v[k], 500)}" alt="${t}">` : LAB_DIBUJO[k === "fotoFrontal" ? "frontal" : "lateral"]}

  function activarAdminVehiculo(app) {
    app.querySelectorAll(".vehCampo").forEach(i => i.oninput = i.onchange = () => { state.adminVeh[i.dataset.k] = i.value; i.classList.remove("adm-sug"); });
    app.querySelectorAll(".labUp").forEach(i => i.onchange = () => { const f = i.files && i.files[0]; if (f) subirArchivoLab(i.dataset.campo, f); });
    const b = document.getElementById("vehGuardar"); if (!b) return;
    b.onclick = async () => {
      const e = document.getElementById("vehErr"); e.textContent = "";
      const v = state.adminVeh;
      if (!String(v.placa || "").trim()) { e.textContent = "La placa es obligatoria"; return; }
      const malo = LAB_SECCIONES.flatMap(s => s.c).find(([k, , t]) => t === "url" && v[k] && !/^https:\/\//.test(v[k]));
      if (malo) { e.textContent = "El enlace de «" + malo[1] + "» debe empezar con https://"; return; }
      b.disabled = true; b.textContent = "Guardando…";
      try { state.labDatos = await rdApi("lab_vehiculo", { vehiculo: v }); state.adminVeh = null; state.labSugeridos = []; state.labDocMsg = {}; toast("Vehículo guardado ✅"); }
      catch (x) { e.textContent = msgError(x); }
      b.disabled = false; b.textContent = "Guardar datos del vehículo";
      if (state.admin) { const y = window.scrollY; renderAdmin(); window.scrollTo(0, y); }
    };
  }

      .lab-foto{position:relative}.lab-prev img{margin-top:8px;max-height:180px;border-radius:10px}
      .lab-acc{display:grid;gap:10px}.lab-det summary{list-style:none;cursor:pointer}.lab-det summary::-webkit-details-marker{display:none}
      .lab-tabla-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
      .lab-tabla{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
      .lab-tabla th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);padding:10px;border-bottom:1px solid var(--line)}
      .lab-tabla td{padding:10px;border-bottom:1px solid #EEF2F6}.lab-tabla tr.labFila{cursor:pointer}.lab-tabla tr.labFila:hover{background:#F6F9FC}
      .lab-tabla .num{text-align:right;font-variant-numeric:tabular-nums}
      .lab-modal{position:fixed;inset:0;z-index:90;background:rgba(3,32,76,.55);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
      .lab-modal-in{width:100%;max-width:560px;max-height:calc(100dvh - 32px);overflow:auto;margin:auto;box-sizing:border-box}
      .lab-modal-in img{display:block;max-height:calc(100dvh - 120px);object-fit:contain}
      .lab-fotos{display:grid;grid-template-columns:1fr 1fr;gap:10px}.lab-fotos small{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px}
      .lab-fotos img{border-radius:10px}
      .adm-guardar-veh{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
    </style>`;
  }

  /* ---------------- Generar PDF (cada operario el suyo; el supervisor, el de cualquiera) ---------------- */
  const MESES_APP = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","setiembre","octubre","noviembre","diciembre"];
  function abrirPanelPdf() {
    const hoy = new Date();
    const meses = [];
    for (let i = 0; i < 6; i++) {
      const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
      meses.push({ v: d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"), t: MESES_APP[d.getMonth()] + " " + d.getFullYear() });
    }
    const p = state.pdf = state.pdf || { form: "GPFO0381", mes: meses[0].v, quincena: hoy.getDate() <= 15 ? 1 : 2, para: state.operario };
    if (!esSupervisor()) p.para = state.operario;
    let el = document.getElementById("panelPdf");
    if (!el) {
      el = document.createElement("div"); el.id = "panelPdf";
      el.style.cssText = "position:fixed;inset:0;z-index:80;background:rgba(3,32,76,.55);display:flex;align-items:flex-end;justify-content:center";
      document.body.appendChild(el);
      el.addEventListener("click", e => { if (e.target === el) cerrarPanelPdf(); });
    }
    const chip = (grupo, v, t, activo) => `<button data-${grupo}="${v}" style="min-height:46px;border-radius:12px;font-weight:700;font-size:15px;border:${activo ? "2px solid var(--brand-dark);background:var(--brand-dark);color:#fff" : "1.5px solid #CFD8E3;background:#fff;color:var(--ink)"}">${t}</button>`;
    const nombres = OPERARIOS.map(o => o.name);   // el supervisor puede generar el suyo o el de cualquier operario
    el.innerHTML = `
      <div style="background:#F2F5F8;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <b style="font-size:20px;color:var(--brand-dark)">Generar PDF</b>
          <button id="pdfCerrar" aria-label="Cerrar" style="font-size:24px;line-height:1;background:none;border:0;color:var(--ink-soft);width:40px;height:40px">✕</button>
        </div>
        <label class="text-sm font-semibold block mb-1" style="color:var(--ink-soft)">Operario</label>
        ${esSupervisor()
          ? `<select id="pdfPara" class="w-full mb-3" style="height:50px;border:1.5px solid #CFD8E3;border-radius:12px;background:#fff;padding:0 12px;font-size:16px;font-weight:600">
               ${nombres.map(n => `<option ${n === p.para ? "selected" : ""}>${escA(n)}</option>`).join("")}</select>`
          : `<div class="mb-3" style="height:50px;display:flex;align-items:center;border-radius:12px;background:#fff;border:1.5px solid #CFD8E3;padding:0 12px;font-size:16px;font-weight:600">${escA(state.operario)}</div>`}
        <label class="text-sm font-semibold block mb-1" style="color:var(--ink-soft)">Formulario</label>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px" class="mb-3">
          ${chip("f", "GPFO0381", "0381<br><small style='font-weight:500'>Presiones</small>", p.form === "GPFO0381")}
          ${chip("f", "GPFO0405", "0405<br><small style='font-weight:500'>Reparación</small>", p.form === "GPFO0405")}
          ${chip("f", "GPFO0416", "0416<br><small style='font-weight:500'>Muestreo</small>", p.form === "GPFO0416")}
        </div>
        <label class="text-sm font-semibold block mb-1" style="color:var(--ink-soft)">Mes</label>
        <select id="pdfMes" class="w-full mb-3" style="height:50px;border:1.5px solid #CFD8E3;border-radius:12px;background:#fff;padding:0 12px;font-size:16px;font-weight:600">
          ${meses.map(m => `<option value="${m.v}" ${m.v === p.mes ? "selected" : ""}>${m.t}</option>`).join("")}
        </select>
        ${p.form === "GPFO0416" ? `
          <label class="text-sm font-semibold block mb-1" style="color:var(--ink-soft)">Quincena</label>
          <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px" class="mb-3">
            ${chip("q", 1, "1ra · del 1 al 15", p.quincena === 1)}
            ${chip("q", 2, "2da · del 16 al fin", p.quincena === 2)}
          </div>` : ""}
        <div id="pdfEstado" class="text-sm mb-3" style="color:var(--ink-soft)"></div>
        <button id="pdfGenerar" class="btn-primary w-full">Generar PDF</button>
      </div>`;
    el.querySelector("#pdfCerrar").onclick = cerrarPanelPdf;
    el.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { p.form = b.dataset.f; abrirPanelPdf(); });
    el.querySelectorAll("[data-q]").forEach(b => b.onclick = () => { p.quincena = Number(b.dataset.q); abrirPanelPdf(); });
    el.querySelector("#pdfMes").onchange = e => { p.mes = e.target.value; };
    const sel = el.querySelector("#pdfPara"); if (sel) sel.onchange = e => { p.para = e.target.value; };
    el.querySelector("#pdfGenerar").onclick = generarPdf;
  }
  function cerrarPanelPdf() { const el = document.getElementById("panelPdf"); if (el) el.remove(); }

  async function generarPdf() {
    const p = state.pdf, est = document.getElementById("pdfEstado"), btn = document.getElementById("pdfGenerar");
    const aviso = (t, color) => { est.style.color = color || "var(--ink-soft)"; est.innerHTML = t; };
    if (!apiListo() || !enLinea()) { aviso("Necesitas internet para generar el PDF.", "#8E2019"); return; }
    btn.disabled = true; btn.textContent = "Generando…";
    try {
      if (p.para === state.operario && await porSubir()) {          // primero se suben los registros pendientes del celular
        aviso("Subiendo tus registros pendientes…");
        await sincronizar();
      }
      const quedan = p.para === state.operario ? await porSubir() : 0;
      aviso("Armando el PDF, espera unos segundos…");
      const r = await apiPost({ tipo: "pdf", para: p.para, form: p.form, mes: p.mes, quincena: p.quincena });
      aviso(`<div style="background:#DDF3E7;color:#12613B;border-radius:12px;padding:12px">
          <b>Listo:</b> ${r.n} registro(s) · ${escA(r.periodo)}<br><span style="font-size:12px;word-break:break-all">${escA(r.nombre)}</span>
          ${quedan ? `<br><span style="color:#6B4A00">Ojo: ${quedan} registro(s) aún no se subieron y no salen en el PDF.</span>` : ""}
        </div>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px">
          <a href="${r.url}" target="_blank" rel="noopener" class="btn-ghost" style="display:flex;align-items:center;justify-content:center;text-decoration:none">Ver PDF</a>
          <a href="${r.descarga}" target="_blank" rel="noopener" class="btn-primary" style="display:flex;align-items:center;justify-content:center;text-decoration:none">Descargar</a>
        </div>`);
    } catch (e) {
      const msg = e && e.code === "sin_registros" ? e.message
        : e && e.code === "permiso" ? e.message
        : "No se pudo generar el PDF. Revisa tu internet e inténtalo otra vez.";
      aviso(escA(msg || ""), "#8E2019");
    } finally {
      btn.disabled = false; btn.textContent = "Generar PDF";
    }
  }

  /* ---------------- App instalable / actualizaciones ---------------- */
  function avisoActualizacion(sw) {
    if (document.getElementById("avisoVersion")) return;
    const el = document.createElement("div");
    el.id = "avisoVersion";
    el.style.cssText = "position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:90;background:#03204C;color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3)";
    el.innerHTML = `<div style="flex:1;font-weight:600;font-size:14px">Hay una nueva versión de la app</div><button style="background:#33B1E4;color:#03204C;border:0;border-radius:10px;padding:8px 12px;font-weight:800">Actualizar</button>`;
    el.querySelector("button").onclick = () => { sw.postMessage("actualizar"); };
    document.body.appendChild(el);
  }
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    let recargando = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (!recargando) { recargando = true; location.reload(); } });
    navigator.serviceWorker.register("sw.js").then(reg => {
      if (reg.waiting && navigator.serviceWorker.controller) avisoActualizacion(reg.waiting);
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        nw && nw.addEventListener("statechange", () => { if (nw.state === "installed" && navigator.serviceWorker.controller) avisoActualizacion(nw); });
      });
      setInterval(() => reg.update().catch(() => {}), 30 * 60000);
    }).catch(() => {});
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  /* ---------------- Init ---------------- */
  render(); // paint immediately (login or shell), capabilities resolve async
  mostrarIntro();
  initCapabilities();
})();
</script>
</body>
</html>
